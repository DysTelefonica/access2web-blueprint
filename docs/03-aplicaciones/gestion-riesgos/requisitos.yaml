      - id: RIE-F014-R20
        descripcion: Para publicar, el usuario debe estar autorizado en el proyecto («El perfil de su usuario no tiene autorización para realizar esta operación»).
        evidencia: ["src/classes/Edicion.cls:2988"]
      - id: RIE-F014-R21
        descripcion: La fecha de publicación es la de hoy; si la edición no tenía fecha de propuesta, se le pone también la de hoy.
