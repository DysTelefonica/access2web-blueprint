        evidencia: ["src/modules/PublicabilidadRiesgo.bas:644"]
      - id: RIE-F014-R19
        descripcion: Para publicar, la edición debe tener quién elabora, quién revisa y quién aprueba, y quien elabora no puede ser quien revisa («El Usuario que Elabora no puede ser el mismo que revisa»).
        evidencia: ["src/classes/Edicion.cls:3011", "src/classes/Edicion.cls:3023"]
