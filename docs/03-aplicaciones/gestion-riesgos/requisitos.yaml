  - id: RIE-F022
    area: Ediciones
    nombre: Eliminar la edición
    descripcion: >-
      Calidad borra la edición activa y la edición anterior vuelve a quedar sin publicar.
    formulario: «gestión de riesgos» ed. «n.º»
    control: Eliminar edición
    tipo: botón
    roles: [Calidad, Administrador]
    resultado: >-
      La edición desaparece y la anterior pasa a ser la edición activa, sin fecha de publicación ni de propuesta y sin informe archivado.
    tecnico:
      formulario: Form_FormRiesgosGestionEdicion
      control: ComandoEliminarEdicion
      evidencia: ["src/forms/Form_FormRiesgosGestionEdicion.cls:199", "src/classes/Edicion.cls:2857"]
    reglas:
      - id: RIE-F022-R01
        descripcion: El botón solo se habilita para usuarios que no son técnicos, con permiso de edición y si la edición no es la primera.
        evidencia: ["src/forms/Form_FormRiesgosGestionEdicion.cls:499"]
        # posible defecto: al seleccionar una edición activa en el árbol, el permiso de edición se concede tanto si el usuario está autorizado como si no (src/forms/Form_FormRiesgosGestion.cls:803).
      - id: RIE-F022-R02
        descripcion: No se puede borrar la primera edición («Es la primera edición y una gestión de riesgos al menos ha de tener una. Si lo desea, debe borrar la gestión de riesgos completa»).
        evidencia: ["src/classes/GestionRiesgosEdicionDeleteDecisionService.cls:34"]
      - id: RIE-F022-R03
        descripcion: Un técnico no puede borrar ediciones («Desde el 17/12/2019 sólo un miembro de Calidad puede borrar una edición»).
        evidencia: ["src/classes/GestionRiesgosEdicionDeleteDecisionService.cls:39"]
      - id: RIE-F022-R04
        descripcion: Si hay cambios respecto a la edición anterior se pide confirmación adicional («Se han producido cambios con la edición anterior ¿Desea seguir eliminando la edición?»).
        evidencia: ["src/forms/Form_FormRiesgosGestionEdicion.cls:240"]
      - id: RIE-F022-R05
        descripcion: Siempre se pide confirmación con «¿Desea realmente borrar completamente la edición seleccionada?».
        evidencia: ["src/forms/Form_FormRiesgosGestionEdicion.cls:253"]
      - id: RIE-F022-R06
        descripcion: No se puede borrar si el informe de la edición anterior está abierto («Se tiene abierto el informe de la edición anterior»).
        evidencia: ["src/classes/GestionRiesgosEdicionDeleteDecisionService.cls:75"]
      - id: RIE-F022-R07
        descripcion: Solo se puede borrar la última edición sin publicar y con el usuario autorizado en el proyecto.
        evidencia: ["src/classes/Edicion.cls:3801", "src/classes/Edicion.cls:3809"]
      - id: RIE-F022-R08
        descripcion: Al borrar, la edición anterior pierde su fecha de publicación, su fecha de propuesta y, si lo tenía, su informe en el gestor documental AGEDO, y vuelve a ser la activa.
        evidencia: ["src/classes/Edicion.cls:2908", "src/classes/Edicion.cls:2916"]
      - id: RIE-F022-R09
        descripcion: Se borra el historial de publicaciones de la edición eliminada y se recalculan las tareas de Calidad y la fecha máxima de la próxima publicación.
        evidencia: ["src/classes/Edicion.cls:2926", "src/forms/Form_FormRiesgosGestionEdicion.cls:285", "src/forms/Form_FormRiesgosGestionEdicion.cls:294"]

  - id: RIE-F023
    area: Ediciones
    nombre: Reabrir la gestión de riesgos cerrada
    descripcion: >-
      Calidad deshace la última publicación de una gestión de riesgos cerrada para volver a trabajar sobre esa edición.
    formulario: «gestión de riesgos» ed. «n.º»
    control: Qutar última publicación
    tipo: botón
    roles: [Calidad, Administrador]
    resultado: >-
      La última edición deja de estar publicada, sus acciones recuperan las fechas que tenían y la gestión de riesgos deja de estar cerrada.
    tecnico:
      formulario: Form_FormRiesgosGestionEdicion
      control: ComandoAbrirProyecto
      evidencia: ["src/forms/Form_FormRiesgosGestionEdicion.cls:23", "src/classes/Proyecto.cls:1537"]
    reglas:
      - id: RIE-F023-R01
        descripcion: El botón solo aparece a usuarios que no son técnicos cuando la gestión de riesgos está cerrada, y actúa siempre sobre la última edición, sea cual sea la seleccionada.
        evidencia: ["src/forms/Form_FormRiesgosGestionEdicion.cls:504", "src/forms/Form_FormRiesgosGestionEdicion.cls:534", "src/classes/Proyecto.cls:1569"]
      - id: RIE-F023-R02
        descripcion: Se pide confirmación con «¿Desea realmente quitar la última publicación y convertir esa edición e la edición activa?».
        evidencia: ["src/forms/Form_FormRiesgosGestionEdicion.cls:29"]
      - id: RIE-F023-R03
        descripcion: Si la gestión de riesgos no está cerrada se muestra «El Proyecto no aparece como cerrado».
        evidencia: ["src/classes/Proyecto.cls:1548"]
      - id: RIE-F023-R04
        descripcion: Para quitar la publicación el usuario debe estar autorizado, la edición debe estar publicada y ser la última («Ha de ser la última Edición»).
        evidencia: ["src/classes/Edicion.cls:3933", "src/classes/Edicion.cls:3942", "src/classes/Edicion.cls:3947"]
      - id: RIE-F023-R05
        descripcion: Si el informe publicado está abierto se muestra «Antes de borrar la publicación ha de cerrar el informe».
        evidencia: ["src/classes/Edicion.cls:3868"]
      - id: RIE-F023-R06
        descripcion: Se borran la fecha de publicación y el informe archivado (en AGEDO o en la carpeta de documentación).
        evidencia: ["src/classes/Edicion.cls:3885", "src/classes/Edicion.cls:3895"]
      - id: RIE-F023-R07
        descripcion: Las acciones cerradas al publicar recuperan la fecha fin real que tenían antes, o quedan sin ella.
        evidencia: ["src/classes/Proyecto.cls:1583", "src/classes/Edicion.cls:2760"]
      - id: RIE-F023-R08
        descripcion: La gestión de riesgos deja de estar cerrada.
        evidencia: ["src/classes/Proyecto.cls:1588"]

