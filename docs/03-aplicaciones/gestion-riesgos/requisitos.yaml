features:
  - id: RIE-F001
    area: Publicación
    nombre: Abrir la publicación de la edición
    descripcion: >-
      Desde el detalle de una edición, abre la ventana donde se propone, revisa y publica esa edición.
      El técnico y Calidad ven ventanas distintas.
    formulario: «gestión de riesgos» ed. «n.º»
    control: Publicación
    tipo: botón
    roles: []
    resultado: >-
      Se abre la ventana de propuesta de publicación (técnico) o la de publicación de Calidad (resto de perfiles).
    tecnico:
      formulario: Form_FormRiesgosGestionEdicion
      control: ComandoPublicacion
      evidencia:
        - "src/forms/Form_FormRiesgosGestionEdicion.cls:166"
        - "src/forms/Form_FormRiesgosGestion.cls:44"
        - "src/forms/Form_FormCalidadTareasDetalleEdicion.cls:138"
        - "src/forms/Form_FormTecnicoTareasDetalleEdicion.cls:40"
    reglas:
      - id: RIE-F001-R01
        descripcion: El botón «Publicación» está siempre activo, sea cual sea el estado de la edición o el perfil del usuario.
        evidencia: ["src/forms/Form_FormRiesgosGestionEdicion.cls:413"]
      - id: RIE-F001-R02
        descripcion: Si el usuario es técnico se abre la ventana de propuesta de publicación; en cualquier otro caso (Calidad o administrador) se abre la ventana de publicación de Calidad.
        evidencia: ["src/forms/Form_FormRiesgosGestionEdicion.cls:175", "src/forms/Form_FormRiesgosGestion.cls:53"]
      - id: RIE-F001-R03
        descripcion: Es técnico todo usuario que no es administrador ni pertenece a Calidad.
        evidencia: ["src/modules/Variables Globales.bas:720"]
      - id: RIE-F001-R04
        descripcion: La misma ventana se abre también con el botón «Ir a publicar» del detalle de una edición en las tareas pendientes de Calidad y en las del técnico.
        evidencia: ["src/forms/Form_FormCalidadTareasDetalleEdicion.cls:150", "src/forms/Form_FormTecnicoTareasDetalleEdicion.cls:58"]

  - id: RIE-F002
    area: Publicación
    nombre: Consultar la publicación de la edición (técnico)
    descripcion: >-
      Al abrirse, la ventana del técnico muestra el código y el número de la edición y decide qué pestañas y acciones puede usar.
    formulario: «código» Ed. «n.º»
    control: ""
    tipo: automático
    roles: [Técnico]
    resultado: >-
      La ventana queda con las pestañas «Propuesta de publicación», «Acuerdo UTE» y «Sol. Riesgos suministradores» habilitadas según el proyecto.
    tecnico:
      formulario: Form_FormPublicacionTecnico
      control: Form_Load
      evidencia: ["src/forms/Form_FormPublicacionTecnico.cls:66"]
      prd: prd/formularios/Form_FormPublicacionTecnico.md
    reglas:
      - id: RIE-F002-R01
        descripcion: Si no hay ninguna edición seleccionada, la ventana muestra «No hay ninguna edición activa» y se cierra.
        evidencia: ["src/forms/Form_FormPublicacionTecnico.cls:82"]
      - id: RIE-F002-R02
        descripcion: El usuario solo puede modificar datos si la edición está activa y está autorizado en el proyecto.
        evidencia: ["src/forms/Form_FormPublicacionTecnico.cls:91"]
      - id: RIE-F002-R03
        descripcion: Una edición está activa si es la última de la gestión de riesgos y todavía no está publicada.
        evidencia: ["src/classes/Edicion.cls:1376"]
      - id: RIE-F002-R04
        descripcion: Está autorizado en el proyecto todo administrador, todo miembro de Calidad y toda persona cuyo nombre figure entre los responsables autorizados del proyecto.
        evidencia: ["src/modules/Funciones Generales.bas:830", "src/classes/Proyecto.cls:3800"]
        # posible defecto: el nombre se busca como texto dentro de la lista de autorizados, de modo que un nombre contenido en otro más largo también se acepta (src/classes/Proyecto.cls:3816).
      - id: RIE-F002-R05
        descripcion: La pestaña «Acuerdo UTE» solo está habilitada si el proyecto está en UTE.
        evidencia: ["src/forms/Form_FormPublicacionTecnico.cls:102"]
      - id: RIE-F002-R06
        descripcion: La pestaña «Sol. Riesgos suministradores» solo está habilitada si el expediente tiene suministradores que requieren evidencia de acuerdo.
        evidencia: ["src/forms/Form_FormPublicacionTecnico.cls:108", "src/classes/Edicion.cls:4516"]

  - id: RIE-F003
    area: Publicación
    nombre: Consultar la publicación de la edición (Calidad)
    descripcion: >-
      Al abrirse, la ventana de Calidad muestra el código, el número de la edición y si está activa, y decide qué pestañas se pueden usar.
    formulario: «código» Ed. «n.º» (edición activa | edición no activa)
    control: ""
    tipo: automático
    roles: [Calidad, Administrador]
    resultado: >-
      La ventana queda con las pestañas «Publicación», «Datos generales», «Acuerdo UTE», «Suministradores» y «Notas Calidad», habilitadas según el proyecto.
    tecnico:
      formulario: Form_FormPublicacionCalidad
      control: Form_Load
      evidencia: ["src/forms/Form_FormPublicacionCalidad.cls:40"]
      prd: prd/formularios/Form_FormPublicacionCalidad.md
    reglas:
      - id: RIE-F003-R01
        descripcion: Si no hay ninguna edición seleccionada, la ventana muestra «No hay ninguna edición activa» y se cierra.
        evidencia: ["src/forms/Form_FormPublicacionCalidad.cls:58"]
      - id: RIE-F003-R02
        descripcion: El título indica «(edición activa)» o «(edición no activa)» según el estado de la edición.
        evidencia: ["src/forms/Form_FormPublicacionCalidad.cls:63"]
      - id: RIE-F003-R03
        descripcion: El usuario solo puede modificar evidencias si la edición está activa y está autorizado en el proyecto.
        evidencia: ["src/forms/Form_FormPublicacionCalidad.cls:72"]
      - id: RIE-F003-R04
        descripcion: La pestaña «Acuerdo UTE» solo está habilitada si el proyecto está en UTE.
        evidencia: ["src/forms/Form_FormPublicacionCalidad.cls:84"]
      - id: RIE-F003-R05
        descripcion: La pestaña «Suministradores» solo está habilitada si el expediente tiene suministradores que requieren evidencia de acuerdo.
        evidencia: ["src/forms/Form_FormPublicacionCalidad.cls:90"]
      - id: RIE-F003-R06
        descripcion: La ventana se abre siempre por la pestaña «Publicación».
        evidencia: ["src/forms/Form_FormPublicacionCalidad.cls:128"]

  - id: RIE-F004
    area: Publicación
    nombre: Mostrar el estado de la propuesta y de las evidencias
    descripcion: >-
      La pestaña de publicación indica si se exigen y están aportadas las evidencias de acuerdo con la UTE y con los suministradores,
      y en qué punto está la propuesta de publicación.
    formulario: Publicación
    control: ""
    tipo: automático
    roles: [Técnico, Calidad, Administrador]
    resultado: >-
      El usuario ve «Requerido / No requerido», «Complementado / No complementado / N/A» y un rótulo con el estado de la propuesta.
    tecnico:
      formulario: Form_FormPublicacionCalidadPublicar
      control: EstablecerDatos
      evidencia:
        - "src/forms/Form_FormPublicacionCalidadPublicar.cls:304"
        - "src/forms/Form_FormPublicacionTecnicoPropuesta.cls:172"
      prd: prd/formularios/Form_FormPublicacionCalidadPublicar.md
    reglas:
      - id: RIE-F004-R01
        descripcion: Si el proyecto está en UTE, la evidencia de acuerdo con la UTE figura como «Requerido» y como «Complementado» o «No complementado» según haya anexo; si no, figura «No Requerido» y «N/A».
        evidencia: ["src/classes/PublicacionCalidadStatusPresenter.cls:52", "src/forms/Form_FormPublicacionTecnicoPropuesta.cls:181"]
      - id: RIE-F004-R02
        descripcion: En la vista del técnico, la evidencia de suministradores figura como «Requerido» solo si el expediente tiene suministradores, y como «Complementado» cuando todos tienen anexo.
        evidencia: ["src/forms/Form_FormPublicacionTecnicoPropuesta.cls:195"]
      - id: RIE-F004-R03
        descripcion: En la vista de Calidad, la evidencia de suministradores figura como «Requerido» siempre que el proyecto tenga expediente, aunque el expediente no tenga suministradores.
        evidencia: ["src/forms/Form_FormPublicacionCalidadPublicar.cls:318", "src/modules/SuministradoresHelper.bas:203"]
        # posible defecto: la lista de suministradores siempre existe (aunque esté vacía), por lo que Calidad ve «Requerido» donde el técnico ve «No requerido».
      - id: RIE-F004-R04
        descripcion: Con la edición activa y sin propuesta, el rótulo dice «SIN PROPUESTA TÉCNICA».
        evidencia: ["src/classes/PublicacionCalidadStatusPresenter.cls:115", "src/forms/Form_FormPublicacionTecnicoPropuesta.cls:223"]
      - id: RIE-F004-R05
        descripcion: Con la edición activa y propuesta sin rechazo, el rótulo dice «PROPUESTA («fecha») ESPERANDO A CALIDAD».
        evidencia: ["src/classes/PublicacionCalidadStatusPresenter.cls:118", "src/forms/Form_FormPublicacionTecnicoPropuesta.cls:227"]
      - id: RIE-F004-R06
        descripcion: Con la edición activa, propuesta y rechazo registrado, el rótulo dice «PROPUESTA («fecha») RECHAZADA («fecha»)» y aparece el botón «Ver motivos»; en la vista del técnico solo si la propuesta no es posterior al rechazo.
        evidencia: ["src/classes/PublicacionCalidadStatusPresenter.cls:124", "src/forms/Form_FormPublicacionTecnicoPropuesta.cls:232"]
        # posible defecto: al rechazar se borra la fecha de propuesta (src/classes/Edicion.cls:3475), así que tras un rechazo el rótulo vuelve a «SIN PROPUESTA TÉCNICA» y el estado «RECHAZADA» no llega a mostrarse.
      - id: RIE-F004-R07
        descripcion: Con la edición ya publicada, el botón principal pasa a llamarse «Publicado», las acciones se deshabilitan y el rótulo indica la fecha de propuesta y la de publicación.
        evidencia: ["src/classes/PublicacionCalidadStatusPresenter.cls:131", "src/forms/Form_FormPublicacionTecnicoPropuesta.cls:246"]

  - id: RIE-F005
    area: Publicación
    nombre: Proponer la edición para publicación
    descripcion: >-
      El técnico declara que la edición está lista y la propone a Calidad para que la publique.
    formulario: Propuesta de publicación
    control: Proponer para publicación
    tipo: botón
    roles: [Técnico]
    resultado: >-
      La edición queda propuesta con fecha de hoy, se anula cualquier rechazo anterior y se envía un correo al responsable de Calidad del proyecto.
    tecnico:
      formulario: Form_FormPublicacionTecnicoPropuesta
      control: ComandoProponerPublicacion
      evidencia: ["src/forms/Form_FormPublicacionTecnicoPropuesta.cls:277", "src/classes/Edicion.cls:3281"]
      prd: prd/formularios/Form_FormPublicacionTecnicoPropuesta.md
    reglas:
      - id: RIE-F005-R01
        descripcion: El botón solo está habilitado si la edición está activa y el usuario está autorizado en el proyecto.
        evidencia: ["src/forms/Form_FormPublicacionTecnicoPropuesta.cls:210"]
      - id: RIE-F005-R02
        descripcion: El botón muestra «Proponer para publicación» si la edición no está propuesta y «Quitar propuesta para publicación» si ya lo está.
        evidencia: ["src/forms/Form_FormPublicacionTecnicoPropuesta.cls:216"]
      - id: RIE-F005-R03
        descripcion: Si la edición no es publicable (mismas comprobaciones que RIE-F014-R04 a RIE-F014-R18), se abre el informe de publicabilidad y se muestra «No ha superado el informe de publicabilidad. Solvente las no conformidades y repita el proceso».
        evidencia: ["src/forms/Form_FormPublicacionTecnicoPropuesta.cls:302"]
