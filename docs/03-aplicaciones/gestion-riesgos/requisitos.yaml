      - id: RIE-F014-R15
        descripcion: Un riesgo materializado debe tener un plan de mitigación activo y, si no tiene plan de contingencia activo, una justificación escrita del técnico.
        evidencia: ["src/modules/PublicabilidadRiesgo.bas:190", "src/modules/PublicabilidadRiesgo.bas:215"]
      - id: RIE-F014-R16
        descripcion: Un riesgo alto o muy alto no materializado debe tener un plan de mitigación activo y algún plan de contingencia no finalizado.
        evidencia: ["src/modules/PublicabilidadRiesgo.bas:231"]
      - id: RIE-F014-R17
