      - id: RIE-F014-R22
        descripcion: Quién elabora, revisa y aprueba la edición publicada se toma de la gestión de riesgos en ese momento.
        evidencia: ["src/modules/Funciones Generales.bas:5289"]
      - id: RIE-F014-R23
        descripcion: El informe oficial se genera siempre en PDF y su control de cambios recoge solo las tres últimas versiones, sea cual sea la opción elegida en «Control de cambios».
        evidencia: ["src/modules/Funciones Generales.bas:5267", "src/modules/Funciones Generales.bas:5197", "src/modules/Funciones Generales.bas:1481"]
      - id: RIE-F014-R24
        descripcion: Si la entidad jurídica del proyecto es TdE, el informe se da de alta en el gestor documental AGEDO como «Informe de seguimiento de Riesgos» con el código de documento de la gestión de riesgos.
        evidencia: ["src/modules/Funciones Generales.bas:5293", "src/modules/Funciones Generales.bas:5447"]
        # posible defecto: si el alta en AGEDO falla (por ejemplo, «NO se ha podido obtener el código del documento»), el error se descarta y la edición se publica sin informe archivado (src/modules/Funciones Generales.bas:5298).
      - id: RIE-F014-R25
        descripcion: Si la entidad jurídica no es TdE, el informe se copia a la carpeta de documentación de la aplicación.
        evidencia: ["src/modules/Funciones Generales.bas:5306"]
      - id: RIE-F014-R26
        descripcion: Publicar borra la fecha y el motivo de cualquier rechazo previo de la propuesta.
        evidencia: ["src/modules/Funciones Generales.bas:5313"]
      - id: RIE-F014-R27
        descripcion: Si no es la última publicación, se crea la edición siguiente con número consecutivo, fecha de hoy y los mismos responsables, y se copian todos los riesgos con sus planes y acciones.
        evidencia: ["src/modules/Funciones Generales.bas:5319", "src/modules/Funciones Generales.bas:4217", "src/modules/Funciones Generales.bas:4067"]
      - id: RIE-F014-R28
        descripcion: Solo se crea la edición siguiente si la publicada es la última, la gestión de riesgos no está cerrada y la edición tiene fecha de publicación.
        evidencia: ["src/modules/Funciones Generales.bas:3966"]
      - id: RIE-F014-R29
        descripcion: Si la gestión de riesgos no exige riesgos de biblioteca, la priorización no se copia a la nueva edición; si los exige, sí se copia.
        evidencia: ["src/modules/Funciones Generales.bas:4056"]
      - id: RIE-F014-R30
        descripcion: La nueva edición se sincroniza con los suministradores que tenga en ese momento el expediente.
        evidencia: ["src/modules/Funciones Generales.bas:4160"]
      - id: RIE-F014-R31
        descripcion: Si falla la creación de la nueva edición, la edición a medio crear se borra.
        evidencia: ["src/modules/Funciones Generales.bas:4171"]
      - id: RIE-F014-R32
        descripcion: Si es la última publicación, antes del informe se cierran las acciones abiertas poniendo hoy como fecha fin real y se guardan sus fechas anteriores para poder reabrir.
        evidencia: ["src/modules/Funciones Generales.bas:5253", "src/classes/Edicion.cls:2555", "src/classes/Edicion.cls:2641"]
      - id: RIE-F014-R33
        descripcion: Si es la última publicación, los riesgos no retirados ni aceptados pasan a estado «Cerrado» con fecha de hoy y la gestión de riesgos queda cerrada con fecha de hoy.
        evidencia: ["src/classes/Edicion.cls:3643", "src/modules/Funciones Generales.bas:5329"]
      - id: RIE-F014-R34
        descripcion: La publicación queda anotada en el historial de publicaciones con fecha y nombre del usuario.
        evidencia: ["src/modules/Funciones Generales.bas:5339"]
      - id: RIE-F014-R35
        descripcion: La edición publicada guarda como fecha máxima de la próxima publicación la de hoy más los meses configurados entre ediciones (tres por defecto).
        evidencia: ["src/classes/Edicion.cls:3092", "src/classes/Entorno.cls:793"]
      - id: RIE-F014-R36
        descripcion: Tras publicar se recalculan las tareas pendientes de Calidad.
        evidencia: ["src/forms/Form_FormPublicacionCalidadPublicarEjecutar.cls:191"]
      - id: RIE-F014-R37
        descripcion: Solo si la gestión de riesgos tiene activados los avisos se envía el correo de publicación con el informe adjunto.
        evidencia: ["src/forms/Form_FormPublicacionCalidadPublicarEjecutar.cls:195", "src/classes/Correo.cls:609"]
      - id: RIE-F014-R38
        descripcion: El asunto es «Edición Publicada «n.º»:«proyecto» (gestión de riesgos)», o «Última Edición Publicada «n.º»:...» si la gestión de riesgos ha quedado cerrada.
        evidencia: ["src/classes/Correo.cls:534"]
      - id: RIE-F014-R39
        descripcion: El correo va a los responsables autorizados del proyecto, con copia al buzón de Calidad, al RAC solo si se eligió enviárselo, y copia oculta a los administradores.
        evidencia: ["src/classes/Correo.cls:570", "src/classes/Correo.cls:587", "src/classes/Correo.cls:599"]
      - id: RIE-F014-R40
        descripcion: En el entorno de pruebas el correo de publicación va solo al buzón de Calidad y el asunto lleva «EN PRUEBAS».
        evidencia: ["src/classes/Correo.cls:567", "src/classes/Correo.cls:543"]
      - id: RIE-F014-R41
        descripcion: El cuerpo del correo indica edición, fecha, quién elabora, revisa y aprueba, y la fecha de la próxima publicación.
        evidencia: ["src/modules/Funciones Generales.bas:254"]
      - id: RIE-F014-R42
        descripcion: Si hay correos de la aplicación grabados hace más de una hora sin enviar, se avisa «Hay «n» correos pendientes de envío desde hace más de 1 hora. Revise el registro del servicio externo.».
        evidencia: ["src/forms/Form_FormPublicacionCalidadPublicarEjecutar.cls:269", "src/modules/modAvisoPublicacionHelper.bas:210"]
        # posible defecto: el recuento incluye todos los correos grabados hace más de una hora, sin filtrar si ya se enviaron (src/modules/modAvisoPublicacionHelper.bas:213).
      - id: RIE-F014-R43
        descripcion: Al terminar se pregunta «¿Desea ver el informe de la edición generada?» y, si se acepta, se abre el informe.
        evidencia: ["src/forms/Form_FormPublicacionCalidadPublicarEjecutar.cls:209"]
      - id: RIE-F014-R44
        descripcion: Al terminar se cierran la ventana de publicación y la de riesgos de la edición.
        evidencia: ["src/forms/Form_FormPublicacionCalidadPublicarEjecutar.cls:231"]

  - id: RIE-F015
    area: Publicación
    nombre: Calcular la fecha de la próxima publicación
    descripcion: >-
      Al preparar la publicación se propone la fecha máxima de la siguiente publicación, que Calidad puede cambiar,
      y se indica si esta es la última publicación de la gestión de riesgos.
    formulario: PUBLICACIÓN POR CALIDAD
    control: 5) Próxima publicación
    tipo: campo
    roles: [Calidad, Administrador]
    resultado: >-
      La nueva edición y la gestión de riesgos quedan con la fecha máxima de la próxima publicación.
    tecnico:
      formulario: Form_FormPublicacionCalidadPublicarEjecutar
      control: FechaMaxProximaPublicacion
      evidencia:
        - "src/forms/Form_FormPublicacionCalidadPublicarEjecutar.cls:365"
        - "src/modules/Funciones Generales.bas:9157"
    reglas:
      - id: RIE-F015-R01
        descripcion: El campo «4) Es última publicación» se abre siempre en «No».
        evidencia: ["src/forms/Form_FormPublicacionCalidadPublicarEjecutar.cls:433"]
        # posible defecto: la propuesta automática según la fecha prevista de cierre (src/forms/Form_FormPublicacionCalidadPublicarEjecutar.cls:424) queda anulada por la línea 433.
      - id: RIE-F015-R02
        descripcion: Al cambiar «4) Es última publicación» se recalcula la fecha de la próxima publicación.
        evidencia: ["src/forms/Form_FormPublicacionCalidadPublicarEjecutar.cls:402"]
      - id: RIE-F015-R03
        descripcion: Si es la última publicación, o la gestión de riesgos ya está cerrada, la fecha de la próxima publicación queda vacía.
        evidencia: ["src/modules/Funciones Generales.bas:9191", "src/modules/Funciones Generales.bas:9210"]
      - id: RIE-F015-R04
        descripcion: La fecha propuesta es la de hoy más los meses configurados entre ediciones (tres por defecto).
        evidencia: ["src/modules/Funciones Generales.bas:9217", "src/classes/Entorno.cls:793"]
      - id: RIE-F015-R05
        descripcion: Si el expediente tiene fecha prevista de cierre futura, la fecha propuesta no supera esa fecha más quince días.
        evidencia: ["src/modules/Funciones Generales.bas:9224", "src/modules/Funciones Generales.bas:9228"]
      - id: RIE-F015-R06
        descripcion: Calidad puede escribir otra fecha; si la deja vacía se usa la calculada por la gestión de riesgos.
        evidencia: ["src/forms/Form_FormPublicacionCalidadPublicarEjecutar.cls:183", "src/modules/Funciones Generales.bas:4572"]
      - id: RIE-F015-R07
        descripcion: Al publicar, si la fecha difiere de la guardada, se guarda en la gestión de riesgos y en la nueva edición todavía sin publicar.
        evidencia: ["src/modules/Funciones Generales.bas:4580", "src/modules/Funciones Generales.bas:4596"]
      - id: RIE-F015-R08
        descripcion: La ventana muestra también, como consulta, las fechas de inicio y fin de contrato que da la herramienta de Expedientes y el correo del RAC del expediente.
        evidencia: ["src/forms/Form_FormPublicacionCalidadPublicarEjecutar.cls:434", "src/forms/Form_FormPublicacionCalidadPublicarEjecutar.cls:440"]

