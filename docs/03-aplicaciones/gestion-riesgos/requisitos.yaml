        descripcion: «Actualizar» solo funciona con la edición activa y el usuario autorizado; si no, muestra «No se puede sincronizar los suministradores registrados para esta edición de los que ahora tiene el expediente».
        evidencia: ["src/forms/Form_FormPublicacionSuministradores.cls:69", "src/forms/Form_FormPublicacionSuministradores.cls:289"]

  - id: RIE-F021
