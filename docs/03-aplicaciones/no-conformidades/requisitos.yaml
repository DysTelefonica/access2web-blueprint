        descripcion: Una NC marcada como borrada está «Borrada».
        evidencia: ["src/classes/NCProyecto.cls:484"]
      - id: NC-F015-R02
        descripcion: Una NC sin acciones correctivas está «Registrada».
        evidencia: ["src/classes/NCProyecto.cls:490"]
