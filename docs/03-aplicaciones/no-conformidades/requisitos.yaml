  - id: NC-F017
    area: NC de proyecto
    nombre: Marcar como borrada o habilitar una NC de proyecto
    descripcion: >-
      Marca la NC seleccionada como borrada indicando un motivo, o la vuelve a habilitar si ya estaba borrada.
    formulario: GESTIÓN DE NC DE PROYECTOS
    control: Eliminar | Habilitar
    tipo: botón
    roles: [Calidad, Administrador]
    resultado: >-
      La NC pasa a estado «Borrada» con su motivo, o recupera su estado calculado al habilitarla.
    tecnico:
      formulario: Form_FormNCProyectoGestion
      control: ComandoEliminar
      evidencia: ["src/forms/Form_FormNCProyectoGestion.cls:314", "src/classes/NCProyectoOperaciones.cls:815", "src/classes/NCProyectoOperaciones.cls:962"]
    reglas:
      - id: NC-F017-R01
        descripcion: Si el usuario es técnico se muestra «No tiene autorización para esa acción»; si no hay NC seleccionada, «Seleccione un elemento de la lista».
        evidencia: ["src/forms/Form_FormNCProyectoGestion.cls:325", "src/forms/Form_FormNCProyectoGestion.cls:334"]
      - id: NC-F017-R02
        descripcion: El botón se llama «Habilitar» si la NC seleccionada está borrada y «Eliminar» en caso contrario.
        evidencia: ["src/forms/Form_FormNCProyectoGestion.cls:1252"]
      - id: NC-F017-R03
        descripcion: Para borrar se pide confirmación con «¿Desea marcar como borrado la no conformidad de proyecto seleccionada?» y después el motivo con «Introduzca el motivo para marcar como borrada la no conformidad».
        evidencia: ["src/forms/Form_FormNCProyectoGestion.cls:343"]
        # posible defecto: el motivo se pide aunque el usuario haya contestado «No» a la confirmación; después no se borra nada.
      - id: NC-F017-R04
        descripcion: Si no se escribe un motivo se muestra «Falta el motivo del borrado» y la NC no se borra.
        evidencia: ["src/classes/NCProyectoOperaciones.cls:840"]
      - id: NC-F017-R05
        descripcion: Borrar no elimina la NC ni sus acciones, sino que la marca como borrada con su motivo y recalcula su estado.
        evidencia: ["src/classes/NCProyectoOperaciones.cls:844", "src/classes/NCProyectoOperaciones.cls:859"]
        # posible defecto: el borrado no deja entrada en el historial ni recalcula los contadores de seguimiento, a diferencia de la habilitación (src/classes/NCProyectoOperaciones.cls:866).
      - id: NC-F017-R06
        descripcion: Para habilitar se pide confirmación con «¿Desea habilitar la no conformidad de proyecto seleccionada?»; se borra el motivo, se recalcula el estado y se anota «Habilitación de No Conformidad» en el historial.
        evidencia: ["src/forms/Form_FormNCProyectoGestion.cls:347", "src/classes/NCProyectoOperaciones.cls:971", "src/classes/NCProyectoOperaciones.cls:996"]
      - id: NC-F017-R07
        descripcion: Tras borrar o habilitar se recarga la lista manteniendo la NC seleccionada.
        evidencia: ["src/forms/Form_FormNCProyectoGestion.cls:370"]

