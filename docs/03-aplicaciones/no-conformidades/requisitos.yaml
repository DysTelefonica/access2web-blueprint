    reglas:
      - id: NC-F050-R01
        descripcion: Al abrirse se propone el año en curso y el semestre actual (S1 de enero a junio, S2 de julio a diciembre); los resultados aparecen como «-» hasta calcular.
        evidencia: ["src/forms/Form_FormIndicadores.cls:102", "src/forms/Form_FormIndicadores.cls:113"]
      - id: NC-F050-R02
        descripcion: El periodo va del 1 de enero al 30 de junio para S1 y del 1 de julio al 31 de diciembre para S2; con un año no válido se usa el año en curso completo.
        evidencia: ["src/classes/IndicadorServicio.cls:29", "src/classes/IndicadorServicio.cls:41"]
      - id: NC-F050-R03
        descripcion: «NC ABIERTAS» cuenta las NC no borradas con fecha de apertura dentro del periodo.
        evidencia: ["src/modules/IndicadorRepositorio.bas:15"]
      - id: NC-F050-R04
        descripcion: «REPLANIFICADAS» cuenta las replanificaciones hechas dentro del periodo en NC no borradas que aumentaron la fecha máxima prevista de la NC; una NC con varias cuenta varias veces.
        evidencia: ["src/modules/IndicadorRepositorio.bas:44", "src/classes/ReplanificacionesProyectoOperaciones.cls:187"]
      - id: NC-F050-R05
        descripcion: «STOCK ACTIVO» cuenta las NC no borradas abiertas antes del inicio del periodo y que no estaban cerradas al empezar el periodo.
        evidencia: ["src/modules/IndicadorRepositorio.bas:55"]
      - id: NC-F050-R06
        descripcion: «CON RIESGO ASOC» cuenta las NC no borradas cuya última asociación con un riesgo se decidió dentro del periodo.
        evidencia: ["src/modules/IndicadorRepositorio.bas:74"]
      - id: NC-F050-R07
        descripcion: Si un cálculo falla, su total se muestra como -1.
        evidencia: ["src/classes/IndicadorServicio.cls:74"]
      - id: NC-F050-R08
        descripcion: Los indicadores cuentan todas las NC de proyecto, sin filtrar por expediente ni por usuario.
        evidencia: ["src/modules/IndicadorRepositorio.bas:7", "src/forms/Form_FormIndicadores.cls:121"]

