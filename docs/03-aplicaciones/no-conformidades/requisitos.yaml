        - "src/forms/Form_FormNCProyectoGeneralConVinculoNC.cls:144"
        - "src/classes/NCProyectoOperaciones.cls:576"
    reglas:
      - id: NC-F025-R01
        descripcion: El botón de la lista se llama «Alta NC vinculada a «código»», está desactivado para los técnicos y pide una NC seleccionada («Seleccione un elemento de la lista»).
        evidencia: ["src/forms/Form_FormNCProyectoGestion.cls:1231", "src/forms/Form_FormNCProyectoGestion.cls:30", "src/forms/Form_FormNCProyectoGestion.cls:40"]
      - id: NC-F025-R02
        descripcion: La ventana propone el expediente, la descripción, la entidad responsable y el «Detectado por» de la NC original, y la fecha de apertura de hoy.
        evidencia: ["src/forms/Form_FormNCProyectoGeneralConVinculoNC.cls:284", "src/forms/Form_FormNCProyectoGeneralConVinculoNC.cls:303"]
      - id: NC-F025-R03
        descripcion: El expediente se puede cambiar por palabra clave o con la búsqueda de expedientes, con las mismas reglas que en la ficha (NC-F026).
        evidencia: ["src/forms/Form_FormNCProyectoGeneralConVinculoNC.cls:13", "src/forms/Form_FormNCProyectoGeneralConVinculoNC.cls:107"]
      - id: NC-F025-R04
        descripcion: El responsable de Calidad y el jefe de proyecto se toman del expediente elegido.
        evidencia: ["src/forms/Form_FormNCProyectoGeneralConVinculoNC.cls:168", "src/forms/Form_FormNCProyectoGeneralConVinculoNC.cls:171"]
      - id: NC-F025-R05
        descripcion: Faltar el expediente, la descripción, «Detectado por» o la fecha de apertura impide el alta con los mensajes de NC-F016-R05 y NC-F016-R07.
        evidencia: ["src/classes/NCProyectoOperaciones.cls:30", "src/classes/NCProyectoOperaciones.cls:34", "src/classes/NCProyectoOperaciones.cls:38", "src/classes/NCProyectoOperaciones.cls:42"]
      - id: NC-F025-R06
        descripcion: La fecha de apertura no puede ser anterior a la de la NC original; se muestra «La fecha de apertura es anterior a la de la que está vinculada».
        evidencia: ["src/classes/NCProyectoOperaciones.cls:69"]
      - id: NC-F025-R07
        descripcion: La NC nueva copia de la original el vehículo, la causa raíz, la entidad responsable, la tipología, las fechas prevista y de cierre, las notas, el control de eficacia completo y el estado.
        evidencia: ["src/classes/NCProyectoOperaciones.cls:678", "src/modules/Funciones Generales.bas:2854", "src/classes/NCProyecto.cls:1734"]
        # posible defecto: la entidad responsable que se ve en la ventana no se usa; prevalece la de la NC original.
      - id: NC-F025-R08
        descripcion: La NC nueva recibe una copia de todas las acciones correctivas y de todas sus tareas, con sus fechas, responsables y notas.
        evidencia: ["src/modules/Funciones Generales.bas:2885", "src/modules/Funciones Generales.bas:2908"]
      - id: NC-F025-R09
        descripcion: El alta queda en el historial como «Alta de NC de Proyecto Vinculada a «código»».
        evidencia: ["src/classes/NCProyectoOperaciones.cls:683"]
      - id: NC-F025-R10
        descripcion: Al terminar se muestra «Registro correcto de la NC de Proyecto «código» asociada con la NC «código»», se refresca la lista y se cierra la ventana.
        evidencia: ["src/forms/Form_FormNCProyectoGeneralConVinculoNC.cls:192"]
      - id: NC-F025-R11
        descripcion: Solo se puede vincular durante el alta; si la NC ya existe se muestra «Solo se puede vincular a otra NC de proyecto en el alta».
        evidencia: ["src/classes/NCProyectoOperaciones.cls:590"]
      - id: NC-F025-R12
        descripcion: Si un técnico pulsa «Registrar» se muestra «No tiene autorización para esa acción».
        evidencia: ["src/forms/Form_FormNCProyectoGeneralConVinculoNC.cls:155"]

  - id: NC-F026
    area: NC de proyecto
    nombre: Asignar el expediente a la NC de proyecto
    descripcion: >-
      En la ficha se busca el expediente por palabra clave o con la ventana de expedientes; al elegirlo se rellenan sus datos.
