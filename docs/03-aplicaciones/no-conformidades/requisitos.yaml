    reglas:
      - id: NC-F027-R01
        descripcion: Si la ficha no tiene expediente se muestra «Debe seleccionar primero un Expediente para poder ver sus riesgos asociados.».
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:1133"]
      - id: NC-F027-R02
        descripcion: Se ofrecen los riesgos no retirados de la última edición de la gestión de riesgos del proyecto vinculado al expediente.
        evidencia: ["src/forms/Form_formRiesgosSeleccion.cls:62", "src/modules/RiesgoRepositorio.bas:57"]
      - id: NC-F027-R03
        descripcion: Al abrir la ventana aparecen marcados los riesgos ya asociados.
        evidencia: ["src/forms/Form_formRiesgosSeleccion.cls:89"]
      - id: NC-F027-R04
        descripcion: En una NC ya registrada la asociación se guarda al pulsar «Aceptar», sin necesidad de «Grabar», y queda anotada en el historial como «Vínculo de Riesgos».
        evidencia: ["src/forms/Form_formRiesgosSeleccion.cls:152", "src/classes/RiesgoServicio.cls:47"]
      - id: NC-F027-R05
        descripcion: En el alta la selección se guarda en memoria y se registra al grabar la NC (NC-F016-R19).
        evidencia: ["src/forms/Form_formRiesgosSeleccion.cls:173"]
      - id: NC-F027-R06
        descripcion: Al guardar se sustituyen todas las asociaciones anteriores y cada riesgo queda con la fecha de hoy como fecha de decisión.
        evidencia: ["src/modules/RiesgoRepositorio.bas:96", "src/modules/RiesgoRepositorio.bas:104"]
        # posible defecto: volver a aceptar sin cambios renueva la fecha de decisión de todos los riesgos, lo que altera el indicador «CON RIESGO ASOC» (src/modules/IndicadorRepositorio.bas:74).
      - id: NC-F027-R07
        descripcion: «Quitar Todos» desmarca todos los riesgos, pero no guarda hasta pulsar «Aceptar»; «Cancelar» cierra sin guardar.
        evidencia: ["src/forms/Form_formRiesgosSeleccion.cls:197", "src/forms/Form_formRiesgosSeleccion.cls:11"]
      - id: NC-F027-R08
        descripcion: Si la NC no tiene expediente la ventana avisa «La No Conformidad no tiene un expediente asignado.».
        evidencia: ["src/classes/RiesgoServicio.cls:21"]

  - id: NC-F028
    area: NC de proyecto
