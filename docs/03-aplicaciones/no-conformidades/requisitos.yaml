      formulario: Form_FormMotivosNoRequiereControlEficacia
      control: ComandoRegistrar
      evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:1162", "src/forms/Form_FormMotivosNoRequiereControlEficacia.cls:18", "src/forms/Form_FormNCProyectoGeneral.cls:791"]
      prd: prd/formularios/Form_FormMotivosNoRequiereControlEficacia.md
    reglas:
      - id: NC-F028-R01
        descripcion: El botón solo está activo si «Requiere control de eficacia» es «No».
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:697", "src/forms/Form_FormNCProyectoGeneral.cls:857"]
      - id: NC-F028-R02
        descripcion: El botón se llama «Meter Motivos No CE» si no hay motivo y «Ver Motivos No CE» si ya lo hay, con un icono de aviso.
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:699", "src/forms/Form_FormNCProyectoGeneral.cls:793"]
      - id: NC-F028-R03
        descripcion: La ventana muestra el motivo actual y «Registrar» lo devuelve a la ficha; «Salir» cierra sin cambios.
        evidencia: ["src/forms/Form_FormMotivosNoRequiereControlEficacia.cls:15", "src/forms/Form_FormMotivosNoRequiereControlEficacia.cls:25"]
      - id: NC-F028-R04
        descripcion: Si se cambia «Requiere control de eficacia» a «Sí» habiendo motivos, se pide confirmación con «Ya existen motivos de No Requiere Control de Eficacia. Al cambiar a 'Sí' se perderán. ¿Continuar?»; si se rechaza, vuelve a «No».
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:848"]
      - id: NC-F028-R05
        descripcion: El motivo es obligatorio para grabar una NC que no requiere control de eficacia (NC-F016-R03).
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:309"]

  - id: NC-F029
    area: NC de proyecto
    nombre: Planificar el control de eficacia desde la ficha
    descripcion: >-
      Cuando la NC requiere control de eficacia, se indican la fecha prevista y la descripción del control que se hará.
    formulario: Alta control de eficacia
    control: Datos alta control eficacia | Grabar
    tipo: botón
    roles: [Calidad, Administrador]
    resultado: >-
      La fecha prevista y la descripción del control se guardan junto con los datos generales de la NC.
    tecnico:
      formulario: Form_FormNCProyectoControlEficaciaAlta
      control: ComandoGrabar
      evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:249", "src/forms/Form_FormNCProyectoControlEficaciaAlta.cls:70"]
    reglas:
      - id: NC-F029-R01
        descripcion: «Datos alta control eficacia» solo está activo si la NC requiere control de eficacia, no está vinculada y el usuario no es técnico.
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:682", "src/forms/Form_FormNCProyectoGeneral.cls:843"]
      - id: NC-F029-R02
        descripcion: Si faltan datos generales obligatorios se muestra «Antes de rellenar este apartado ha de tener todos los datos obligatorios principales rellenos».
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:255", "src/forms/Form_FormNCProyectoControlEficaciaAlta.cls:104"]
      - id: NC-F029-R03
        descripcion: Si un técnico pulsa «Grabar» se muestra «No tiene autorización para esa acción»; si no hay cambios, «No hay cambios que guardar».
        evidencia: ["src/forms/Form_FormNCProyectoControlEficaciaAlta.cls:82", "src/forms/Form_FormNCProyectoControlEficaciaAlta.cls:96"]
      - id: NC-F029-R04
        descripcion: Al grabar se ejecuta la grabación de la ficha general con las mismas reglas (NC-F016) y la ventana se cierra.
        evidencia: ["src/forms/Form_FormNCProyectoControlEficaciaAlta.cls:111", "src/forms/Form_FormNCProyectoControlEficaciaAlta.cls:118"]
      - id: NC-F029-R05
        descripcion: La fecha prevista y la descripción del control son opcionales al grabar; solo se exigen al registrar el resultado (NC-F030).
        evidencia: ["src/classes/NCProyectoOperaciones.cls:1059", "src/classes/NCProyectoOperaciones.cls:1193"]
      - id: NC-F029-R06
        descripcion: No se puede guardar un control de eficacia conforme si no todas las tareas están terminadas; se muestra «No está permitido cerrar el control de eficacia conforme si no tiene todas las tareas cerradas previamente».
        evidencia: ["src/classes/NCProyectoOperaciones.cls:1040"]

  - id: NC-F030
    area: NC de proyecto
    nombre: Registrar el resultado del control de eficacia de una NC de proyecto
    descripcion: >-
      En la pestaña «Eficacia» se completa o modifica la planificación del control y se registra su fecha, su resultado y si ha sido conforme.
    formulario: Eficacia
    control: Grabar
    tipo: botón
    roles: [Calidad, Administrador]
    resultado: >-
      El control de eficacia queda registrado, el estado de la NC se recalcula y, si es conforme, la NC queda cerrada.
    tecnico:
      formulario: Form_FormNCProyectoControlEficacia
      control: ComandoGrabar
      evidencia: ["src/forms/Form_FormNCProyectoControlEficacia.cls:36", "src/classes/NCProyectoOperaciones.cls:1167"]
    reglas:
      - id: NC-F030-R01
        descripcion: Los técnicos ven la pestaña en solo lectura y, si pulsan «Grabar», se muestra «No tiene autorización para esa acción».
        evidencia: ["src/forms/Form_FormNCProyectoControlEficacia.cls:303", "src/forms/Form_FormNCProyectoControlEficacia.cls:49"]
      - id: NC-F030-R02
        descripcion: En una NC vinculada la pestaña muestra el control de eficacia de la NC original en solo lectura.
        evidencia: ["src/forms/Form_FormNCProyectoControlEficacia.cls:310", "src/forms/Form_FormNCProyectoControlEficacia.cls:316"]
      - id: NC-F030-R03
        descripcion: Si no se ha cambiado nada se muestra «No hay cambios que guardar».
        evidencia: ["src/forms/Form_FormNCProyectoControlEficacia.cls:61"]
      - id: NC-F030-R04
        descripcion: Si se vacían la fecha prevista y la descripción del control, se borra también el resultado ya registrado.
        evidencia: ["src/forms/Form_FormNCProyectoControlEficacia.cls:84"]
      - id: NC-F030-R05
        descripcion: Para registrar el resultado son obligatorios la fecha prevista («Se ha de indicar la fecha prevista para el control de eficacia»), la descripción («Se ha de indicar el control de eficacia que se va a llevar a cabo»), la fecha («Se ha de indicar la fecha del resultado del control de eficacia»), el resultado («Se ha de indicar el resultado del control de eficacia») y la conformidad («Se ha de indicar si ha sido conforme o no»).
        evidencia: ["src/classes/NCProyectoOperaciones.cls:1193", "src/classes/NCProyectoOperaciones.cls:1197", "src/classes/NCProyectoOperaciones.cls:1202", "src/classes/NCProyectoOperaciones.cls:1206", "src/classes/NCProyectoOperaciones.cls:1210"]
      - id: NC-F030-R06
        descripcion: Si la NC está marcada como que no requiere control de eficacia se muestra «La NC de proyecto tiene marcado que no requiere control de eficacia».
        evidencia: ["src/classes/NCProyectoOperaciones.cls:1189"]
      - id: NC-F030-R07
        descripcion: Un resultado conforme exige que la NC tenga acciones, que todas tengan tareas y que todas las tareas estén terminadas; si no, se muestra «No está permitido cerrar el control de eficacia conforme si no tiene todas las tareas cerradas previamente».
        evidencia: ["src/classes/NCProyectoOperaciones.cls:1214"]
      - id: NC-F030-R08
        descripcion: Si se vacía la fecha del resultado, se borran el resultado y la conformidad registrados.
        evidencia: ["src/forms/Form_FormNCProyectoControlEficacia.cls:105", "src/classes/NCProyectoOperaciones.cls:1268"]
      - id: NC-F030-R09
        descripcion: Si el resultado es no conforme se pregunta «Al indicar que no es conforme se han de planificar nuevas acciones. ¿Desea planificar una nueva acción?» y, si se acepta, se abre la pestaña «Acciones».
        evidencia: ["src/forms/Form_FormNCProyectoControlEficacia.cls:133"]
      - id: NC-F030-R10
        descripcion: Si el estado cambia se avisa con «La NC de proyecto pasa a estar cerrada» o «La NC de proyecto ha dejado de estar cerrada» y se actualiza la línea de la lista de NC.
        evidencia: ["src/forms/Form_FormNCProyectoControlEficacia.cls:146", "src/forms/Form_FormNCProyectoControlEficacia.cls:158"]
      - id: NC-F030-R11
        descripcion: Cada registro o borrado del control o de su resultado queda en el historial y recalcula los contadores de seguimiento.
        evidencia: ["src/classes/NCProyectoOperaciones.cls:1251", "src/classes/NCProyectoOperaciones.cls:1257", "src/classes/NCProyectoOperaciones.cls:1308"]
      - id: NC-F030-R12
        descripcion: Mientras se edita, la pestaña «Eficacia» cambia de color según el control esté completo o no (NC-F014-R07).
        evidencia: ["src/forms/Form_FormNCProyectoControlEficacia.cls:249"]

  - id: NC-F031
