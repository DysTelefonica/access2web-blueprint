features:
  # ---------------------------------------------------------------------------
  # Arranque y menús
  # ---------------------------------------------------------------------------
  - id: NC-F001
    area: Arranque y menús
    nombre: Iniciar la aplicación e identificar al usuario
    descripcion: >-
      Al abrir la aplicación se muestra una pantalla de inicio con barra de progreso mientras se carga la configuración,
      se identifica a la persona conectada y se decide qué menú le corresponde.
    formulario: NO CONFORMIDADES (pantalla de inicio)
    control: ""
    tipo: automático
    roles: []
    resultado: >-
      Calidad y los administradores llegan al menú principal «NO CONFORMIDADES»; el resto de usuarios llega al menú del técnico.
    tecnico:
      formulario: Form_frmSplash
      control: Form_Timer
      evidencia:
        - "src/forms/Form_frmSplash.cls:33"
        - "src/modules/Variables Globales.bas:391"
    reglas:
      - id: NC-F001-R01
        descripcion: La pantalla de inicio muestra el título «NO CONFORMIDADES», el subtítulo «Gestión de No Conformidades» y el paso que se está cargando.
        evidencia: ["src/forms/Form_frmSplash.cls:20", "src/forms/Form_frmSplash.cls:42"]
      - id: NC-F001-R02
        descripcion: Si la aplicación se abre con un correo electrónico como parámetro de arranque, se identifica al usuario por ese correo; si no, por el usuario de Windows de la sesión.
        evidencia: ["src/modules/Variables Globales.bas:447", "src/modules/Variables Globales.bas:453"]
      - id: NC-F001-R03
        descripcion: Si la persona no está dada de alta como usuario, la aplicación no arranca y muestra «No se pudo inicializar la herramienta.» con la causa «No se ha podido determinar el usuario que está usando la herramienta».
        evidencia: ["src/modules/Variables Globales.bas:463", "src/forms/Form_frmSplash.cls:65"]
      - id: NC-F001-R04
        descripcion: Es administrador quien tiene la marca de administrador general o la de administrador en los permisos de esta aplicación.
        evidencia: ["src/classes/Usuario.cls:65", "src/classes/Usuario.cls:75", "src/modules/Variables Globales.bas:472"]
      - id: NC-F001-R05
        descripcion: Es de Calidad quien, sin ser administrador, tiene la marca de usuario de Calidad en los permisos de esta aplicación.
        evidencia: ["src/classes/Usuario.cls:127", "src/modules/Variables Globales.bas:478"]
      - id: NC-F001-R06
        descripcion: Cualquier otro usuario registrado es técnico.
        evidencia: ["src/modules/Variables Globales.bas:485"]
      - id: NC-F001-R07
        descripcion: Si falla la carga de cualquier dato de entorno, la aplicación muestra «Ha habido errores al inicio» con la lista de datos fallidos y se cierra.
        evidencia: ["src/modules/Variables Globales.bas:516", "src/forms/Form_frmSplash.cls:65"]
      - id: NC-F001-R08
        descripcion: Un técnico llega al menú del técnico; Calidad y los administradores llegan al menú principal.
        evidencia: ["src/modules/Funciones Generales.bas:1489", "src/forms/Form_frmSplash.cls:54"]
      - id: NC-F001-R09
        descripcion: La cinta de opciones de Access se oculta salvo que la aplicación se abra en modo desarrollo; en la versión de pruebas solo la ven los administradores.
        evidencia: ["src/forms/Form_frmSplash.cls:13", "src/forms/Form_Form0BDOpciones.cls:113"]
      - id: NC-F001-R10
        descripcion: Ante un error inesperado en cualquier pantalla, la aplicación muestra el detalle al usuario y envía un correo automático al administrador con ese detalle.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:26", "src/modules/Funciones Generales.bas:1240"]

  - id: NC-F002
    area: Arranque y menús
    nombre: Navegar desde el menú principal
    descripcion: >-
      El menú principal da acceso a las dos partes de la aplicación, NC de proyecto y NC de auditoría, y muestra la versión.
    formulario: NO CONFORMIDADES
    control: NC de proyecto | NC de auditoría
    tipo: menú
    roles: [Calidad, Administrador]
    resultado: >-
      Se abre el menú «PARTE DE PROYECTOS» o el menú «PARTE DE AUDITORÍAS».
    tecnico:
      formulario: Form_Form0BDOpciones
      control: ComandoMenuParteProyecto | ComandoMenuAuditorias
      evidencia: ["src/forms/Form_Form0BDOpciones.cls:7", "src/forms/Form_Form0BDOpciones.cls:64"]
      prd: prd/formularios/Form_Form0BDOpciones.md
    reglas:
      - id: NC-F002-R01
        descripcion: El rótulo dice «NO CONFORMIDADES» o, en la versión de pruebas, «NO CONFORMIDADES VERSIÓN DE PRUEBAS».
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:113"]
      - id: NC-F002-R02
        descripcion: La ventana muestra «Versión» seguida de la versión de la aplicación.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:130"]
      - id: NC-F002-R03
        descripcion: El texto «NC de proyecto» también abre el menú de proyectos cuando su botón está activo.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:199"]

  - id: NC-F003
    area: Arranque y menús
    nombre: Salir de la aplicación
    descripcion: >-
      Cierra la aplicación desde el menú principal o desde el menú del técnico, previa confirmación.
    formulario: NO CONFORMIDADES
    control: Salir
    tipo: botón
    roles: []
    resultado: >-
      La aplicación se cierra.
    tecnico:
      formulario: Form_Form0BDOpciones
      control: cmdSalir
      evidencia: ["src/forms/Form_Form0BDOpciones.cls:170", "src/forms/Form_Form0BDTecnicos.cls:168"]
      prd: prd/formularios/Form_Form0BDOpciones.md
    reglas:
      - id: NC-F003-R01
        descripcion: Se pide confirmación con «¿Desea salir de la aplicación»; la opción por defecto es «No».
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:172", "src/forms/Form_Form0BDTecnicos.cls:170"]
      - id: NC-F003-R02
        descripcion: En los menús «PARTE DE PROYECTOS» y «PARTE DE AUDITORÍAS» el botón «Salir» solo cierra ese menú, sin pedir confirmación.
        evidencia: ["src/forms/Form_Form0BDOpcionesParteProyectos.cls:340", "src/forms/Form_Form0BDOpcionesAuditorias.cls:185"]

  - id: NC-F004
    area: Arranque y menús
    nombre: Recargar los datos de entorno
    descripcion: >-
      Un doble clic en el fondo del menú principal o del menú de proyectos vuelve a identificar al usuario y a cargar la configuración sin cerrar la aplicación.
    formulario: NO CONFORMIDADES | PARTE DE PROYECTOS
    control: doble clic en el fondo de la ventana
    tipo: menú
    roles: []
    resultado: >-
      Se recargan la identidad del usuario, su perfil y la configuración de la aplicación.
    tecnico:
      formulario: Form_Form0BDOpciones
      control: Detalle_DblClick
      evidencia: ["src/forms/Form_Form0BDOpciones.cls:34", "src/forms/Form_Form0BDOpcionesParteProyectos.cls:243"]
      prd: prd/formularios/Form_Form0BDOpciones.md
    reglas:
      - id: NC-F004-R01
        descripcion: La recarga sigue las mismas reglas de identificación y perfil que el arranque (NC-F001-R02 a NC-F001-R07).
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:42"]
        # posible defecto: es una función oculta sin ningún rótulo; el usuario solo la descubre por accidente.

  - id: NC-F005
    area: Arranque y menús
    nombre: Usar el menú del técnico
    descripcion: >-
      El técnico entra a un menú reducido con acceso a las NC de proyecto, al seguimiento de tareas y al vídeo de ayuda.
    formulario: NO CONFORMIDADES (menú del técnico)
    control: NC de proyecto | Seguimiento
    tipo: menú
    roles: [Técnico]
    resultado: >-
      Se abre la ventana «GESTIÓN DE NC DE PROYECTOS» o la de seguimiento de tareas de proyecto.
    tecnico:
      formulario: Form_Form0BDTecnicos
      control: ComandoMenuParteProyecto | ComandoSeguimiento
      evidencia: ["src/forms/Form_Form0BDTecnicos.cls:34", "src/forms/Form_Form0BDTecnicos.cls:61"]
      prd: prd/formularios/Form_Form0BDTecnicos.md
    reglas:
      - id: NC-F005-R01
        descripcion: Si el menú del técnico se abre directamente sin pasar por la pantalla de inicio, primero carga el entorno y, si el usuario no es técnico, lo redirige al menú principal.
        evidencia: ["src/forms/Form_Form0BDTecnicos.cls:103", "src/forms/Form_Form0BDTecnicos.cls:132"]
      - id: NC-F005-R02
        descripcion: Desde este menú la ventana de NC de proyecto se abre sin ningún filtro aplicado, a diferencia del menú «PARTE DE PROYECTOS» (NC-F008-R02).
        evidencia: ["src/forms/Form_Form0BDTecnicos.cls:43"]
      - id: NC-F005-R03
        descripcion: El texto «NC de proyecto» también abre la ventana de NC de proyecto cuando su botón está activo.
        evidencia: ["src/forms/Form_Form0BDTecnicos.cls:196"]

  - id: NC-F006
    area: Arranque y menús
    nombre: Ver el vídeo de ayuda
    descripcion: >-
      Abre el vídeo de ayuda de la parte de la aplicación en la que está el usuario.
    formulario: PARTE DE PROYECTOS | PARTE DE AUDITORÍAS | NO CONFORMIDADES (menú del técnico)
    control: Ayuda
    tipo: botón
    roles: []
    resultado: >-
      Se abre el vídeo de ayuda de NC de proyecto, de NC de auditoría o el específico para técnicos.
    tecnico:
      formulario: Form_Form0BDOpcionesParteProyectos
      control: ComandoAyuda
      evidencia:
        - "src/forms/Form_Form0BDOpcionesParteProyectos.cls:60"
        - "src/forms/Form_Form0BDOpcionesAuditorias.cls:65"
        - "src/forms/Form_Form0BDTecnicos.cls:8"
      prd: prd/formularios/Form_Form0BDOpcionesParteProyectos.md
    reglas:
      - id: NC-F006-R01
        descripcion: Si el vídeo no está en su ubicación se muestra «El video de ayuda no se encuentra disponible en este momento».
        evidencia: ["src/forms/Form_Form0BDOpcionesParteProyectos.cls:68", "src/forms/Form_Form0BDOpcionesAuditorias.cls:73", "src/forms/Form_Form0BDTecnicos.cls:15"]
      - id: NC-F006-R02
        descripcion: Cada menú abre un vídeo distinto, NC de proyecto, NC de auditoría o técnicos, según la configuración de la aplicación.
        evidencia: ["src/forms/Form_Form0BDOpcionesParteProyectos.cls:72", "src/forms/Form_Form0BDOpcionesAuditorias.cls:77", "src/forms/Form_Form0BDTecnicos.cls:19"]

  - id: NC-F007
    area: Arranque y menús
    nombre: Ver el contador de seguimiento
    descripcion: >-
      Los menús de proyecto y de auditoría muestran cuántos asuntos pendientes de seguimiento tiene el usuario frente al total,
      y un botón permite recalcularlo.
    formulario: PARTE DE PROYECTOS | PARTE DE AUDITORÍAS
    control: Seguimiento «propios» / «total» | Actualizar
    tipo: automático
    roles: []
    resultado: >-
      El rótulo indica «Seguimiento» seguido de los pendientes del usuario y del total.
    tecnico:
      formulario: Form_Form0BDOpcionesParteProyectos
      control: Form_Open | ComandoActualizar
      evidencia:
        - "src/forms/Form_Form0BDOpcionesParteProyectos.cls:308"
        - "src/forms/Form_Form0BDOpcionesParteProyectos.cls:7"
        - "src/forms/Form_Form0BDOpcionesAuditorias.cls:270"
        - "src/modules/Funciones Generales.bas:88"
      prd: prd/formularios/Form_Form0BDOpcionesParteProyectos.md
    reglas:
      - id: NC-F007-R01
        descripcion: El total suma seis tipos de pendiente, tareas por replanificar, NC registradas sin acciones, NC con acciones sin tareas, NC pendientes de control de eficacia, NC con control de eficacia caducado y NC con control de eficacia no conforme.
        evidencia: ["src/modules/Funciones Generales.bas:188", "src/modules/Funciones Generales.bas:224"]
      - id: NC-F007-R02
        descripcion: Una tarea está por replanificar si ha empezado, su fecha fin prevista es hoy o anterior y no tiene fecha fin real.
        evidencia: ["src/modules/constructor.bas:3540"]
      - id: NC-F007-R03
        descripcion: Una NC de proyecto cuenta como registrada sin acciones si no tiene ninguna acción correctiva y no está borrada.
        evidencia: ["src/modules/constructor.bas:3885"]
      - id: NC-F007-R04
        descripcion: Una NC de proyecto cuenta como acciones sin tareas si tiene alguna acción correctiva sin tareas y no tiene fecha de cierre.
        evidencia: ["src/modules/constructor.bas:4017"]
      - id: NC-F007-R05
        descripcion: Una NC de proyecto está pendiente de control de eficacia si tiene alguna tarea terminada, fecha prevista de control y no tiene fecha de control realizada; si la fecha prevista es hoy o anterior cuenta además como caducada.
        evidencia: ["src/modules/constructor.bas:4221", "src/modules/constructor.bas:4151"]
      - id: NC-F007-R06
        descripcion: Una NC de proyecto cuenta como control de eficacia no conforme si su control de eficacia es «No» conforme y tiene alguna tarea terminada.
        evidencia: ["src/modules/constructor.bas:4083"]
      - id: NC-F007-R07
        descripcion: En proyecto, los pendientes propios son los de las NC en las que el usuario es el responsable de Calidad; en auditoría, los de las NC en las que es el responsable de implantación.
        evidencia: ["src/modules/Funciones Generales.bas:411", "src/modules/Funciones Generales.bas:423"]
      - id: NC-F007-R08
        descripcion: El botón «Actualizar» vuelve a calcular los pendientes desde la base de datos; mientras tanto el rótulo muestra «Seguimiento #/#».
        evidencia: ["src/forms/Form_Form0BDOpcionesParteProyectos.cls:14", "src/modules/Funciones Generales.bas:152"]
        # posible defecto: el recálculo no descarta los contadores de control de eficacia caducado y no conforme de auditoría (src/modules/Funciones Generales.bas:378), que siguen mostrando el valor anterior.
      - id: NC-F007-R09
        descripcion: Al recalcular también se refrescan las listas de seguimiento que estén abiertas.
        evidencia: ["src/modules/Funciones Generales.bas:338"]

  - id: NC-F008
    area: Arranque y menús
    nombre: Navegar desde el menú de proyectos
