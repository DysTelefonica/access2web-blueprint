    formulario: ALTA DE NO CONFORMIDAD DE PROYECTO
    control: Salir
    tipo: automático
    roles: [Calidad, Administrador]
    resultado: >-
      Calidad recibe el correo «Alta de No Conformidad de proyecto «código»(No Conformidades)» con los datos de la NC.
    tecnico:
      formulario: Form_FormNCProyecto
      control: Form_Close
      evidencia: ["src/forms/Form_FormNCProyecto.cls:50", "src/modules/Funciones Generales.bas:3464"]
    reglas:
      - id: NC-F031-R01
        descripcion: Solo se envía si la ficha se abrió como alta, la NC llegó a registrarse y el usuario no es técnico.
        evidencia: ["src/forms/Form_FormNCProyecto.cls:57", "src/forms/Form_FormNCProyecto.cls:66", "src/forms/Form_FormNCProyecto.cls:163"]
      - id: NC-F031-R02
        descripcion: Si la NC no tiene acciones se muestra «No se va a mandar el correo a Calidad al no haber acciones registradas.» y se recalculan los contadores de seguimiento.
        evidencia: ["src/forms/Form_FormNCProyecto.cls:67"]
      - id: NC-F031-R03
        descripcion: El correo va a todos los usuarios de Calidad de la aplicación con copia al usuario que da el alta.
        evidencia: ["src/modules/Funciones Generales.bas:3482", "src/classes/Entorno.cls:956"]
      - id: NC-F031-R04
        descripcion: Si no hay ningún usuario de Calidad se produce el error «No hay ningún usuario marcado como calidad».
        evidencia: ["src/classes/Entorno.cls:976"]
      - id: NC-F031-R05
        descripcion: En la versión de pruebas el correo va solo al usuario conectado, sin copia y con un aviso de los destinatarios de producción.
        evidencia: ["src/modules/Funciones Generales.bas:3489", "src/modules/Funciones Generales.bas:3451"]
      - id: NC-F031-R06
        descripcion: El correo se registra en la cola de envío con las reglas de NC-F022-R07 y NC-F022-R08.
        evidencia: ["src/modules/Funciones Generales.bas:3510"]

