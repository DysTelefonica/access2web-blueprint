      Se crea la NC vinculada con código propio y con copia de los datos, las acciones correctivas y las tareas de la NC original.
    tecnico:
      formulario: Form_FormNCProyectoGeneralConVinculoNC
      control: ComandoRegistrar
      evidencia:
