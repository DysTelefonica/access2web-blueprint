      Permite marcar qué riesgos de la Gestión de Riesgos del proyecto del expediente están relacionados con la NC.
    formulario: RIESGOS ASOCIADOS
    control: Aceptar | Quitar Todos | Cancelar
    tipo: botón
    roles: []
    resultado: >-
      La NC queda asociada a los riesgos marcados y el campo «Riesgo asoc.» muestra sus códigos separados por «|».
