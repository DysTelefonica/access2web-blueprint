      Crea una NC de proyecto nueva vinculada a la NC seleccionada, normalmente de otro expediente, heredando su análisis, sus acciones y sus tareas.
    formulario: ALTA DE NO CONFORMIDAD DE PROYECTO VINCULADA A «código»
    control: Registrar
    tipo: botón
    roles: [Calidad, Administrador]
