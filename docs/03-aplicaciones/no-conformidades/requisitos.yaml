      formulario: Form_FormNCProyectoGeneral
      control: ComandoBuscarExpediente | ComandoIrABusquedaExpedientes
      evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:160", "src/forms/Form_FormNCProyectoGeneral.cls:423", "src/forms/Form_FormNCProyectoGeneral.cls:970"]
    reglas:
      - id: NC-F026-R01
        descripcion: Con una sola coincidencia el expediente se asigna directamente; sin coincidencias o con varias se abre «EXPEDIENTES REGISTRADOS».
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:186", "src/forms/Form_FormNCProyectoGeneral.cls:204", "src/forms/Form_FormNCProyectoGeneral.cls:225"]
      - id: NC-F026-R02
        descripcion: La jurídica y el título vienen dados por el expediente y no se pueden editar.
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:1006"]
      - id: NC-F026-R03
        descripcion: Si el expediente tiene jefe de proyecto, se propone como jefe de proyecto de la NC.
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:1009"]
      - id: NC-F026-R04
        descripcion: Si el expediente tiene responsable de Calidad, se propone como responsable de Calidad de la NC; una NC sin responsable de Calidad muestra el del expediente al abrirse.
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:22", "src/forms/Form_FormNCProyectoGeneral.cls:212", "src/forms/Form_FormNCProyectoGeneral.cls:580"]
      - id: NC-F026-R05
        descripcion: El buscador de expedientes de la ficha queda desactivado si la NC no se puede editar.
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:752", "src/forms/Form_FormNCProyectoGeneral.cls:804"]
      - id: NC-F026-R06
        descripcion: La lista de jefes de proyecto ofrece los usuarios configurados como jefes de proyecto y la de responsables de Calidad los usuarios de Calidad.
        evidencia: ["src/forms/Form_FormNCProyectoGeneral.cls:489", "src/modules/Funciones Generales.bas:1910"]

  - id: NC-F027
    area: NC de proyecto
    nombre: Asociar riesgos a la NC de proyecto
