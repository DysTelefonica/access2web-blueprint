        evidencia: ["src/forms/Form_FormARProyectoDocumentos.cls:89", "src/forms/Form_FormARProyectoDocumentos.cls:222", "src/forms/Form_FormARProyectoDocumentos.cls:491"]
      - id: NC-F039-R02
        descripcion: «Examinar» abre el explorador de archivos y propone como título el nombre del archivo; si el archivo no existe se muestra «El archivo seleccionado no existe o no es accesible.».
        evidencia: ["src/forms/Form_FormARProyectoDocumentos.cls:175", "src/forms/Form_FormARProyectoDocumentos.cls:179", "src/forms/Form_FormARProyectoDocumentos.cls:191"]
      - id: NC-F039-R03
        descripcion: Para aceptar hace falta un título («Debe poner un título al documento.») y un archivo («Debe seleccionar un archivo pulsando 'Examinar' antes de Aceptar.»).
        evidencia: ["src/forms/Form_FormARProyectoDocumentos.cls:228", "src/forms/Form_FormARProyectoDocumentos.cls:233"]
      - id: NC-F039-R04
        descripcion: No puede haber dos documentos con el mismo título en la misma tarea («Ya existe un documento para la misma Tarea de una No Conformidad de proyecto»).
        evidencia: ["src/classes/DocumentoProyectoOperaciones.cls:165"]
      - id: NC-F039-R05
        descripcion: Si el archivo no es accesible se muestra «No es alcanzable el documento en estos momentos»; si en la carpeta de destino hay un archivo con el mismo nombre abierto, «Hay un archivo en el servidor con el mismo nombre y parece que está abierto».
        evidencia: ["src/classes/DocumentoProyectoOperaciones.cls:152", "src/classes/DocumentoProyectoOperaciones.cls:176"]
      - id: NC-F039-R06
        descripcion: El archivo se copia a la carpeta de documentación con el nombre ««código NC»_AR«n.º de tarea con cuatro cifras»_«n.º correlativo de dos cifras»» y su extensión original.
        evidencia: ["src/classes/DocumentoProyecto.cls:286", "src/classes/DocumentoProyecto.cls:178", "src/classes/DocumentoProyectoOperaciones.cls:256"]
      - id: NC-F039-R07
        descripcion: Cambiar el nombre exige un documento seleccionado, un nombre no vacío, distinto del actual y no usado por otro documento de la tarea, con los mensajes «Debe seleccionar un documento de la lista.», «El nombre del documento no puede estar vacío.», «El nombre indicado es el mismo que ya tiene el documento.» y «Ya existe otro documento con el nombre «…» en esta lista.».
        evidencia: ["src/forms/Form_FormARProyectoDocumentos.cls:345", "src/forms/Form_FormARProyectoDocumentos.cls:356", "src/forms/Form_FormARProyectoDocumentos.cls:364", "src/forms/Form_FormARProyectoDocumentos.cls:378"]
      - id: NC-F039-R08
        descripcion: Para eliminar se pide confirmación con «¿Desea borrar el documento seleccionado?»; si la NC no es editable se muestra «Operación no autorizada».
        evidencia: ["src/forms/Form_FormARProyectoDocumentos.cls:439", "src/forms/Form_FormARProyectoDocumentos.cls:452"]
      - id: NC-F039-R09
        descripcion: No se puede eliminar el único documento de una tarea terminada («Sólo tiene un documento y está cerrada. Se necesita al menos una evidencia») ni un documento que esté abierto («El anexo parece estar abierto»).
        evidencia: ["src/classes/DocumentoProyectoOperaciones.cls:40", "src/classes/DocumentoProyectoOperaciones.cls:31"]
      - id: NC-F039-R10
        descripcion: Al eliminar se borra también el archivo de la carpeta de documentación; el alta y la eliminación quedan en el historial.
        evidencia: ["src/classes/DocumentoProyectoOperaciones.cls:51", "src/classes/DocumentoProyectoOperaciones.cls:59", "src/classes/DocumentoProyectoOperaciones.cls:247"]
      - id: NC-F039-R11
        descripcion: Un doble clic en un documento de la lista lo abre.
        evidencia: ["src/forms/Form_FormARProyectoDocumentos.cls:514"]
      - id: NC-F039-R12
        descripcion: Renombrar y eliminar no están disponibles en NC vinculadas ni en NC no editables.
        evidencia: ["src/forms/Form_FormARProyectoDocumentos.cls:302"]

