# Inventario de requisitos de No Conformidades para Calidad (issue #1494).
# Esquema y reglas de redacción: docs/07-migracion/inventario-requisitos.md.
#
# Títulos de formulario: las ventanas principales sustituyen su título por
# «Usuario conectado: <nombre> ( <perfil> )» al abrirse. Ese texto no identifica
# la ventana y contiene nombres de personas, así que en su lugar se usa el
# rótulo visible de la cabecera. Las partes que cambian se escriben entre « ».
# Los subformularios de la ficha de una NC usan el texto de su pestaña.
#
# Perfiles: «Administrador» (marcado como administrador global o de la
# aplicación), «Calidad» (marcado como usuario de Calidad de la aplicación) y
# «Técnico» (cualquier otro usuario registrado). Ver NC-F001.
#
# Los módulos de instalación, de caché y de pruebas no tienen acceso desde la
# interfaz y no aparecen como funcionalidades.

