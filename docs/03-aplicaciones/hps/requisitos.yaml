  # ---------------------------------------------------------------------------
  # Estado de los HPS (cálculo común)
  # ---------------------------------------------------------------------------
  - id: HPS-F013
    area: Estado de los HPS
    nombre: Calcular el estado de cada HPS
    descripcion: >-
      Para cada HPS de un usuario (Nacional, OTAN, ESA y UE) la aplicación calcula si está activo, a punto de
      caducar, caducado, solicitado, de baja o irregular, y con ello su estado. Este cálculo alimenta las consultas,
      los contadores, el semáforo y la ficha HPS.
    formulario: Usuarios HPS
    control: ""
    tipo: automático
    roles: []
    resultado: Cada HPS tiene un estado calculado y, si procede, un motivo de irregularidad.
    tecnico:
      formulario: Form_FormInicial03ConsultasDatos
      control: DatosHPSCalculados
      evidencia:
        - "src/modules/Funciones Generales.bas:1632"
        - "src/classes/Entorno.cls:1429"
    reglas:
      - id: HPS-F013-R01
        descripcion: Un HPS está de baja si tiene fecha de baja; un HPS de baja no cuenta como activo, solicitado, a punto de caducar ni caducado.
        evidencia: ["src/modules/Funciones Generales.bas:1669", "src/modules/Funciones Generales.bas:1683", "src/modules/Funciones Generales.bas:1692"]
      - id: HPS-F013-R02
        descripcion: Un HPS está activo si tiene fecha de concesión y de caducidad y la caducidad es hoy o posterior.
        evidencia: ["src/modules/Funciones Generales.bas:1674"]
      - id: HPS-F013-R03
        descripcion: Un HPS está solicitado si tiene fecha de solicitud.
        evidencia: ["src/modules/Funciones Generales.bas:1697"]
      - id: HPS-F013-R04
        descripcion: Un HPS está a punto de caducar si su caducidad es hoy o posterior y no más de 9 meses en adelante.
        evidencia: ["src/modules/Funciones Generales.bas:1717"]
      - id: HPS-F013-R05
        descripcion: Un HPS está caducado si tiene fecha de concesión y de caducidad y la caducidad es anterior a hoy.
        evidencia: ["src/modules/Funciones Generales.bas:1747"]
      - id: HPS-F013-R06
        descripcion: Un HPS está marcado como «no renovar» cuando su campo de renovación vale «No».
        evidencia: ["src/modules/Funciones Generales.bas:1971"]
      - id: HPS-F013-R07
        descripcion: Un HPS está pendiente de renovación si está solicitado, tiene fecha de caducidad y no está marcado como «no renovar».
        evidencia: ["src/modules/Funciones Generales.bas:1754"]
      - id: HPS-F013-R08
        descripcion: Un HPS es irregular si está marcado como «no renovar» y a la vez solicitado.
        evidencia: ["src/modules/Funciones Generales.bas:1909"]
      - id: HPS-F013-R09
        descripcion: Un HPS con fecha de concesión y sin fecha de caducidad es irregular con el motivo «HPS Con Fecha de Caducidad y no de Concesión».
        evidencia: ["src/modules/Funciones Generales.bas:1916"]
        # posible defecto: el texto del motivo dice lo contrario de la condición comprobada (hay concesión y falta caducidad).
      - id: HPS-F013-R10
        descripcion: Un HPS cuya fecha de concesión es posterior a la de caducidad es irregular con el motivo «HPS Con Fecha de Caducidad anterior a la de Concesión».
        evidencia: ["src/modules/Funciones Generales.bas:1923"]
      - id: HPS-F013-R11
        descripcion: Un HPS con fecha de caducidad y sin fecha de concesión es irregular con el motivo «HPS Con Fecha de Concesión y no de Caducidad».
        evidencia: ["src/modules/Funciones Generales.bas:1931"]
        # posible defecto: el texto del motivo dice lo contrario de la condición comprobada (hay caducidad y falta concesión).
      - id: HPS-F013-R12
        descripcion: Un HPS con fechas de concesión y caducidad cuyo grado no está en la lista de grados de su tipo es irregular («HPS Con Fecha de Concesión y de Caducidad sin Grado reconocido»).
        evidencia: ["src/modules/Funciones Generales.bas:1935"]
      - id: HPS-F013-R13
        descripcion: Un HPS concedido con fecha de solicitud anterior a la de concesión es irregular («HPS Activo con Fecha de solicitud anterior a la de concesión»).
        evidencia: ["src/modules/Funciones Generales.bas:1943"]
      - id: HPS-F013-R14
        descripcion: Un HPS solicitado que además tiene fecha de baja es irregular («HPS Con Fecha de Solicitud y con fecha de baja»).
        evidencia: ["src/modules/Funciones Generales.bas:1950"]
      - id: HPS-F013-R15
        descripcion: Un HPS solicitado cuyo grado no está en la lista de grados de su tipo es irregular («HPS Con Fecha de Solicitud sin Grado reconocido»).
        evidencia: ["src/modules/Funciones Generales.bas:1956"]
      - id: HPS-F013-R16
        descripcion: Para calcular la irregularidad el HPS debe tener al menos uno de estos datos (concesión, caducidad, grado, solicitud, renovación o baja); si no, el cálculo da el error «Se necesita al menos uno de los siguientes tados…».
        evidencia: ["src/modules/Funciones Generales.bas:1890"]
      - id: HPS-F013-R17
        descripcion: >-
          El estado se asigna en este orden: Baja; Irregular; A punto de Caducar (con Renovación No, sin solicitud o con
          solicitud); Caducada (con Renovación No, sin solicitud o con solicitud); Activo con Solicitud; Activo sin Solicitud;
          Caducada con Renovación No (no activo y marcado «no renovar»); Solicitud Nueva; Pendiente de Renovación.
        evidencia: ["src/modules/Funciones Generales.bas:1783", "src/classes/Entorno.cls:1442"]
        # posible defecto: el estado «Activo Renovación NO» nunca se asigna, porque todo HPS activo ya ha quedado como «Activo con Solicitud» o «Activo sin Solicitud».
      - id: HPS-F013-R18
        descripcion: Los meses que faltan para renovar se calculan como meses entre hoy y la fecha de caducidad.
        evidencia: ["src/modules/Funciones Generales.bas:1966"]
      - id: HPS-F013-R19
        descripcion: >-
          En la copia local de cada usuario solo se marca «a punto de caducar» o «caducado» en el HPS no dado de baja
          con la caducidad más próxima; si el usuario está de baja no se marca ninguno.
        evidencia: ["src/modules/Funciones Generales.bas:1589", "src/modules/Funciones Generales.bas:1608", "src/modules/Funciones Generales.bas:1621"]
      - id: HPS-F013-R20
        descripcion: Si el usuario está de baja, sus HPS no se marcan como activos, a punto de caducar, caducados, solicitados ni pendientes de renovación, y no se calcula su estado.
        evidencia: ["src/modules/Funciones Generales.bas:4410", "src/modules/Funciones Generales.bas:4415"]
      - id: HPS-F013-R21
        descripcion: Un usuario está de baja si tiene fecha de baja propia; si no, si alguno de sus HPS tiene fecha de baja (se toma la más antigua); si no, si tiene un HPS marcado «no renovar» ya caducado (se toma su caducidad).
        evidencia: ["src/classes/UsuarioHPS.cls:252", "src/classes/UsuarioHPS.cls:967", "src/classes/UsuarioHPS.cls:985"]

