# Inventario de requisitos de HPS para Calidad (issue #1494).
# Esquema y reglas de redacción: docs/07-migracion/inventario-requisitos.md.
#
# Títulos de formulario: la ventana principal sustituye su título por
# «Usuario conectado: <nombre>» y las fichas de usuario por «EDICIÓN DE <nombre>»;
# el título guardado contiene nombres de personas, así que la parte variable se
# escribe entre « ». Los paneles que se cargan dentro de la ventana principal o de
# la ficha de un usuario usan el texto de la opción del menú lateral que los abre.
#
# Roles: solo entran en la aplicación los administradores y los técnicos de HPS
# (ver HPS-F001). Ninguna funcionalidad distingue entre ambos perfiles, así que
# «roles: []» significa «cualquier usuario con acceso». Lo que limita las acciones
# de modificación es el modo de trabajo elegido al entrar (solo lectura o
# lectura/escritura), que se recoge como regla en cada funcionalidad.
#
# Los botones que solo muestran un icono se identifican por su texto de ayuda o,
# si no lo tienen, por su función («icono de Excel», «icono de borrar campo»).

