        descripcion: El semáforo es verde si el usuario tiene al menos un HPS activo y no requiere curso; en otro caso es rojo.
        evidencia: ["src/classes/DatosLocal.cls:392"]
      - id: HPS-F008-R02
        descripcion: Si no hay usuario seleccionado el semáforo se oculta.
        evidencia: ["src/modules/Funciones Generales.bas:2833"]
      - id: HPS-F008-R03
        descripcion: En la lista de usuarios SICA el semáforo corresponde al usuario HPS vinculado.
