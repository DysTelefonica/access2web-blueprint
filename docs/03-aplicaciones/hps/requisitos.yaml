        descripcion: Se pregunta «¿Deseas salir de la aplicación» y solo se cierra si el usuario responde Sí.
        evidencia: ["src/forms/Form_FormInicial.cls:141"]

  # ---------------------------------------------------------------------------
  # Ventana principal y menú lateral
  # ---------------------------------------------------------------------------
  - id: HPS-F005
    area: Ventana principal
    nombre: Mostrar la ventana principal con el menú lateral
    descripcion: >-
      La ventana principal muestra el menú lateral con la versión, dónde están los datos, el modo de escritura
      y los contadores de HPS, y abre por defecto la lista de usuarios HPS.
    formulario: "Usuario conectado: «usuario»"
    control: ""
    tipo: automático
    roles: []
    resultado: Se ve el menú lateral con los contadores al día y el panel «Usuarios HPS» abierto.
    tecnico:
      formulario: Form_FormInicial00Principal
      control: Form_Load
      evidencia:
        - "src/forms/Form_FormInicial00Principal.cls:82"
        - "src/forms/Form_FormInicial01Lateral.cls:25"
      prd: prd/formularios/Form_FormInicial00Principal.md
    reglas:
      - id: HPS-F005-R01
        descripcion: El título de la ventana es «Usuario conectado» seguido del nombre del usuario.
        evidencia: ["src/forms/Form_FormInicial00Principal.cls:121"]
      - id: HPS-F005-R02
        descripcion: El menú lateral muestra «Versión», «Datos en» (Oficina o Local) y «Modo Escritura» (Sí o No).
        evidencia: ["src/forms/Form_FormInicial01Lateral.cls:32", "src/classes/Entorno.cls:2012", "src/classes/Entorno.cls:2035"]
      - id: HPS-F005-R03
        descripcion: Al abrirse se recalculan los contadores del menú lateral y se selecciona «Usuarios HPS».
        evidencia: ["src/forms/Form_FormInicial01Lateral.cls:36", "src/forms/Form_FormInicial01Lateral.cls:62"]
      - id: HPS-F005-R04
        descripcion: Si la carga de la ventana principal falla, se muestra el error y la aplicación se cierra.
        evidencia: ["src/forms/Form_FormInicial00Principal.cls:127", "src/forms/Form_FormInicial00Principal.cls:134"]

  - id: HPS-F006
    area: Ventana principal
    nombre: Ver los contadores de HPS en el menú lateral
    descripcion: >-
      El menú lateral muestra cuántos usuarios hay en cada situación de seguimiento (a punto de caducar, caducados,
      irregulares, requieren curso, solicitados y pendientes de cada convocatoria) y lleva a la lista al pulsarlos.
    formulario: "Usuario conectado: «usuario»"
    control: A.P.Caducar | Caducados | Irregular | Req. Curso | Solicitados | contadores de convocatorias
    tipo: menú
    roles: []
    resultado: >-
      Al pulsar un contador se abre el panel de indicadores (o de usuarios HPS en el caso de «Irregular»)
      filtrado por esa situación.
    tecnico:
      formulario: Form_FormInicial01Lateral
      control: lblHPSAPuntoDeCaducar, lblHPSCaducados, lblHPSEstadoIrregular, lblRequiereCurso, lblSolicitados, lblRequiereCursoPte*
      evidencia:
        - "src/forms/Form_FormInicial01Lateral.cls:343"
        - "src/modules/Funciones Generales.bas:1449"
        - "src/modules/Mod_Indicadores_Contadores.bas:39"
      prd: prd/formularios/Form_FormInicial01Lateral.md
    reglas:
      - id: HPS-F006-R01
        descripcion: Los contadores de indicadores se calculan con las mismas reglas que las listas del panel «Indicadores» (ver HPS-F025 a HPS-F031).
        evidencia: ["src/modules/Mod_Indicadores_Contadores.bas:55", "src/modules/Mod_Indicadores_Contadores.bas:129"]
      - id: HPS-F006-R02
        descripcion: Mientras se recalculan, los contadores muestran «?».
        evidencia: ["src/modules/Mod_Indicadores_Contadores.bas:57", "src/modules/Mod_Indicadores_Contadores.bas:94"]
      - id: HPS-F006-R03
        descripcion: El contador «Irregular» cuenta los usuarios con al menos un HPS en estado irregular según la copia local (ver HPS-F013).
        evidencia: ["src/modules/Funciones Generales.bas:1465", "src/classes/Entorno.cls:1602", "src/modules/Constructor.bas:2121"]
      - id: HPS-F006-R04
        descripcion: Pulsar «Irregular» abre «Usuarios HPS» con la consulta por estado y el estado «Irregular» ya seleccionado.
        evidencia: ["src/forms/Form_FormInicial01Lateral.cls:357", "src/forms/Form_FormInicial01Lateral.cls:375"]
      - id: HPS-F006-R05
        descripcion: Pulsar cualquier otro contador abre «Indicadores» y pulsa el botón del indicador correspondiente solo si ese botón está activo.
        evidencia: ["src/forms/Form_FormInicial01Lateral.cls:345", "src/forms/Form_FormInicial01Lateral.cls:383"]
      - id: HPS-F006-R06
        descripcion: Los tres contadores numéricos sin texto corresponden a pendientes de primera convocatoria, de segunda convocatoria y de correo al Jefe de Seguridad, según su texto de ayuda.
        evidencia: ["src/forms/Form_FormInicial01Lateral.form.txt:1889", "src/forms/Form_FormInicial01Lateral.form.txt:1918", "src/forms/Form_FormInicial01Lateral.form.txt:1947"]

  - id: HPS-F007
    area: Ventana principal
    nombre: Navegar por el menú lateral
    descripcion: Cambia el panel central entre Usuarios HPS, Usuarios SICA, Usuarios Históricos, Indicadores y Configuración.
    formulario: "Usuario conectado: «usuario»"
    control: Usuarios HPS | Usuarios SICA | Usuarios Históricos | Indicadores | Configuración
    tipo: menú
    roles: []
    resultado: El panel central muestra la sección elegida y la opción queda marcada como seleccionada.
    tecnico:
      formulario: Form_FormInicial01Lateral
      control: lblUsuariosHPS, lblUsuariosSICA, lblUsuariosHistoricos, lblIndicadores, lblConfiguracion
      evidencia: ["src/forms/Form_FormInicial01Lateral.cls:273"]
      prd: prd/formularios/Form_FormInicial01Lateral.md
    reglas:
      - id: HPS-F007-R01
        descripcion: Al volver a «Usuarios HPS» se reinicia la consulta por estado y se limpia el estado elegido.
        evidencia: ["src/forms/Form_FormInicial01Lateral.cls:312", "src/forms/Form_FormInicial01Lateral.cls:323"]
      - id: HPS-F007-R02
        descripcion: Si ya se está en «Usuarios HPS», pulsarlo de nuevo solo reinicia la consulta cuando venía de un contador (Irregular, A.P.Caducar o Caducados).
        evidencia: ["src/forms/Form_FormInicial01Lateral.cls:325"]
      - id: HPS-F007-R03
        descripcion: Si el panel elegido ya está abierto no se vuelve a cargar.
        evidencia: ["src/forms/Form_FormInicial01Lateral.cls:408", "src/forms/Form_FormInicial01Lateral.cls:428"]

  - id: HPS-F008
    area: Ventana principal
    nombre: Ver el semáforo del usuario seleccionado
    descripcion: Al moverse por la lista de usuarios HPS o SICA, el menú lateral muestra un semáforo verde o rojo para el usuario seleccionado.
    formulario: "Usuario conectado: «usuario»"
