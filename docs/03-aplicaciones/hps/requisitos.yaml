features:
  # ---------------------------------------------------------------------------
  # Acceso a la aplicación
  # ---------------------------------------------------------------------------
  - id: HPS-F001
    area: Acceso
    nombre: Preparar la aplicación al abrirla
    descripcion: >-
      Al abrir HPS, la ventana inicial identifica al usuario, comprueba su permiso, detecta si está en la
      oficina y sincroniza la copia local de los datos antes de dejar elegir el modo de trabajo.
    formulario: GESTIÓN DE HPS
    control: ""
    tipo: automático
    roles: []
    resultado: >-
      La ventana muestra «Situación de los datos» (En Oficina o En Local) y «Acceso a Red Telefónica», y
      habilita los botones de acceso que correspondan.
    tecnico:
      formulario: Form_FormInicial
      control: Form_Load / Form_Timer
      evidencia:
        - "src/forms/Form_FormInicial.cls:151"
        - "src/forms/Form_FormInicial.cls:17"
        - "src/modules/VariablesEntorno.bas:301"
      prd: prd/formularios/Form_FormInicial.md
    reglas:
      - id: HPS-F001-R01
        descripcion: Al abrirse, los dos botones de acceso quedan desactivados hasta que termina la carga inicial.
        evidencia: ["src/forms/Form_FormInicial.cls:157"]
      - id: HPS-F001-R02
        descripcion: La aplicación considera que el usuario está en la oficina cuando el equipo tiene una dirección de la subred de la oficina.
        evidencia: ["src/modules/Funciones Generales.bas:2758"]
      - id: HPS-F001-R03
        descripcion: Fuera de la oficina, la aplicación solo continúa si alcanza la carpeta de aplicaciones de la red corporativa; si no, el error es «Se ha de estar conectado al menos al CARU».
        evidencia: ["src/modules/VariablesEntorno.bas:342", "src/modules/VariablesEntorno.bas:353"]
      - id: HPS-F001-R04
        descripcion: El usuario se identifica por el correo recibido al lanzar la aplicación o, si no hay, por el usuario de Windows del equipo; si no se identifica, el error es «No se ha podido determinar el usuario que está usando la herramienta».
        evidencia: ["src/modules/VariablesEntorno.bas:375", "src/modules/VariablesEntorno.bas:393"]
      - id: HPS-F001-R05
        descripcion: Solo pueden abrir la aplicación los usuarios que son administradores o técnicos de HPS (aplicación 17) en la Lanzadera; el resto recibe «El usuario no tiene permiso para abrir la aplicación».
        evidencia: ["src/modules/VariablesEntorno.bas:402", "src/modules/VariablesEntorno.bas:405", "src/classes/Usuario.cls:72"]
      - id: HPS-F001-R06
        descripcion: Es administrador quien está marcado como administrador general en la Lanzadera o como administrador de esta aplicación.
        evidencia: ["src/classes/Usuario.cls:79", "src/classes/UsuarioAplicacionPermisos.cls:67"]
      - id: HPS-F001-R07
        descripcion: Antes de habilitar los botones se sincroniza la copia local de usuarios HPS, usuarios SICA, usuarios históricos y suministradores con la base central.
        evidencia: ["src/forms/Form_FormInicial.cls:37", "src/modules/Mod_StartupCacheInitialization.bas:103"]
      - id: HPS-F001-R08
        descripcion: Si la sincronización falla se muestra «Error en la carga» con el detalle y los botones de acceso siguen desactivados.
        evidencia: ["src/forms/Form_FormInicial.cls:39"]
      - id: HPS-F001-R09
        descripcion: En la oficina se habilitan los dos botones de acceso; fuera de la oficina solo se habilita «Acceso Solo lectura».
        evidencia: ["src/forms/Form_FormInicial.cls:57", "src/forms/Form_FormInicial.cls:70"]
      - id: HPS-F001-R10
        descripcion: Se considera que hay meses de preaviso de renovación igual a 9; este valor alimenta los cálculos de «a punto de caducar».
        evidencia: ["src/modules/VariablesEntorno.bas:332"]
      - id: HPS-F001-R11
        descripcion: Cualquier error no previsto en la aplicación se comunica por correo a los administradores de la herramienta con el formulario, el equipo, la versión y si se está en la oficina.
        evidencia: ["src/modules/Funciones Generales.bas:76", "src/modules/Funciones Generales.bas:125", "src/modules/Funciones Generales.bas:139"]
        # posible defecto: los destinatarios del correo de error están fijos en el código y uno de ellos es una cuenta personal externa.

  - id: HPS-F002
    area: Acceso
    nombre: Entrar en modo lectura y escritura
    descripcion: Abre la ventana principal permitiendo dar de alta, modificar y borrar información.
    formulario: GESTIÓN DE HPS
    control: Acceso Lectura/Escritura
    tipo: botón
    roles: []
    resultado: La aplicación queda en modo «Lectura/Escritura» y se abre la ventana principal.
    tecnico:
      formulario: Form_FormInicial
      control: ComandoAccesoEscritura
      evidencia: ["src/forms/Form_FormInicial.cls:84"]
      prd: prd/formularios/Form_FormInicial.md
    reglas:
      - id: HPS-F002-R01
        descripcion: Solo se puede entrar en modo escritura desde la oficina; fuera de ella el botón está desactivado y, si se invoca, el error es «No estamos en la oficina».
        evidencia: ["src/forms/Form_FormInicial.cls:70", "src/modules/Funciones Generales.bas:46"]
      - id: HPS-F002-R02
        descripcion: Antes de abrir la ventana principal se cierran todas las ventanas abiertas de la aplicación.
        evidencia: ["src/forms/Form_FormInicial.cls:88", "src/modules/Funciones Generales.bas:2362"]

  - id: HPS-F003
    area: Acceso
    nombre: Entrar en modo solo lectura
    descripcion: Abre la ventana principal solo para consultar; los botones de alta, edición y borrado quedan desactivados.
    formulario: GESTIÓN DE HPS
    control: Acceso Solo lectura
    tipo: botón
    roles: []
    resultado: La aplicación queda en modo «Solo lectura» y se abre la ventana principal.
    tecnico:
      formulario: Form_FormInicial
      control: ComandoAccesoLectura
      evidencia: ["src/forms/Form_FormInicial.cls:107"]
      prd: prd/formularios/Form_FormInicial.md
    reglas:
      - id: HPS-F003-R01
        descripcion: Fuera de la oficina solo entran los usuarios incluidos en la lista de permitidos en local; el resto recibe «No está incluido entre los usuarios a los que se les permite entrar desde casa».
        evidencia: ["src/forms/Form_FormInicial.cls:112", "src/classes/Usuario.cls:51"]
      - id: HPS-F003-R02
        descripcion: Antes de abrir la ventana principal se cierran todas las ventanas abiertas de la aplicación.
        evidencia: ["src/forms/Form_FormInicial.cls:118"]

  - id: HPS-F004
    area: Acceso
    nombre: Salir de la aplicación
    descripcion: Cierra HPS desde la ventana inicial tras pedir confirmación.
    formulario: GESTIÓN DE HPS
    control: Salir
    tipo: botón
    roles: []
