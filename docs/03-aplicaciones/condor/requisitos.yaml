  # ---------------------------------------------------------------------------
  # Fichas de datos de la solicitud
  # Hay tres fichas, una por tipo: propuesta de cambio (PC), concesión o
  # desviación (CD/CA) y concesión o desviación de subcontratista (CD/CA-SUB).
  # Las tres tienen las pestañas GENERAL, DETALLE Y DESCRIPCIÓN, MOTIVOS,
  # APROBACIÓN SUMINSTRADOR, RAC y AUTORIDAD COMPETENTE.
  # ---------------------------------------------------------------------------
  - id: CON-F059
    area: Fichas de datos
    nombre: Abrir la ficha de una propuesta de cambio
    descripcion: >-
      Ventana con las pestañas de datos de una propuesta de cambio; se abre por la pestaña que
      corresponde al estado y solo deja grabar lo que el perfil puede tocar en ese estado.
    formulario: "Propuesta de Cambio: «código» («nemotécnico»)"
    control: Ver Datos
    tipo: automático
    roles: []
    resultado: >-
      El usuario ve el estado y la pestaña de trabajo de la fase, con los campos activos o bloqueados según sus permisos.
    tecnico:
      formulario: Form_frmDatosPC
      control: Form_Load / ConfigurarYPoblarInterfaz
      evidencia:
        - "src/forms/Form_frmDatosPC.cls:50"
        - "src/forms/Form_frmDatosPC.cls:423"
        - "src/classes/WorkflowServicio.cls:1599"
      prd: prd/formularios/Form_frmDatosPC.md
    reglas:
      - id: CON-F059-R01
        descripcion: La pestaña inicial es GENERAL en «Pre-registro» y «Registro», DETALLE Y DESCRIPCIÓN en «Desarrollo técnico» y «Modificación», APROBACIÓN SUMINSTRADOR en «Validación», RAC en «Revisión» y AUTORIDAD COMPETENTE en «Formalización» y «Aprobada».
        evidencia: ["src/forms/Form_frmDatosPC.cls:72", "src/classes/WorkflowServicio.cls:1844"]
      - id: CON-F059-R02
        descripcion: En una solicitud «Rechazada» no se puede grabar ninguna pestaña.
        evidencia: ["src/classes/WorkflowServicio.cls:1610"]
      - id: CON-F059-R03
        descripcion: En «Formalización» solo Calidad y administradores pueden grabar APROBACIÓN SUMINSTRADOR y AUTORIDAD COMPETENTE; en «Aprobada» ya no se puede grabar nada.
        evidencia: ["src/classes/WorkflowServicio.cls:1612", "src/classes/WorkflowServicio.cls:1620", "src/forms/Form_subfrmDatosPC_DecisionFinal.cls:43"]
      - id: CON-F059-R04
        descripcion: Antes de «Formalización», GENERAL la graban Calidad y administradores en cualquier estado.
        evidencia: ["src/classes/WorkflowServicio.cls:1634"]
      - id: CON-F059-R05
        descripcion: DETALLE Y DESCRIPCIÓN y MOTIVOS los graba solo el técnico en «Desarrollo técnico», y solo Calidad y administradores desde «Modificación».
        evidencia: ["src/classes/WorkflowServicio.cls:1638"]
      - id: CON-F059-R06
        descripcion: APROBACIÓN SUMINSTRADOR y RAC los graban Calidad y administradores a partir de «Modificación».
        evidencia: ["src/classes/WorkflowServicio.cls:1654", "src/classes/WorkflowServicio.cls:1660"]
      - id: CON-F059-R07
        descripcion: Si el usuario no puede grabar una pestaña, su botón «Grabar», sus botones de datos predeterminados y sus campos quedan desactivados.
        evidencia: ["src/forms/Form_frmDatosPC.cls:452", "src/modules/FormulariosPadreAuxiliares.bas:268", "src/modules/FUNCIONES UTILES.bas:946"]
      - id: CON-F059-R08
        descripcion: En «Modificación» tras un rechazo, la ficha muestra el aviso «RECHAZADO POR CALIDAD:».
        evidencia: ["src/forms/Form_frmDatosPC.cls:479"]
        # posible defecto: en la propuesta de cambio el aviso no incluye el motivo del rechazo, a diferencia de las otras dos fichas (src/forms/Form_frmDatosCDCA.cls:652).
      - id: CON-F059-R09
        descripcion: Al grabar cualquier pestaña, si no se ha cambiado ningún dato se muestra «No se han detectado cambios.» y no se graba; si se graba, «Datos guardados correctamente.».
        evidencia: ["src/forms/Form_frmDatosPC.cls:204", "src/forms/Form_frmDatosPC.cls:384"]
      - id: CON-F059-R10
        descripcion: «Ver detalle» oculta la ficha y devuelve a la gestión de la solicitud; «Salir» cierra la ficha.
        evidencia: ["src/forms/Form_frmDatosPC.cls:26", "src/forms/Form_frmDatosPC.cls:19"]
      - id: CON-F059-R11
        descripcion: Si la solicitud aún no tiene datos, la ficha propone como referencias del contrato y del suministrador el código largo del expediente y el código de la solicitud.
        evidencia: ["src/forms/Form_frmDatosPC.cls:517"]

