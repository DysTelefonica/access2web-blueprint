        descripcion: Al llegar a «Desarrollo técnico» la revisión de Calidad vuelve a «PENDIENTE».
        evidencia: ["src/classes/WorkflowServicio.cls:1278"]
      - id: CON-F030-R14
        descripcion: Se guardan la fecha y el usuario de la modificación, una línea en el historial de estados y una línea en el registro de cambios; todo en una única operación que se deshace si algo falla.
        evidencia: ["src/classes/WorkflowServicio.cls:1253", "src/classes/WorkflowServicio.cls:1284", "src/classes/WorkflowServicio.cls:1296"]
      - id: CON-F030-R15
        descripcion: "Tras el cambio se encola un correo con asunto «CONDOR - «aviso» | «nemotécnico» | «tipo» | «código»»; un fallo del correo no deshace el cambio de estado."
        evidencia: ["src/classes/WorkflowServicio.cls:1311", "src/classes/NotificacionServicio.cls:14"]
      - id: CON-F030-R16
        descripcion: "El destinatario depende del aviso: al pasar a «Registro», al jefe de proyecto y al responsable de Calidad; al pasar a «Modificación», al responsable de Calidad; al validar Calidad (de «Modificación» a «Validación»), al jefe de proyecto; al enviar al RAC, al aprobar el RAC y al aprobar la solicitud, al jefe de proyecto y al responsable de Calidad; en el resto de casos, al jefe de proyecto. La correspondencia depende del nombre que tenga cada estado en la tabla de estados."
