features:
  # ---------------------------------------------------------------------------
  # Arranque y menús
  # ---------------------------------------------------------------------------
  - id: CON-F001
    area: Arranque y menús
    nombre: Iniciar la aplicación
    descripcion: >-
      Al abrir Condor se muestra la pantalla de carga, se identifica al usuario, se comprueba la
      configuración y se abre el menú que corresponde a su perfil.
    formulario: CONDOR - Iniciando...
    control: ""
    tipo: automático
    roles: []
    resultado: >-
      Calidad y los administradores llegan al menú principal; los técnicos, al menú de técnico.
    tecnico:
      formulario: Form_frmSplash
      control: Form_Open / Form_Timer
      evidencia:
        - "src/forms/Form_frmSplash.cls:11"
        - "src/forms/Form_frmSplash.cls:39"
        - "src/modules/Variables Globales.bas:56"
      prd: prd/formularios/Form_frmSplash.md
    reglas:
      - id: CON-F001-R01
        descripcion: La cinta de opciones de Access se oculta, salvo que la aplicación se arranque en modo desarrollo.
        evidencia: ["src/forms/Form_frmSplash.cls:17"]
      - id: CON-F001-R02
        descripcion: Si no se puede conectar con la base de usuarios de la Lanzadera, el arranque se detiene con «No se pudo establecer conexión con la base de datos de usuarios (Lanzadera).».
        evidencia: ["src/modules/Variables Globales.bas:94"]
      - id: CON-F001-R03
        descripcion: El usuario se identifica por el correo que se pasa al arrancar la aplicación; si no se pasa ninguno, por su usuario de red de Windows.
        evidencia: ["src/modules/Variables Globales.bas:103", "src/classes/UsuarioServicio.cls:52"]
      - id: CON-F001-R04
        descripcion: Si el usuario no figura entre los usuarios de las aplicaciones, el arranque se detiene con «Su usuario de red no está registrado en la aplicación o no tiene permisos.».
        evidencia: ["src/modules/Variables Globales.bas:111"]
      - id: CON-F001-R05
        descripcion: El perfil se decide por este orden de prioridad. Es administrador quien está marcado como administrador; es de Calidad quien tiene marcado el permiso de Calidad en Condor; cualquier otro usuario es técnico.
        evidencia: ["src/classes/UsuarioServicio.cls:78"]
        # posible defecto: un usuario registrado sin ningún permiso en Condor entra como técnico, porque la falta de permiso no impide el acceso (src/classes/UsuarioServicio.cls:91).
      - id: CON-F001-R06
        descripcion: Se comprueba que todos los parámetros de configuración (carpetas, plantillas, versión, documentación de ayuda) se pueden leer; si alguno falla, el arranque se detiene con «CONDOR no pudo iniciarse debido a errores de configuración.».
        evidencia: ["src/modules/Variables Globales.bas:128", "src/classes/Entorno.cls:603"]
      - id: CON-F001-R07
        descripcion: La pantalla de carga permanece visible al menos dos segundos.
        evidencia: ["src/forms/Form_frmSplash.cls:40"]
      - id: CON-F001-R08
        descripcion: Si el perfil no es reconocido, se muestra «Rol de usuario desconocido. La aplicación se cerrará.».
        evidencia: ["src/forms/Form_frmSplash.cls:62"]
      - id: CON-F001-R09
        descripcion: Cualquier error del arranque se muestra como «Se ha producido un error crítico durante el arranque:» seguido del detalle, y se cierran las conexiones abiertas.
        evidencia: ["src/forms/Form_frmSplash.cls:69"]
        # posible defecto: tras el error crítico la aplicación no se cierra; la instrucción de salida está desactivada (src/forms/Form_frmSplash.cls:77).

  - id: CON-F002
    area: Arranque y menús
    nombre: Consultar el menú principal
    descripcion: >-
      Menú de entrada de Calidad y de los administradores. Muestra el usuario conectado, la versión
      y el número de tareas pendientes.
    formulario: CONDOR
    control: ""
    tipo: automático
    roles: [Calidad, Administrador]
    resultado: >-
      El usuario ve los accesos «Tareas pendientes», «Solicitudes» y «Nueva Solicitud», y el contador de tareas.
    tecnico:
      formulario: Form_frm0Ppal
      control: Form_Load
      evidencia: ["src/forms/Form_frm0Ppal.cls:149"]
      prd: prd/formularios/Form_frm0Ppal.md
    reglas:
      - id: CON-F002-R01
        descripcion: El título de la ventana indica «Usuario conectado» con el nombre y el perfil; mientras se actúa como técnico indica «Actuando como» con el técnico y la sesión real.
        evidencia: ["src/forms/Form_frm0Ppal.cls:158", "src/classes/Entorno.cls:565"]
      - id: CON-F002-R02
        descripcion: Si la aplicación está en modo de pruebas, el título añade «EN PRUEBAS».
        evidencia: ["src/classes/Entorno.cls:594"]
      - id: CON-F002-R03
        descripcion: El botón «Opciones Admin» solo es visible para los administradores.
        evidencia: ["src/forms/Form_frm0Ppal.cls:159"]
      - id: CON-F002-R04
        descripcion: La versión que se muestra es la del fichero de configuración de la aplicación.
        evidencia: ["src/forms/Form_frm0Ppal.cls:160", "src/classes/Entorno.cls:214"]
      - id: CON-F002-R05
        descripcion: El contador muestra el número de tareas pendientes y se oculta cuando no hay ninguna.
        evidencia: ["src/forms/Form_frm0Ppal.cls:238"]
      - id: CON-F002-R06
        descripcion: Para Calidad y los administradores es tarea pendiente toda solicitud que no está en «Desarrollo técnico» ni en «Aprobada», de cualquier responsable.
        evidencia: ["src/classes/SolicitudServicio.cls:113"]
        # posible defecto: las solicitudes rechazadas, que están en un estado final, también cuentan como tareas pendientes de Calidad (src/classes/SolicitudServicio.cls:116).
      - id: CON-F002-R07
        descripcion: El contador se recalcula al crear, cambiar de estado o eliminar una solicitud.
        evidencia: ["src/modules/Variables Globales.bas:165", "src/forms/Form_frmGestionSolicitud.cls:2398"]
      - id: CON-F002-R08
        descripcion: Si falla la carga del menú, la aplicación se cierra.
        evidencia: ["src/forms/Form_frm0Ppal.cls:168"]

  - id: CON-F003
    area: Arranque y menús
    nombre: Consultar el menú de técnico
    descripcion: >-
      Menú de entrada de los técnicos. Muestra el usuario conectado, la versión y el número de
      solicitudes que esperan su trabajo.
    formulario: CONDOR
    control: ""
    tipo: automático
    roles: [Técnico]
    resultado: >-
      El técnico ve los accesos «Tareas pendientes» y «Solicitudes» y el contador de tareas; no puede dar de alta solicitudes.
    tecnico:
      formulario: Form_frm0PpalTecnico
      control: Form_Load
      evidencia: ["src/forms/Form_frm0PpalTecnico.cls:58"]
      prd: prd/formularios/Form_frm0PpalTecnico.md
    reglas:
      - id: CON-F003-R01
        descripcion: El título de la ventana sigue la misma regla que el menú principal (CON-F002-R01 y CON-F002-R02).
        evidencia: ["src/forms/Form_frm0PpalTecnico.cls:64"]
      - id: CON-F003-R02
        descripcion: El contador muestra las solicitudes en «Desarrollo técnico» de los expedientes en los que el técnico figura como responsable, y se oculta cuando no hay ninguna.
        evidencia: ["src/forms/Form_frm0PpalTecnico.cls:152", "src/classes/SolicitudServicio.cls:110", "src/classes/SolicitudServicio.cls:124"]
      - id: CON-F003-R03
        descripcion: El botón «Volver a Sesión Ant.» solo es visible cuando un administrador o Calidad está actuando como técnico, y en ese caso se oculta «Salir».
        evidencia: ["src/forms/Form_frm0PpalTecnico.cls:68"]

  - id: CON-F004
    area: Arranque y menús
    nombre: Ver las tareas pendientes
    descripcion: >-
      Abre el buscador de solicitudes con la casilla «Mostrar solo tareas pendientes» marcada.
    formulario: CONDOR
    control: Tareas pendientes
    tipo: botón
    roles: []
    resultado: >-
      Se abre «BÚSQUEDA DE SOLICITUDES» con las tareas pendientes del perfil del usuario.
    tecnico:
      formulario: Form_frm0Ppal
      control: cmdTareasPendientes
      evidencia:
        - "src/forms/Form_frm0Ppal.cls:85"
        - "src/forms/Form_frm0PpalTecnico.cls:9"
        - "src/forms/Form_frmBuscarSolicitudes.cls:52"
    reglas:
      - id: CON-F004-R01
        descripcion: El buscador se abre igual al pulsar el icono, el recuadro o el contador de tareas.
        evidencia: ["src/forms/Form_frm0Ppal.cls:266", "src/forms/Form_frm0Ppal.cls:320", "src/forms/Form_frm0PpalTecnico.cls:186"]
      - id: CON-F004-R02
        descripcion: Las tareas pendientes son las definidas en CON-F002-R06 para Calidad y administradores y en CON-F003-R02 para técnicos.
        evidencia: ["src/classes/SolicitudServicio.cls:109"]

  - id: CON-F005
    area: Arranque y menús
    nombre: Abrir el buscador de solicitudes
    descripcion: >-
      Abre el buscador de solicitudes. Al técnico solo le muestra las solicitudes de sus expedientes.
    formulario: CONDOR
    control: Solicitudes
    tipo: botón
    roles: []
    resultado: >-
      Se abre «BÚSQUEDA DE SOLICITUDES» sin filtros (Calidad y administradores) o limitada a los expedientes del técnico.
    tecnico:
      formulario: Form_frm0PpalTecnico
      control: cmdBuscarSolicitudes
      evidencia:
        - "src/forms/Form_frm0Ppal.cls:48"
        - "src/forms/Form_frm0PpalTecnico.cls:77"
    reglas:
      - id: CON-F005-R01
        descripcion: Desde el menú de técnico, la búsqueda se lanza filtrada por el técnico conectado como responsable.
        evidencia: ["src/forms/Form_frm0PpalTecnico.cls:92"]
      - id: CON-F005-R02
        descripcion: El buscador también se abre al pulsar el recuadro que rodea el icono.
        evidencia: ["src/forms/Form_frm0Ppal.cls:316", "src/forms/Form_frm0PpalTecnico.cls:190"]

  - id: CON-F006
    area: Arranque y menús
    nombre: Iniciar el alta de una solicitud
    descripcion: >-
      Abre la ventana de alta. Cuando la solicitud se crea, abre su gestión y su ficha de datos para
      seguir completándola.
    formulario: CONDOR
    control: Nueva Solicitud
    tipo: botón
    roles: [Calidad, Administrador]
    resultado: >-
      Tras el alta se abren «GESTIÓN DE LA SOLICITUD» y la ficha de datos de la nueva solicitud.
    tecnico:
      formulario: Form_frm0Ppal
      control: cmdNuevaSolicitud
      evidencia: ["src/forms/Form_frm0Ppal.cls:103", "src/forms/Form_frm0Ppal.cls:271"]
    reglas:
      - id: CON-F006-R01
        descripcion: El alta solo está en el menú principal; el menú de técnico no tiene este botón.
        evidencia: ["src/forms/Form_frm0Ppal.cls:103", "src/forms/Form_frm0PpalTecnico.cls:1"]
      - id: CON-F006-R02
        descripcion: Si la ventana de alta ya está abierta, se trae al frente.
        evidencia: ["src/forms/Form_frm0Ppal.cls:106"]
      - id: CON-F006-R03
        descripcion: Tras crear la solicitud se recalcula el contador de tareas y se muestra «Solicitud creada correctamente. A continuación se abrirá el entorno de gestión para que pueda completar los datos.».
        evidencia: ["src/forms/Form_frm0Ppal.cls:280"]
        # posible defecto: el usuario recibe dos avisos seguidos de creación, el de la ventana de alta y este del menú (src/forms/Form_frmAltaSolicitud.cls:501).
      - id: CON-F006-R04
        descripcion: Se abre la gestión de la nueva solicitud y, a continuación, su ficha de datos según el tipo.
        evidencia: ["src/forms/Form_frm0Ppal.cls:289", "src/forms/Form_frmGestionSolicitud.cls:2328"]
      - id: CON-F006-R05
        descripcion: El alta también se inicia al pulsar el recuadro que rodea el icono.
        evidencia: ["src/forms/Form_frm0Ppal.cls:312"]

  - id: CON-F007
    area: Arranque y menús
    nombre: Abrir el manual de uso
    descripcion: >-
      Abre el manual de formación de Condor desde el menú.
    formulario: CONDOR
    control: Ayuda Workflow
    tipo: botón
    roles: []
    resultado: >-
      Se abre el manual de formación en PDF.
    tecnico:
      formulario: Form_frm0Ppal
      control: cmdAbrirAyuda / ComandoAyuda
      evidencia:
        - "src/forms/Form_frm0Ppal.cls:8"
        - "src/forms/Form_frm0Ppal.cls:123"
        - "src/forms/Form_frm0PpalTecnico.cls:32"
    reglas:
      - id: CON-F007-R01
        descripcion: El botón «Ayuda Workflow» y el icono de ayuda abren el mismo documento, el manual de formación de la carpeta de ayuda.
        evidencia: ["src/forms/Form_frm0Ppal.cls:13", "src/forms/Form_frm0Ppal.cls:128", "src/classes/Entorno.cls:475"]
        # posible defecto: «Ayuda Workflow» no abre la ayuda del flujo de trabajo; esa página está configurada pero ningún botón la usa (src/classes/Entorno.cls:458).
      - id: CON-F007-R02
        descripcion: Si el manual no existe se muestra «No se pudo obtener el manual de uso.» (botón) o «No se pudo obtener el documento de ayuda.» (icono).
        evidencia: ["src/forms/Form_frm0Ppal.cls:22", "src/forms/Form_frm0Ppal.cls:137"]
      - id: CON-F007-R03
        descripcion: El menú de técnico solo tiene el icono de ayuda, con el mismo comportamiento.
        evidencia: ["src/forms/Form_frm0PpalTecnico.cls:32"]

  - id: CON-F008
    area: Arranque y menús
    nombre: Entrar como un técnico
    descripcion: >-
      Permite a Calidad o a un administrador usar la aplicación como si fuera uno de los técnicos,
      para ver lo que ese técnico ve.
    formulario: CONDOR
    control: Entrar como
    tipo: campo
    roles: [Calidad, Administrador]
    resultado: >-
      Se cierra el menú principal y se abre el menú de técnico actuando como el técnico elegido.
    tecnico:
      formulario: Form_frm0Ppal
      control: cboUsuariosTecnicos / cmdImpersonar
      evidencia: ["src/forms/Form_frm0Ppal.cls:174"]
    reglas:
      - id: CON-F008-R01
        descripcion: La lista ofrece los jefes de proyecto de expedientes con PECAL que no están dados de baja.
        evidencia: ["src/forms/Form_frm0Ppal.cls:161", "src/classes/UsuarioServicio.cls:112"]
      - id: CON-F008-R02
        descripcion: Si no se elige a nadie se muestra «Por favor, seleccione un usuario técnico de la lista.».
        evidencia: ["src/forms/Form_frm0Ppal.cls:181"]
      - id: CON-F008-R03
        descripcion: Si el usuario elegido ya no existe se muestra «No se pudo encontrar al usuario seleccionado.».
        evidencia: ["src/forms/Form_frm0Ppal.cls:193"]
      - id: CON-F008-R04
        descripcion: Mientras dura, la aplicación aplica al usuario el perfil de técnico y todas las acciones quedan registradas a nombre del técnico elegido.
        evidencia: ["src/forms/Form_frm0Ppal.cls:197"]
      - id: CON-F008-R05
        descripcion: No hay comprobación de perfil en la acción; la puede usar cualquier usuario que llegue al menú principal.
        evidencia: ["src/forms/Form_frm0Ppal.cls:174"]

  - id: CON-F009
    area: Arranque y menús
    nombre: Volver a la sesión propia
    descripcion: >-
      Termina la actuación como técnico y devuelve al usuario a su propio perfil.
    formulario: CONDOR
    control: Volver a Sesión Ant.
    tipo: botón
    roles: [Calidad, Administrador]
    resultado: >-
      Se cierra el menú de técnico y se abre el menú principal con el usuario y el perfil reales.
    tecnico:
      formulario: Form_frm0PpalTecnico
      control: cmdVolverASesionAdmin
      evidencia: ["src/forms/Form_frm0PpalTecnico.cls:113"]
    reglas:
      - id: CON-F009-R01
        descripcion: Se recuperan el usuario y el perfil con los que se arrancó la aplicación.
        evidencia: ["src/forms/Form_frm0PpalTecnico.cls:117"]

  - id: CON-F010
    area: Arranque y menús
    nombre: Salir de la aplicación
