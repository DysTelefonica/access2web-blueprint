# Inventario de requisitos de Condor para Calidad (issue #1494).
# Esquema y reglas de redacción: docs/07-migracion/inventario-requisitos.md.
#
# Títulos de formulario: los menús sustituyen su título por
# «Usuario conectado: <nombre> (<perfil>)» al abrirse. Ese texto no identifica
# la ventana y contiene nombres de personas, así que se usa el rótulo visible
# de la cabecera. Las partes que cambian se escriben entre « ». Los
# subformularios de las fichas de datos usan el texto de su pestaña.
#
# Muchas acciones del flujo no son botones de Access: son botones de la página
# web que muestra la ventana «GESTIÓN DE LA SOLICITUD». Se cita como control el
# texto visible de esos botones en la página.

