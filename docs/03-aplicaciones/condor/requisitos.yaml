      - id: CON-F030-R17
        descripcion: El correo incluye el resumen del expediente, los datos de la solicitud con el estado y el autor, y una tarjeta de próximos pasos según el aviso.
        evidencia: ["src/classes/NotificacionServicio.cls:242", "src/classes/NotificacionServicio.cls:444"]
      - id: CON-F030-R18
        descripcion: Mientras la aplicación está en modo desarrollo, todos los correos se redirigen al usuario conectado con un aviso del destinatario real.
        evidencia: ["src/classes/NotificacionServicio.cls:29"]
        # posible defecto: el arranque fija siempre el modo desarrollo (src/modules/Variables Globales.bas:75), así que ningún correo llega a sus destinatarios reales.
      - id: CON-F030-R19
        descripcion: La copia se anula salvo que sea una dirección fija de una persona concreta, y todos los correos llevan copia oculta fija a esa misma dirección.
        evidencia: ["src/classes/NotificacionServicio.cls:37", "src/classes/NotificacionServicio.cls:49"]
        # posible defecto: los destinatarios en copia y oculta dependen de una dirección personal escrita en el código.
      - id: CON-F030-R20
        descripcion: Si actúa alguien en nombre de un técnico, el remitente del correo indica «(en nombre de «técnico»)».
        evidencia: ["src/classes/NotificacionServicio.cls:54"]
      - id: CON-F030-R21
        descripcion: Al terminar se muestra «El estado de la solicitud ha sido actualizado correctamente.» y se recalculan los contadores de tareas.
        evidencia: ["src/forms/Form_frmGestionSolicitud.cls:1631"]
      - id: CON-F030-R22
