        descripcion: Se comparan correo, nombre, matrícula, administrador, activado, imborrable, caducidad, mantener abierta, aplicaciones de prueba, fecha de alta, fecha de baja y usuario de red; teléfono, móvil y responsable no cuentan como cambio.
