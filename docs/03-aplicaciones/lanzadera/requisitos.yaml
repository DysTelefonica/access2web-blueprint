features:
  # ---------------------------------------------------------------- Acceso
  - id: LAN-F001
    area: Acceso
    nombre: Iniciar sesión
    descripcion: >-
      El usuario escribe su correo y su contraseña y entra en la Lanzadera.
      Según el estado de la contraseña entra al menú, se le obliga a cambiarla o se bloquea la cuenta.
    formulario: Formulario de Acceso
    control: Login
    tipo: botón
    roles: []
    resultado: >-
      Se abre el menú principal que corresponde al perfil del usuario, o la ventana de cambio de contraseña.
    tecnico:
      formulario: Form_FormLogin
      control: ComandoIniciarSesion
      evidencia:
        - "src/forms/Form_FormLogin.cls:59"
        - "src/modules/Funciones Genreales.bas:1345"
      prd: prd/formularios/Form_FormLogin.md
    reglas:
      - id: LAN-F001-R01
        descripcion: Si la contraseña está vacía se muestra «La contraseña no puede estar vacía» y no se continúa.
        evidencia: ["src/forms/Form_FormLogin.cls:76"]
      - id: LAN-F001-R02
        descripcion: Si el correo no contiene «@» se muestra «Se ha de introducir un correo válido» y no se continúa.
        evidencia: ["src/forms/Form_FormLogin.cls:80"]
      - id: LAN-F001-R03
        descripcion: Pulsar Intro en el campo de la contraseña equivale a pulsar «Login».
        evidencia: ["src/forms/Form_FormLogin.cls:300"]
      - id: LAN-F001-R04
        descripcion: Antes de validar, la Lanzadera carga su configuración y sus datos; si alguno no se puede cargar se muestra «Se han producido los siguientes Errores:» con la lista de lo que ha fallado.
        evidencia: ["src/forms/Form_FormLogin.cls:85", "src/modules/Variables Globales.bas:641"]
      - id: LAN-F001-R05
        descripcion: Si el correo no pertenece a ningún usuario registrado se muestra «Está intentando iniciar sesión con un correo electrónico no registrado. Ha de solicitar al alta de esta cuenta» y la Lanzadera se cierra.
        evidencia: ["src/forms/Form_FormLogin.cls:109", "src/forms/Form_FormLogin.cls:115"]
        # posible defecto: antes de esa comprobación se lee el correo del usuario no encontrado (src/forms/Form_FormLogin.cls:108), lo que provoca un error interno; el usuario ve un mensaje de error técnico y se avisa al administrador, en lugar del mensaje previsto.
      - id: LAN-F001-R06
        descripcion: Si la persona que tiene abierta la sesión de Windows del equipo es administradora de la Lanzadera, se entra con el correo escrito sin comprobar la contraseña.
        evidencia: ["src/forms/Form_FormLogin.cls:97", "src/forms/Form_FormLogin.cls:118"]
      - id: LAN-F001-R07
        descripcion: La contraseña escrita se compara cifrada con la guardada; si no coincide se muestra «Usuario/Pass no válida. Puede solicitar una nueva Pass pulsando el botón Obtener».
        evidencia: ["src/modules/Funciones Genreales.bas:1362", "src/modules/Funciones Genreales.bas:1368", "src/forms/Form_FormLogin.cls:152"]
      - id: LAN-F001-R08
        descripcion: Cada contraseña errónea suma un intento fallido; los intentos se cuentan mientras la Lanzadera sigue abierta y se bloquea la cuenta como describe LAN-F007.
        evidencia: ["src/modules/Funciones Genreales.bas:1370"]
      - id: LAN-F001-R09
        descripcion: Si la cuenta tiene fecha de bloqueo, la contraseña es correcta y no han pasado 20 meses desde el bloqueo, el acceso se trata como cuenta bloqueada (LAN-F007).
        evidencia: ["src/modules/Funciones Genreales.bas:1383", "src/modules/Funciones Genreales.bas:1385"]
        # posible defecto: el cálculo resta la fecha de bloqueo a la actual en meses con el orden invertido y siempre da un número negativo, de modo que una cuenta bloqueada no se desbloquea nunca sola; solo la desbloquea un administrador al guardar sus datos (LAN-F059-R08).
      - id: LAN-F001-R10
        descripcion: Si el usuario tiene una contraseña de un solo uso pendiente, solo puede entrar con esa contraseña; entonces se muestra «La Pass actual es de un solo uso y ha de cambiarla» y se abre la ventana de cambio de contraseña.
        evidencia: ["src/modules/Funciones Genreales.bas:1413", "src/forms/Form_FormLogin.cls:155"]
      - id: LAN-F001-R11
        descripcion: Si la contraseña ha caducado se muestra «La Pass actual ha caducado y ha de cambiarla» y se abre la ventana de cambio de contraseña.
        evidencia: ["src/forms/Form_FormLogin.cls:128"]
        # posible defecto: la comprobación de caducidad está detrás de una salida que da el acceso por correcto (src/modules/Funciones Genreales.bas:1409), así que la caducidad nunca se evalúa y este mensaje no llega a mostrarse.
      - id: LAN-F001-R12
        descripcion: El inicio de sesión no comprueba si la cuenta está desactivada ni si tiene fecha de baja.
        evidencia: ["src/modules/Funciones Genreales.bas:1345"]
        # posible defecto: un usuario desactivado o dado de baja puede entrar si conoce su contraseña.
      - id: LAN-F001-R13
        descripcion: Si se supera el límite de intentos de la ventana se muestra «Se ha intentado más de 5 veces y la cuenta se ha bloqueado. Hable con su administrador».
        evidencia: ["src/forms/Form_FormLogin.cls:72"]
        # posible defecto: el contador de esa comprobación nunca se incrementa (src/forms/Form_FormLogin.cls:7), así que el mensaje no se muestra nunca; el bloqueo real lo hace LAN-F007.
      - id: LAN-F001-R14
        descripcion: Con el acceso correcto se guarda en el equipo un fichero con el identificador del equipo, el correo y la fecha del día, que permite la entrada sin contraseña de LAN-F002.
        evidencia: ["src/forms/Form_FormLogin.cls:137", "src/modules/Funciones Genreales.bas:989"]
      - id: LAN-F001-R15
        descripcion: Con el acceso correcto se cierra la ventana de acceso y se abre el menú principal del perfil del usuario (LAN-F012).
        evidencia: ["src/forms/Form_FormLogin.cls:143", "src/modules/Variables Globales.bas:718"]

  - id: LAN-F002
    area: Acceso
    nombre: Entrar sin contraseña el mismo día
    descripcion: >-
      Si el usuario ya entró hoy desde el mismo equipo, la Lanzadera le abre el menú directamente sin pedirle la contraseña.
    formulario: Formulario de Acceso
    control: ""
    tipo: automático
    roles: []
    resultado: >-
      Se abre el menú principal del usuario sin pasar por la ventana de acceso.
    tecnico:
      formulario: Form_FormLogin
      control: Form_Load
      evidencia:
        - "src/forms/Form_FormLogin.cls:219"
        - "src/modules/Variables Globales.bas:676"
        - "src/modules/Funciones Genreales.bas:853"
      prd: prd/formularios/Form_FormLogin.md
    reglas:
      - id: LAN-F002-R01
        descripcion: La entrada sin contraseña solo funciona si existe el fichero de configuración general de las aplicaciones y en él está activada la opción de permitir un día sin contraseña.
        evidencia: ["src/modules/Funciones Genreales.bas:860", "src/modules/Funciones Genreales.bas:864", "src/classes/Entorno.cls:164"]
      - id: LAN-F002-R02
        descripcion: El fichero guardado en el último acceso correcto tiene que ser del mismo equipo y tener la fecha de hoy.
        evidencia: ["src/modules/Funciones Genreales.bas:869", "src/modules/Funciones Genreales.bas:878", "src/modules/Funciones Genreales.bas:803", "src/modules/Funciones Genreales.bas:833"]
      - id: LAN-F002-R03
        descripcion: Se entra con el usuario cuyo correo figura en ese fichero; si el correo ya no corresponde a ningún usuario se muestra la ventana de acceso normal.
        evidencia: ["src/modules/Variables Globales.bas:688", "src/modules/Variables Globales.bas:692"]
      - id: LAN-F002-R04
        descripcion: Cerrar sesión no anula esta entrada automática; al volver a la ventana de acceso el mismo día se vuelve a entrar sin contraseña.
        evidencia: ["src/forms/Form_FormMenuPrincipalAdmin.cls:94", "src/forms/Form_FormLogin.cls:219"]
        # posible defecto: el indicador de «sesión cerrada» se guarda (src/modules/Variables Globales.bas:127) pero ningún código lo consulta.

  - id: LAN-F003
    area: Acceso
    nombre: Preparar la ventana de acceso
    descripcion: >-
      Al abrir la Lanzadera se comprueba que el equipo tiene el componente de cifrado y se rellena el correo del último acceso.
    formulario: Formulario de Acceso
    control: ""
    tipo: automático
    roles: []
    resultado: >-
      La ventana de acceso queda con el correo rellenado y el cursor en la contraseña, o la Lanzadera se cierra si falta el componente.
    tecnico:
      formulario: Form_FormLogin
      control: Form_Load
      evidencia: ["src/forms/Form_FormLogin.cls:201"]
      prd: prd/formularios/Form_FormLogin.md
    reglas:
      - id: LAN-F003-R01
        descripcion: Si el equipo no puede cifrar una contraseña de prueba se muestra «No tiene instalado el NetFrameWork 3.5.Siga el manual para hacerlo» y la Lanzadera se cierra.
        evidencia: ["src/forms/Form_FormLogin.cls:230"]
      - id: LAN-F003-R02
        descripcion: Si el fichero del último acceso del equipo tiene un correo, ese correo se escribe en el campo «email» y el cursor pasa a la contraseña.
        evidencia: ["src/forms/Form_FormLogin.cls:242", "src/modules/Funciones Genreales.bas:655"]
      - id: LAN-F003-R03
        descripcion: Si se produce un error al preparar la ventana, se muestra el error y la Lanzadera se cierra.
        evidencia: ["src/forms/Form_FormLogin.cls:252", "src/forms/Form_FormLogin.cls:261"]

  - id: LAN-F004
    area: Acceso
    nombre: Obtener una contraseña de un solo uso
    descripcion: >-
      El usuario que ha olvidado la contraseña pide una nueva; la Lanzadera genera una contraseña de un solo uso y se la envía por correo.
    formulario: Formulario de Acceso
    control: Obtener
    tipo: botón
    roles: []
    resultado: >-
      La cuenta queda con una contraseña de un solo uso y el usuario la recibe en su correo.
    tecnico:
      formulario: Form_FormLogin
      control: ComandoCambioDeContrasenia
      evidencia:
        - "src/forms/Form_FormLogin.cls:9"
        - "src/classes/Usuario.cls:729"
      prd: prd/formularios/Form_FormLogin.md
    reglas:
      - id: LAN-F004-R01
        descripcion: Si el correo escrito no corresponde a ningún usuario se muestra «No hay registrado ningún usuario con ese correo. Hable con su administrador».
        evidencia: ["src/forms/Form_FormLogin.cls:27"]
      - id: LAN-F004-R02
        descripcion: No se comprueba el formato del correo; basta con que exista un usuario con ese correo.
        evidencia: ["src/forms/Form_FormLogin.cls:20", "src/forms/Form_FormLogin.cls:23"]
      - id: LAN-F004-R03
        descripcion: La contraseña nueva tiene 8 caracteres y al menos una mayúscula, una minúscula y un dígito.
        evidencia: ["src/classes/Usuario.cls:740", "src/modules/Funciones Genreales.bas:1150", "src/modules/Funciones Genreales.bas:1177"]
      - id: LAN-F004-R04
        descripcion: La contraseña nueva sustituye a la anterior y la cuenta queda marcada para cambiar la contraseña en el siguiente acceso (LAN-F001-R10).
        evidencia: ["src/classes/Usuario.cls:758", "src/classes/Usuario.cls:760"]
      - id: LAN-F004-R05
        descripcion: La contraseña de un solo uso se guarda también sin cifrar hasta que el usuario la cambia.
        evidencia: ["src/classes/Usuario.cls:763"]
        # posible defecto: guardar la contraseña sin cifrar permite leerla desde la base de datos.
      - id: LAN-F004-R06
        descripcion: Se envía al usuario un correo «Envio de Pass (LANZADERA)» con la contraseña de un solo uso y el aviso de que hable con su administrador si no la ha pedido él.
        evidencia: ["src/classes/Usuario.cls:770", "src/classes/Usuario.cls:801", "src/classes/Usuario.cls:809"]
      - id: LAN-F004-R07
        descripcion: Al terminar se muestra «En un periodo máximo de 10 minutos recibirá un correo electrónico con una contraseña de un solo uso».
        evidencia: ["src/forms/Form_FormLogin.cls:42"]

  - id: LAN-F005
    area: Acceso
    nombre: Salir de la Lanzadera desde la ventana de acceso
    descripcion: >-
      Cierra la Lanzadera sin entrar.
    formulario: Formulario de Acceso
    control: Salir
    tipo: botón
    roles: []
    resultado: >-
      La Lanzadera se cierra.
    tecnico:
      formulario: Form_FormLogin
      control: ComandoSalir
      evidencia: ["src/forms/Form_FormLogin.cls:190"]
      prd: prd/formularios/Form_FormLogin.md
    reglas:
      - id: LAN-F005-R01
        descripcion: Se pide confirmación con «¿Desea salir de la lanzadera»; si no se responde «Sí», no se cierra.
        evidencia: ["src/forms/Form_FormLogin.cls:192"]

  - id: LAN-F006
    area: Acceso
    nombre: Abrir la ayuda de la ventana
    descripcion: >-
      El botón de ayuda de la ventana de acceso y de la de cambio de contraseña busca el documento de ayuda de esa ventana para abrirlo.
    formulario: Formulario de Acceso
    control: Ayuda (botón con icono)
    tipo: botón
    roles: []
    resultado: >-
      Debería abrirse el documento de ayuda de la ventana.
    tecnico:
      formulario: Form_FormLogin
      control: ComandoAyudaFormulario
      evidencia:
        - "src/forms/Form_FormLogin.cls:265"
        - "src/forms/Form_FormUsuarioCambioPass.cls:106"
        - "src/modules/Funciones Genreales.bas:525"
      prd: prd/formularios/Form_FormLogin.md
    reglas:
      - id: LAN-F006-R01
        descripcion: El documento se busca en la lista de documentos de ayuda por el nombre de la ventana; si no hay ninguno registrado no ocurre nada.
        evidencia: ["src/modules/Funciones Genreales.bas:538", "src/modules/Funciones Genreales.bas:549"]
      - id: LAN-F006-R02
        descripcion: Aunque haya documento registrado, no se abre nada y no se muestra ningún mensaje.
        evidencia: ["src/modules/Funciones Genreales.bas:552", "src/forms/Form_FormLogin.cls:266"]
        # posible defecto: la línea que construye la ruta del documento está comentada, así que se intenta abrir una ruta vacía y el error se descarta.

  - id: LAN-F007
    area: Acceso
    nombre: Bloquear la cuenta por intentos fallidos
    descripcion: >-
      Tras varias contraseñas erróneas la cuenta se bloquea, se avisa al administrador y la Lanzadera se cierra.
    formulario: Formulario de Acceso
    control: Login
    tipo: automático
    roles: []
    resultado: >-
      La cuenta queda bloqueada y desactivada, y el administrador recibe un aviso por correo.
    tecnico:
      formulario: Form_FormLogin
      control: ComandoIniciarSesion
      evidencia:
        - "src/modules/Funciones Genreales.bas:1370"
        - "src/classes/Usuario.cls:680"
        - "src/forms/Form_FormLogin.cls:163"
      prd: prd/formularios/Form_FormLogin.md
    reglas:
      - id: LAN-F007-R01
        descripcion: La cuenta se bloquea en el sexto intento fallido seguido dentro de la misma apertura de la Lanzadera, y el contador vuelve a cero.
        evidencia: ["src/modules/Funciones Genreales.bas:1370", "src/modules/Funciones Genreales.bas:1375"]
        # posible defecto: el contador no distingue usuarios; los fallos con correos distintos en la misma apertura suman para bloquear la cuenta del último correo escrito.
      - id: LAN-F007-R02
        descripcion: Bloquear guarda la fecha y hora del bloqueo y desactiva la cuenta.
        evidencia: ["src/classes/Usuario.cls:688"]
      - id: LAN-F007-R03
        descripcion: El intento que provoca el bloqueo se trata como contraseña errónea; el aviso de cuenta bloqueada aparece en el siguiente intento con la contraseña correcta.
        evidencia: ["src/modules/Funciones Genreales.bas:1369", "src/modules/Funciones Genreales.bas:1383"]
      - id: LAN-F007-R04
        descripcion: Con la cuenta bloqueada se envía al administrador de la Lanzadera el correo «Usuario Bloqueado por exceso de intentos de acceso (LANZADERA)» indicando el correo del usuario.
        evidencia: ["src/forms/Form_FormLogin.cls:164", "src/modules/Funciones Genreales.bas:1311", "src/modules/Funciones Genreales.bas:1317"]
      - id: LAN-F007-R05
        descripcion: Se muestra «Cuenta bloqueada por exceso de intentos fallidos» y la Lanzadera se cierra.
        evidencia: ["src/forms/Form_FormLogin.cls:170", "src/forms/Form_FormLogin.cls:172"]

  - id: LAN-F008
    area: Acceso
    nombre: Cambiar la contraseña
    descripcion: >-
      El usuario escribe dos veces una contraseña nueva que cumpla las normas; la Lanzadera la guarda y le pide entrar de nuevo.
    formulario: Cambio de Contraseña
    control: Registrar
    tipo: botón
    roles: []
    resultado: >-
      La contraseña queda cambiada, se anota en el histórico y se vuelve a la ventana de acceso.
    tecnico:
      formulario: Form_FormUsuarioCambioPass
      control: ComandoRegistrar
      evidencia:
        - "src/forms/Form_FormUsuarioCambioPass.cls:8"
        - "src/classes/Usuario.cls:881"
