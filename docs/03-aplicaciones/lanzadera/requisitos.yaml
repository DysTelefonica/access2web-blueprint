# Inventario de requisitos de la Lanzadera para Calidad (issue #1494).
# Esquema y reglas de redacción: docs/07-migracion/inventario-requisitos.md.
#
# Títulos de formulario: los tres menús principales sustituyen su título por
# «Usuario conectado: <nombre>» al abrirse (src/forms/Form_FormMenuPrincipalAdmin.cls:39).
# Ese texto contiene nombres de personas, así que se usa el rótulo visible
# «Lanzadera de Aplicaciones». Las ventanas que se muestran dentro del menú
# usan el texto de la opción o pestaña que las abre; cuando dos pestañas se
# llaman igual se antepone la opción de menú («Usuario › Datos Generales»).
# Las partes que cambian se escriben entre « ».
#
# Las direcciones de correo fijas que aparecen en el código se describen como
# «el administrador de la Lanzadera»; no se copian.

