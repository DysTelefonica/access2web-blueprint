      - id: LAN-F059-R03
        descripcion: Aplican las mismas validaciones que en el alta (LAN-F058-R01 a LAN-F058-R07), excluyendo al propio usuario de la comprobación de duplicados.
        evidencia: ["src/classes/Usuario.cls:1588", "src/classes/Usuario.cls:1546"]
      - id: LAN-F059-R04
        descripcion: Se guardan nombre, matrícula, teléfono, móvil, usuario de red, activado, imborrable, administrador, caducidad de la contraseña y mantener la Lanzadera abierta; la contraseña no cambia.
