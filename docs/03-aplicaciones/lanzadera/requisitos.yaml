      - id: LAN-F059-R09
        descripcion: Con «Activado» a «No» la cuenta queda desactivada y con fecha de bloqueo la de la modificación.
        evidencia: ["src/forms/Form_FormUsuarioDatosGenerales.cls:306", "src/classes/Usuario.cls:1739"]
      - id: LAN-F059-R10
        descripcion: Se anota en las observaciones «Usuario actualizado por «correo del administrador»».
        evidencia: ["src/classes/Usuario.cls:1750"]
      - id: LAN-F059-R11
        descripcion: Aplican LAN-F058-R14 y LAN-F058-R15.
        evidencia: ["src/forms/Form_FormUsuarioDatosGenerales.cls:297", "src/forms/Form_FormUsuarioDatosGenerales.cls:315"]

