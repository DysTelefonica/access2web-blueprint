  - id: LAN-F058
    area: Usuarios
    nombre: Dar de alta un usuario
    descripcion: >-
      El administrador rellena la ficha vacía y la registra; la Lanzadera crea la cuenta con una contraseña de un solo uso.
    formulario: Usuario › Datos Generales
    control: Registrar
    tipo: botón
    roles: [Administrador]
    resultado: >-
      El usuario queda registrado, con una contraseña de un solo uso que tendrá que cambiar al entrar.
    tecnico:
      formulario: Form_FormUsuarioDatosGenerales
      control: ComandoRegistrar
      evidencia:
        - "src/forms/Form_FormUsuarioDatosGenerales.cls:242"
        - "src/classes/Usuario.cls:1572"
      prd: prd/formularios/Form_FormUsuarioDatosGenerales.md
    reglas:
      - id: LAN-F058-R01
        descripcion: El nombre es obligatorio; si falta se muestra «Ha de indicar el nombre».
        evidencia: ["src/classes/Usuario.cls:1588"]
      - id: LAN-F058-R02
        descripcion: El correo es obligatorio; si falta se muestra «Ha de indicar el correo».
        evidencia: ["src/classes/Usuario.cls:1593"]
      - id: LAN-F058-R03
        descripcion: El usuario de red es obligatorio; si falta se muestra «Se ha de indicar el usuario de red».
        evidencia: ["src/classes/Usuario.cls:1597"]
      - id: LAN-F058-R04
        descripcion: La matrícula es obligatoria; si falta se muestra «Se ha de indicar la Matricula».
        evidencia: ["src/classes/Usuario.cls:1601"]
      - id: LAN-F058-R05
        descripcion: La fecha de alta tiene que ser una fecha válida; si no, se muestra «Se ha de indicar FechaAlta».
        evidencia: ["src/classes/Usuario.cls:1605"]
      - id: LAN-F058-R06
        descripcion: El correo tiene que terminar en «@telefonica.com» y llevar un punto antes de la arroba; si no, se muestra «Ha de indicar el correo con formato válido».
        evidencia: ["src/classes/Usuario.cls:1609", "src/modules/Funciones Genreales.bas:1053", "src/modules/Funciones Genreales.bas:1057"]
      - id: LAN-F058-R07
        descripcion: No puede haber otro usuario con el mismo nombre, correo, usuario de red o matrícula; se muestra «Ya existe en la base de datos un nombre idéntico», «Ya existe en la base de datos un Correo idéntico», «Ya existe en la base de datos un Usuario de Red idéntico» o «Ya existe en la base de datos una Matricula idéntica».
        evidencia: ["src/classes/Usuario.cls:1631", "src/classes/Usuario.cls:1641", "src/classes/Usuario.cls:1651", "src/classes/Usuario.cls:1660"]
      - id: LAN-F058-R08
        descripcion: Se genera una contraseña de un solo uso de 8 caracteres y la cuenta queda obligada a cambiarla en el primer acceso.
        evidencia: ["src/classes/Usuario.cls:1617", "src/classes/Usuario.cls:1628", "src/classes/Usuario.cls:1701"]
      - id: LAN-F058-R09
        descripcion: El correo se guarda en minúsculas y la fecha de alta se guarda con el momento del registro, no con la escrita en la ficha.
        evidencia: ["src/classes/Usuario.cls:1686", "src/classes/Usuario.cls:1693"]
      - id: LAN-F058-R10
        descripcion: La próxima fecha de cambio de contraseña queda a tres meses del alta.
        evidencia: ["src/classes/Usuario.cls:1699"]
      - id: LAN-F058-R11
        descripcion: Se anota en las observaciones «Usuario dado de Registrar por «correo del administrador»».
        evidencia: ["src/classes/Usuario.cls:1709"]
      - id: LAN-F058-R12
        descripcion: Si «Activado» es «No», la cuenta se crea desactivada y con fecha de bloqueo la del registro.
        evidencia: ["src/forms/Form_FormUsuarioDatosGenerales.cls:302", "src/classes/Usuario.cls:1695"]
      - id: LAN-F058-R13
        descripcion: Tras el alta no se envía correo al usuario ni se anota la contraseña en el histórico.
        evidencia: ["src/classes/Usuario.cls:1721", "src/classes/Usuario.cls:1762"]
        # posible defecto: el correo «Alta Usuario (LANZADERA)» con la contraseña de un solo uso (src/classes/Usuario.cls:1143) solo se enviaría en una «edición» que nunca se marca como tal, así que el usuario nuevo no recibe su contraseña y el administrador tiene que usar «Resetear Pass».
      - id: LAN-F058-R14
        descripcion: «Responsable», «Fecha Baja» y «Aplicaciones Prueba» se leen de la ficha pero no se guardan.
        evidencia: ["src/forms/Form_FormUsuarioDatosGenerales.cls:284", "src/forms/Form_FormUsuarioDatosGenerales.cls:292", "src/forms/Form_FormUsuarioDatosGenerales.cls:297", "src/classes/Usuario.cls:1677"]
        # posible defecto: el registro no escribe esos tres datos, ni en el alta ni en la modificación.
      - id: LAN-F058-R15
        descripcion: Al terminar no se muestra ningún mensaje; la ficha queda con el identificador del usuario nuevo.
        evidencia: ["src/forms/Form_FormUsuarioDatosGenerales.cls:315", "src/forms/Form_FormUsuarioDatosGenerales.cls:319"]

  - id: LAN-F059
