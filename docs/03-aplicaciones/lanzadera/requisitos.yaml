  - id: LAN-F028
    area: Aplicaciones
    nombre: Abrir una aplicación desde su icono
    descripcion: >-
      Al pulsar un icono activo, la Lanzadera comprueba que la aplicación se puede abrir, actualiza la copia del equipo si hay una versión nueva en el servidor y la abre con el usuario conectado.
      Son las reglas comunes a todos los iconos (LAN-F029 a LAN-F046).
    formulario: Fuera de la Oficina CARU
    control: Icono de la aplicación
    tipo: botón
    roles: []
    resultado: >-
      La aplicación se abre con el correo del usuario conectado y, si así lo indica su configuración, la Lanzadera se cierra.
    tecnico:
      formulario: Form_FormAplicacionesFueraOficina
      control: Lanzar
      evidencia:
        - "src/modules/Funciones Genreales.bas:1792"
        - "src/classes/Aplicacion.cls:1323"
      prd: prd/formularios/Form_FormAplicacionesFueraOficina.md
    reglas:
      - id: LAN-F028-R01
        descripcion: "Cada icono identifica su aplicación; si no existe en la lista de aplicaciones se muestra «No se ha encontrado una aplicación con el ID: «n.º»»."
        evidencia: ["src/modules/Funciones Genreales.bas:1803", "src/modules/Funciones Genreales.bas:1813"]
      - id: LAN-F028-R02
        descripcion: Si la aplicación es solo de oficina y el usuario no está en la oficina se muestra «Esta aplicación sólo se puede ejecutar desde la Oficina».
        evidencia: ["src/modules/Funciones Genreales.bas:1817"]
      - id: LAN-F028-R03
        descripcion: Si no se conoce el correo del usuario conectado se muestra «No se sabe el usuario que ha hecho login».
        evidencia: ["src/classes/Aplicacion.cls:1345", "src/classes/Aplicacion.cls:1352"]
      - id: LAN-F028-R04
        descripcion: La carpeta de la aplicación en el perfil del usuario del equipo se crea si no existe; si no se puede obtener se muestra «No se ha podido obtener la carpeta del aplicativo en local del usuario».
        evidencia: ["src/classes/Aplicacion.cls:288", "src/classes/Aplicacion.cls:1361"]
      - id: LAN-F028-R05
        descripcion: Si no se encuentra la carpeta de la aplicación en el servidor se muestra «No se ha podido obtener la carpeta del aplicativo en el servidor».
        evidencia: ["src/classes/Aplicacion.cls:1369"]
      - id: LAN-F028-R06
        descripcion: Si no se encuentra el fichero de versión del servidor se muestra «No se ha podido obtener el archivo de configuración del servidor».
        evidencia: ["src/classes/Aplicacion.cls:1382"]
      - id: LAN-F028-R07
        descripcion: Si no se encuentra el programa de la aplicación en el servidor se muestra «No se ha podido obtener el ejecutable del servidor» con su ruta.
        evidencia: ["src/classes/Aplicacion.cls:1396"]
      - id: LAN-F028-R08
        descripcion: Si no se encuentra el icono de la aplicación en el servidor se muestra un mensaje técnico con la ruta del icono.
        evidencia: ["src/classes/Aplicacion.cls:1411"]
      - id: LAN-F028-R09
        descripcion: Antes de copiar se comprueba de nuevo el icono del servidor en lugar de la imagen de presentación.
        evidencia: ["src/classes/Aplicacion.cls:1425"]
        # posible defecto: si falta la imagen de presentación en el servidor no se avisa y la copia falla con un error técnico.
      - id: LAN-F028-R10
        descripcion: Si la versión de la copia del equipo es distinta de la del servidor, se copian al equipo el programa, el icono, la imagen de presentación y el fichero de versión, y se pone el icono a la copia.
        evidencia: ["src/classes/Aplicacion.cls:1434", "src/classes/Aplicacion.cls:1444", "src/classes/Aplicacion.cls:1457"]
      - id: LAN-F028-R11
        descripcion: Si la versión coincide, solo se copian los ficheros que falten en el equipo.
        evidencia: ["src/classes/Aplicacion.cls:1468"]
        # posible defecto: si en el equipo no existe el fichero de versión (primera apertura o tras «Recargar Versiones»), leer la versión del equipo devuelve un error (src/classes/Aplicacion.cls:1731) que interrumpe la apertura (src/classes/Aplicacion.cls:1435) en lugar de forzar la copia.
      - id: LAN-F028-R12
        descripcion: CONDOR y «No Conformidades Prueba» se abren en modo de solo ejecución cuando la configuración del equipo lo indica.
        evidencia: ["src/classes/Aplicacion.cls:1499"]
      - id: LAN-F028-R13
        descripcion: La aplicación se abre desde la copia del equipo pasándole el correo del usuario conectado, para que no vuelva a pedir el acceso.
        evidencia: ["src/classes/Aplicacion.cls:1509"]
      - id: LAN-F028-R14
        descripcion: Si el usuario no tiene marcada «Mantener Lanzadera Abierta», la Lanzadera se cierra después de abrir la aplicación.
        evidencia: ["src/classes/Aplicacion.cls:1514"]
      - id: LAN-F028-R15
        descripcion: Cuando la apertura falla, el mensaje de error se muestra dos veces.
        evidencia: ["src/modules/Funciones Genreales.bas:1838", "src/forms/Form_FormAplicacionesFueraOficina.cls:217"]
        # posible defecto: el mensaje lo muestra la rutina común y lo vuelve a mostrar el botón.
      - id: LAN-F028-R16
        descripcion: Abrir una aplicación no deja registro de la apertura en la Lanzadera.
        evidencia: ["src/modules/Funciones Genreales.bas:3080", "src/modules/Funciones Genreales.bas:1823"]

