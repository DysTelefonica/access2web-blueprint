        evidencia: ["src/classes/SolicitudOperaciones.cls:65"]
      - id: SHP-F021-R14
        descripcion: En una solicitud nueva el gestor propuesto es el usuario conectado.
        evidencia: ["src/forms/Form_FormSolicitudesAltaTraspasoDatos.cls:379"]
      - id: SHP-F021-R15
        descripcion: La lista de gestores contiene los tramitadores; la de empresa tramitadora, solo las empresas marcadas como tramitadoras de HPS; la de empresa del usuario, todas las empresas.
