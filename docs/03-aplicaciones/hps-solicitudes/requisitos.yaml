      - id: SHP-F033-R08
        descripcion: Para que el correo entre en la cola debe tener al menos un destinatario con «@» («No hay destinatarios») y asunto («Ha de indicar el asunto»); si lleva adjunto, este debe ser accesible («El Adjunto no es alcanzable»).
