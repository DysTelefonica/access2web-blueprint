      - id: SHP-F033-R03
        descripcion: Si el trámite aún no tiene fecha, la casilla «Registrar/Actualizar fecha del Hito en la Base de Datos» queda marcada y bloqueada, la fecha propuesta es hoy y el botón dice «Registrar y Enviar».
