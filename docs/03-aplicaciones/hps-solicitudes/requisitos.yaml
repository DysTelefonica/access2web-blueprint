      - id: SHP-F021-R16
        descripcion: Tras guardar se cierra la ventana «ALTA DE SOLICITUD» si estaba abierta y se actualiza la cabecera de la ficha.
        evidencia: ["src/forms/Form_FormSolicitudesAltaTraspasoDatos.cls:690", "src/forms/Form_FormSolicitudesAltaTraspasoDatos.cls:818"]
      - id: SHP-F021-R17
        descripcion: La pestaña «Datos» no comprueba el perfil del usuario; el técnico puede registrar datos.
        evidencia: ["src/forms/Form_FormSolicitudesAltaTraspasoDatos.cls:323"]
