# Inventario de requisitos de Solicitudes HPS para Calidad (issue #1494).
# Esquema y reglas de redacción: docs/07-migracion/inventario-requisitos.md.
#
# Títulos de formulario: las ventanas sustituyen su título por
# «SOLICITUDES HPS Versión <versión> <nombre del usuario>» al abrirse. Ese texto
# no identifica la ventana y contiene nombres de personas, así que en su lugar
# se usa el rótulo visible de la cabecera. Las partes que cambian se escriben
# entre « ». Los subformularios de la ficha de solicitud usan el texto de su
# pestaña («Datos», «Fechas»).
#
# Botones con icono: muchos botones no tienen texto visible, solo un icono y una
# etiqueta emergente. En esos casos `control` es «icono» seguido del texto de la
# etiqueta emergente, o el rótulo que el usuario ve junto al icono.
#
# Perfiles: la aplicación reconoce dos perfiles. «Administrador» (administrador
# general o con permiso de administrador en la aplicación) y «Técnico» (permiso
# de técnico, título «Sólo lectura»). Los tramitadores y gestores que aparecen
# en las listas son los usuarios con permiso de administrador en la aplicación.

