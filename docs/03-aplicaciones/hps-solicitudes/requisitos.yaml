features:
  # ---------------------------------------------------------------------------
  # Arranque y menú principal
  # ---------------------------------------------------------------------------
  - id: SHP-F001
    area: Arranque
    nombre: Iniciar la aplicación e identificar al usuario
    descripcion: >-
      Al abrir la aplicación se muestra una ventana de carga que identifica al usuario, comprueba sus permisos,
      carga la configuración y calcula las tareas pendientes antes de abrir el menú principal.
    formulario: HPS SOLICITUDES
    control: ""
    tipo: automático
    roles: []
    resultado: >-
      Se abre el menú principal con el usuario identificado, su perfil y los contadores de pendientes calculados.
    tecnico:
      formulario: Form_frmSplash
      control: Form_Timer
      evidencia:
        - "src/forms/Form_frmSplash.cls:25"
        - "src/modules/Variables Globales.bas:231"
      prd: prd/formularios/Form_frmSplash.md
    reglas:
      - id: SHP-F001-R01
        descripcion: Si la aplicación se abre con un correo como parámetro de arranque, el usuario se identifica por ese correo; si no, por el usuario de Windows conectado.
        evidencia: ["src/modules/Variables Globales.bas:289", "src/modules/Variables Globales.bas:300"]
      - id: SHP-F001-R02
        descripcion: Si no se puede determinar el usuario se muestra «No se ha podido determinar el usuario que está usando la herramienta».
        evidencia: ["src/modules/Variables Globales.bas:312"]
      - id: SHP-F001-R03
        descripcion: Es administrador el usuario marcado como administrador general o el que tiene permiso de administrador en la aplicación.
        evidencia: ["src/classes/Usuario.cls:66", "src/classes/Usuario.cls:76"]
      - id: SHP-F001-R04
        descripcion: Si el usuario no es administrador ni tiene permiso de técnico en la aplicación, se muestra «Usuario no autorizado».
        evidencia: ["src/modules/Variables Globales.bas:323", "src/modules/Variables Globales.bas:329"]
      # posible defecto: ante cualquier error de arranque (incluido «Usuario no autorizado») la ventana de carga
      # muestra el error y abre igualmente el menú principal.
      - id: SHP-F001-R05
        descripcion: Si se produce un error durante el arranque se muestra «Ha habido un error en el inicio» con el detalle y, a continuación, se abre el menú principal.
        evidencia: ["src/forms/Form_frmSplash.cls:57"]
      - id: SHP-F001-R06
        descripcion: El usuario se considera en la oficina si alguna de las direcciones de red del equipo pertenece a la subred de la oficina; esto condiciona las operaciones que consultan la base de datos de HPS.
        evidencia: ["src/modules/Variables Globales.bas:341", "src/modules/FUNCIONES UTILES.bas:850"]
      - id: SHP-F001-R07
        descripcion: Si algún dato de entorno no se puede cargar se muestra «Se han producido los siguientes Errores» con la lista de datos fallidos.
        evidencia: ["src/modules/Variables Globales.bas:382"]
      - id: SHP-F001-R08
        descripcion: Si no se puede obtener la configuración se muestra «No se ha podido obtener la configuración».
        evidencia: ["src/modules/Variables Globales.bas:405"]
      - id: SHP-F001-R09
        descripcion: Para el perfil técnico el título de las ventanas añade «(Sólo lectura)».
        evidencia: ["src/modules/Variables Globales.bas:386"]
      - id: SHP-F001-R10
        descripcion: Al arrancar se comprueba si la configuración está completa; el resultado se muestra en el menú principal (ver SHP-F002).
        evidencia: ["src/modules/Variables Globales.bas:409"]
      - id: SHP-F001-R11
        descripcion: Al terminar la carga se calculan los totales de solicitudes pendientes, globales y del usuario conectado (ver SHP-F002).
        evidencia: ["src/forms/Form_frmSplash.cls:47"]
      - id: SHP-F001-R12
        descripcion: Salvo que la aplicación se abra en modo desarrollo, se oculta la cinta de opciones de Access.
        evidencia: ["src/forms/Form_frmSplash.cls:12"]

  - id: SHP-F002
    area: Menú principal
    nombre: Consultar el estado general en el menú principal
    descripcion: >-
      El menú principal muestra la versión, el número de solicitudes pendientes y si la configuración está completa.
    formulario: SOLICITUDES HPS
    control: ""
    tipo: automático
    roles: []
    resultado: >-
      El usuario ve «Pendientes (propias/totales)» y «Parámetros COMPLETOS» o «Parámetros INCOMPLETOS».
    tecnico:
      formulario: Form_Form0BDOpciones
      control: Form_Open
      evidencia: ["src/forms/Form_Form0BDOpciones.cls:291", "src/forms/Form_Form0BDOpciones.cls:246"]
      prd: prd/formularios/Form_Form0BDOpciones.md
    reglas:
      - id: SHP-F002-R01
        descripcion: El rótulo de pendientes muestra «Pendientes (n/total)», donde n son las pendientes del usuario conectado y total las de todos los tramitadores; se pinta en rojo si el total es mayor que cero.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:357"]
      # posible defecto: para el perfil técnico el primer número es siempre 0, no se calcula.
      - id: SHP-F002-R02
        descripcion: Para el perfil técnico el rótulo muestra siempre «Pendientes (0/total)».
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:349", "src/classes/Entorno.cls:2485"]
      - id: SHP-F002-R03
        descripcion: El total de pendientes suma las solicitudes pendientes de envío del Excel, de los recordatorios del Excel, de alta en MARGA, de los recordatorios y del envío del DPS, de envío a la ONS y de fin de tramitación.
        evidencia: ["src/classes/Entorno.cls:2474"]
      - id: SHP-F002-R04
        descripcion: Se muestra «Parámetros INCOMPLETOS» si falta algún dato obligatorio de la configuración (ver SHP-F074) y «Parámetros COMPLETOS» en caso contrario.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:266", "src/modules/FUNCIONES UTILES.bas:2355"]
      - id: SHP-F002-R05
        descripcion: Los botones de tareas pendientes, configuración, solicitudes y correos quedan activos para todos los perfiles.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:262", "src/forms/Form_Form0BDOpciones.cls:280"]
      - id: SHP-F002-R06
        descripcion: Si el menú no se puede cargar, se muestra el error y la aplicación se cierra, salvo en modo desarrollo.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:322"]
      - id: SHP-F002-R07
        descripcion: Al guardar la configuración se actualiza el rótulo de parámetros completos o incompletos del menú.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:374"]

  - id: SHP-F003
    area: Menú principal
    nombre: Recalcular los pendientes del menú
    descripcion: >-
      Vuelve a consultar la base de datos para actualizar el contador de pendientes del menú.
    formulario: SOLICITUDES HPS
    control: icono «Actualizar»
    tipo: botón
    roles: []
    resultado: >-
      El contador «Pendientes (n/total)» refleja los datos actuales.
    tecnico:
      formulario: Form_Form0BDOpciones
      control: ComandoActualizar
      evidencia: ["src/forms/Form_Form0BDOpciones.cls:27"]
      prd: prd/formularios/Form_Form0BDOpciones.md
    reglas:
      - id: SHP-F003-R01
        descripcion: El recálculo descarta los datos en memoria y vuelve a consultar todas las listas de pendientes.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:39", "src/classes/Entorno.cls:2457"]

  - id: SHP-F004
    area: Menú principal
    nombre: Abrir la ayuda de la ventana
    descripcion: >-
      Abre el documento PDF de ayuda asociado a la ventana activa. El mismo botón existe en la mayoría de ventanas.
    formulario: SOLICITUDES HPS
    control: icono «Ayuda»
    tipo: botón
    roles: []
    resultado: >-
      Se abre una copia local del PDF de ayuda de la ventana.
    tecnico:
      formulario: Form_Form0BDOpciones
      control: ComandoAyuda
      evidencia: ["src/forms/Form_Form0BDOpciones.cls:67", "src/modules/FUNCIONES UTILES.bas:475"]
      prd: prd/formularios/Form_Form0BDOpciones.md
    reglas:
      - id: SHP-F004-R01
        descripcion: El PDF de ayuda se busca en la carpeta de ayuda con el nombre interno de la ventana activa.
        evidencia: ["src/modules/FUNCIONES UTILES.bas:493"]
      - id: SHP-F004-R02
        descripcion: Si no existe el PDF se muestra «No se ha generado la ayuda para este formulario aún».
        evidencia: ["src/modules/FUNCIONES UTILES.bas:495"]
      - id: SHP-F004-R03
        descripcion: El PDF se copia a la carpeta local antes de abrirlo; si la copia local ya está abierta se muestra «Tiene el archivo abierto».
        evidencia: ["src/modules/FUNCIONES UTILES.bas:456", "src/modules/FUNCIONES UTILES.bas:458"]
      # posible defecto: el botón de ayuda del menú principal envía un correo al administrador con el texto «Prueba de Error» cada vez que se pulsa.
      - id: SHP-F004-R04
        descripcion: En el menú principal, pulsar «Ayuda» deja además en la cola de correos un aviso al administrador con el texto «Prueba de Error».
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:73", "src/modules/FUNCIONES UTILES.bas:585"]

  - id: SHP-F005
    area: Menú principal
    nombre: Abrir las ventanas de trabajo desde el menú
    descripcion: >-
      Desde el menú principal se abren la gestión de solicitudes, las tareas pendientes, las entidades, la gestión de correos y la configuración.
    formulario: SOLICITUDES HPS
    control: Solicitudes | Pendientes | Entidades | Correos | icono «Parámetros de configuración del aplicativo»
    tipo: menú
    roles: []
    resultado: >-
      Se abre la ventana elegida.
    tecnico:
      formulario: Form_Form0BDOpciones
      control: ComandoGestionSolicitudes, ComandoTareasPendientes, ComandoEntidades, ComandoGestionCorreos, ComandoConfiguracion
      evidencia:
        - "src/forms/Form_Form0BDOpciones.cls:186"
        - "src/forms/Form_Form0BDOpciones.cls:216"
        - "src/forms/Form_Form0BDOpciones.cls:128"
        - "src/forms/Form_Form0BDOpciones.cls:156"
        - "src/forms/Form_Form0BDOpciones.cls:96"
      prd: prd/formularios/Form_Form0BDOpciones.md
    reglas:
      - id: SHP-F005-R01
        descripcion: Las tareas pendientes y la configuración se cierran y se vuelven a abrir si ya estaban abiertas; las demás ventanas solo se abren si no lo estaban.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:106", "src/forms/Form_Form0BDOpciones.cls:223", "src/forms/Form_Form0BDOpciones.cls:137"]
      - id: SHP-F005-R02
        descripcion: Cuando en las tareas pendientes se modifica una solicitud, el contador de pendientes del menú se recalcula.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:405"]
      - id: SHP-F005-R03
        descripcion: Ninguna de estas entradas comprueba el perfil del usuario.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:262"]

  - id: SHP-F006
    area: Menú principal
    nombre: Salir de la aplicación
    descripcion: >-
      Cierra la aplicación tras pedir confirmación.
    formulario: SOLICITUDES HPS
    control: Salir
    tipo: botón
    roles: []
    resultado: >-
      La aplicación se cierra guardando los objetos abiertos.
    tecnico:
      formulario: Form_Form0BDOpciones
      control: cmdSalir
      evidencia: ["src/forms/Form_Form0BDOpciones.cls:9"]
      prd: prd/formularios/Form_Form0BDOpciones.md
    reglas:
      - id: SHP-F006-R01
        descripcion: Antes de salir se pregunta «¿Desea realmente salir de la aplicación»; si no se responde Sí, no se sale.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:14"]

  - id: SHP-F007
    area: Transversal
    nombre: Avisar al administrador de errores inesperados
    descripcion: >-
      Cuando una acción falla por un error no previsto, la aplicación deja en la cola de correos un aviso para el administrador con el detalle.
    formulario: (todas las ventanas)
    control: ""
    tipo: automático
    roles: []
    resultado: >-
      Queda un correo pendiente de envío al administrador con la ventana, el control, el equipo y el detalle del error.
    tecnico:
      formulario: FUNCIONES UTILES
      control: CorreoAlAdministrador
      evidencia: ["src/modules/FUNCIONES UTILES.bas:585"]
    reglas:
      - id: SHP-F007-R01
        descripcion: El asunto del aviso es «Error en SOLICITUD HPS» seguido del nombre del usuario y de si está en la oficina o fuera.
        evidencia: ["src/modules/FUNCIONES UTILES.bas:635"]
      - id: SHP-F007-R02
        descripcion: El cuerpo indica la ventana, el control, el nombre del equipo y el detalle del error.
        evidencia: ["src/modules/FUNCIONES UTILES.bas:637"]
      # posible defecto: los destinatarios del aviso están fijados en el código, incluida una dirección personal externa.
      - id: SHP-F007-R03
        descripcion: Los destinatarios del aviso están fijados en el código, no en la configuración.
        evidencia: ["src/modules/FUNCIONES UTILES.bas:649"]
      - id: SHP-F007-R04
        descripcion: Los errores de validación previstos (mensajes de negocio) no generan aviso; solo los errores inesperados.
        evidencia: ["src/forms/Form_Form0BDOpciones.cls:57"]

  - id: SHP-F008
    area: Transversal
    nombre: Registrar el historial de acciones de cada solicitud
    descripcion: >-
      Cada acción relevante sobre una solicitud (alta, registro de fechas, envíos de correo, cambios de tipo, eliminaciones de fases) queda anotada en su historial.
    formulario: (todas las ventanas de solicitud)
    control: ""
    tipo: automático
    roles: []
    resultado: >-
      El historial de la solicitud guarda la acción, una descripción, si los correos automáticos estaban activos y quién la hizo.
    tecnico:
      formulario: FUNCIONES UTILES
      control: RegistrarLogGeneral
      evidencia: ["src/modules/FUNCIONES UTILES.bas:895"]
    reglas:
      - id: SHP-F008-R01
        descripcion: Cada anotación indica si los correos automáticos estaban activos; vale «No» si están desactivados en la configuración general y, si no, el valor de la propia solicitud.
        evidencia: ["src/modules/FUNCIONES UTILES.bas:906", "src/modules/FUNCIONES UTILES.bas:1749"]
      - id: SHP-F008-R02
        descripcion: Al guardar cambios en una solicitud se anota el usuario y la fecha de creación o, si ya existía, del último cambio, y se recalcula su estado.
        evidencia: ["src/modules/FUNCIONES UTILES.bas:106", "src/modules/FUNCIONES UTILES.bas:114"]
      - id: SHP-F008-R03
        descripcion: Cada cambio guardado actualiza el registro de última modificación; los administradores lo ven en las ventanas de solicitudes y de tareas pendientes.
        evidencia: ["src/modules/FUNCIONES UTILES.bas:123", "src/modules/FUNCIONES UTILES.bas:127"]

  - id: SHP-F009
    area: Transversal
    nombre: Calcular el estado de la solicitud
    descripcion: >-
      El estado de una solicitud no se elige: se calcula a partir de las fechas de los trámites registrados y de su tipo.
    formulario: (todas las ventanas de solicitud)
    control: ""
    tipo: automático
    roles: []
    resultado: >-
      La solicitud muestra un estado entre Pendiente de Envío Excel, Pendiente Excel Relleno, Pendiente Alta Marga, Pendiente Envío DPS, Pendiente Envío ONS,
      Pendiente de Enviar Tramitación a la ONS (Traspaso), Pendiente fin tramitación, Tramitado, Desestimado y Cancelado.
    tecnico:
      formulario: SolicitudFechas
      control: EstadoCalculado
      evidencia: ["src/classes/SolicitudFechas.cls:434", "src/classes/Solicitud.cls:1039"]
    reglas:
      - id: SHP-F009-R01
        descripcion: Una solicitud sin ninguna fecha registrada está «Pendiente de Envío Excel».
        evidencia: ["src/classes/Solicitud.cls:1052"]
      - id: SHP-F009-R02
        descripcion: Si tiene fecha de desestimación está «Desestimado», prevalezca sobre cualquier otra fecha.
        evidencia: ["src/classes/SolicitudFechas.cls:442"]
      - id: SHP-F009-R03
        descripcion: Si tiene fecha de cancelación (y no de desestimación) está «Cancelado».
