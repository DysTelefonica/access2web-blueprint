      - id: SHP-F021-R12
        descripcion: Al modificar una solicitud los campos que se dejan vacíos se borran y se anotan el usuario y la fecha del cambio.
        evidencia: ["src/classes/SolicitudOperaciones.cls:159", "src/classes/SolicitudOperaciones.cls:260"]
      - id: SHP-F021-R13
