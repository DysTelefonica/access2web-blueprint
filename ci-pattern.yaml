# ci-pattern.yaml — parámetros del patrón de CI para access2web-blueprint.
# Formato P<NN>_<name>, según
# personal/ardelperal/ci-pattern/assets/parameters.schema.json del catálogo
# DysTelefonica/team-skills, pin a1cca271.
#
# P01, P06, P09, P10, P11, P12, P14, P15, P16, P28, P49 y P50 son los
# parámetros que consume el generador del documento operativo.
# P18, P21 y P45 los exige el esquema sin default seguro, pero el repositorio
# no aloja ningún mecanismo de despliegue (fase 0,
# deploy_binding.applicable=false) y el generador no los lee: se declaran con
# su valor de no aplicación, igual que P14 y P15.

P01_branch_name_pattern: '^(feat|fix|refactor|docs|ci|test|chore)/\d+-[a-z0-9]+(-[a-z0-9]+)*$'
P06_review_budget_lines: 400
P09_labels_type: {}
P10_label_approval: status:approved
P11_label_chain_partial: chain:partial
P12_issue_form_dir: .github/ISSUE_TEMPLATE
P14_status_context_e2e: "no aplica: el repositorio no despliega en producción"
P15_status_context_smoke: "no aplica: el repositorio no despliega en producción"
P16_release_runbook_path: docs/11-releases.md
P18_health_url_var: NO_APLICA
P21_smoke_user_agent: "no aplica: el repositorio no despliega en producción"
P28_required_status_contexts: [required]
P45_deploy_image: "no aplica: el repositorio no despliega en producción"
P49_incident_log_dir: docs/incidents
P50_secrets_manager: GitHub Actions repository secrets
