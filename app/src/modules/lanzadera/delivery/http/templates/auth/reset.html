{% extends "base.html" %}
{% block heading %}Recuperar contraseña{% endblock %}
{% block content %}
  <section class="mds-card">
    {% if request.query_params.get('reset') %}
      <p class="mds-tag mds-tag--active">Si la cuenta existe, recibirás un correo con instrucciones.</p>
    {% endif %}
    <form method="post" action="/reset" x-data="{ submitting: false }" @submit="submitting = true">
      <input class="mds-textfield" type="email" name="email" placeholder="email" required />
      <button class="mds-button" type="submit" x-bind:disabled="submitting">Enviar</button>
    </form>
  </section>
{% endblock %}
