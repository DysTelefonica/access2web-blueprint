{% extends "base.html" %}
{% block heading %}Aplicaciones{% endblock %}
{% block content %}
  <section class="mds-card">
    <table class="mds-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Short code</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        {% for app in apps %}
        <tr>
          <td>{{ app.id }}</td>
          <td>{{ app.name }}</td>
          <td>{{ app.short_code }}</td>
          <td>
            <span class="mds-tag {% if app.active %}mds-tag--active{% else %}mds-tag--disabled{% endif %}">
              {% if app.active %}active{% else %}disabled{% endif %}
            </span>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="4">No apps yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </section>
{% endblock %}
