# Alembic configuration for `lanzadera-mvp` (PR 3a, Phase 2).
#
# HARNESS-PROVENANCE: deterministic-quality-harness v1.4 — Alembic migrations
# are wired through `app/pyproject.toml` (`[tool.alembic].script_location`),
# not this file. The two-layer config exists because Alembic 1.13 still
# insists on parsing an `alembic.ini` to bootstrap its CLI; everything we
# would normally pin here (database URL, metadata, paths) is derived from
# the runtime environment inside `env.py` instead.
#
# The `script_location` block below mirrors the value declared in
# `app/pyproject.toml` so an Alembic invocation without a config flag still
# resolves to the right directory when `alembic.ini` lives next to
# `env.py`. Keep the two declarations in lock-step.

[alembic]
# Path to migration scripts. `%(here)s` resolves to the directory holding
# this `alembic.ini`, so the migration home is always colocated with
# `env.py` regardless of where the `alembic` CLI is invoked from.
script_location = %(here)s

# Template used to generate migration files. The default name is the
# Alembic project convention; renaming would break every `alembic revision
# --autogenerate` call.
file_template = %%(rev)s_%%(slug)s

# Time-zone for `create_date` in revision files. `utc` matches the
# timestamp convention every CI runner records, so the on-disk file
# history is reproducible across hosts.
timezone = UTC

# Maximum identifier length for autogenerated names. Postgres' hard cap is
# 63; we stay well under to leave headroom for index suffixes.
truncate_slug_length = 40

# `sqlalchemy.url` is intentionally left empty. `env.py` reads
# `DATABASE_URL` from the environment (composition root decision, DA-1) and
# injects the value here so credentials never live on disk. Setting it
# inline would force every reviewer to scrub the file before commit and
# would bypass the docker-compose binding that drives `docker compose run`.
sqlalchemy.url =


[post_write_hooks]
# Empty by default. Migrating to a `ruff format` post-write hook happens
# in PR 3b once 0002-0006 land and we know whether `0001_core_schema.py`
# survives the formatter unchanged.


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S