schema: spec-driven

context: |
  Project: access2web-blueprint, monorepo for the modern platform + blueprint of the legacy
  Microsoft Access + VBA ecosystem. As of 2026-08-08 the scope evolved from docs-only to
  monorepo: docs/ carries research, per-app documentation, decisions, quality gates doc and
  audit; app/ carries the Python 3.12+ / FastAPI 0.119+ / HTMX 2.0.4 / PostgreSQL /
  Alembic code of the MVP (Lanzadera admin module). .opencode/skills/ hosts project-owned
  skills (deterministic-quality-harness).

  Lanzadera is the source of users, applications and permissions; most applications depend on
  an expediente created in Expedientes. Architecture is verified by walkthroughs of 28 forms
  in Lanzadera and documented in docs/03-aplicaciones/<app>/.

  Persistence: hybrid (OpenSpec files plus Engram).
  Artifact language: English by default; capability documentation is Spanish (Spain).
  Quality gates and CI live in docs/calidad-de-codigo-y-ci.md; the Clean Code / swarm-forge
  audit lives in docs/auditoria-harnesses-clean-code.md.

strict_tdd: true

testing:
  status: configured
  runner: pytest
  command: pytest --cov=app --cov-fail-under=85 -p app.pytest_plugin.coverage_gate
  layers:
    unit: pytest (tests/)
    integration: pytest -m integration (gated on APAP_INTEGRATION_ENABLED, postgres real)
    e2e: pending UI
  coverage: "85% global, 100% CRITICAL_HELPERS"
  linter: ruff==0.15.21 (select=E,F,W,I,UP,B)
  type_checker: mypy==1.13.0 (app/src/ only, ignore-without-code enforced)
  formatter: ruff format

rules:
  proposal:
    - Include rollback considerations for risky changes.
    - Do not design or implement migration work during initialization.
    - Reference decisions D1-D82, QC-1 to QC-9, and the quality gates doc.
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords where applicable.
    - Separate verified facts from hypotheses and mark evidence confidence.
  design:
    - Document architectural decisions with rationale and explicit alternatives.
    - Reference docs/09-arquitectura-objetivo-y-principios.md for cross-cutting decisions.
  tasks:
    - Group tasks by phase and keep each task completable in one session.
    - PR size budget: 400 lines (QC-6, see docs/calidad-de-codigo-y-ci.md).
  apply:
    tdd: true
    test_command: pytest --cov=app --cov-fail-under=85
  verify:
    test_command: pytest --cov=app --cov-fail-under=85
    build_command: python -m build
    coverage_threshold: 85
  archive:
    - Warn before merging destructive deltas.