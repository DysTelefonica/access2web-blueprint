name: pr-contract

# Gate de contrato de PR (HR-6/7/14/31/53/54/64, HR-3) del canon de
# DysTelefonica/team-skills (#806, K6).
#
# Reusable PURO (auditoría de runners, cambio 6 — DysTelefonica/cadete#636):
# ya no se dispara por `pull_request`; su único publicador es
# `pr-metadata.yml`, que escucha los seis eventos de HR-31 (`opened`, `edited`,
# `labeled`, `unlabeled`, `synchronize`, `reopened`) y publica el check
# `pr-contract / pr-contract`. Antes el check se publicaba desde tres sitios
# (este trigger, `pr-metadata.yml` y la llamada de `ci.yml`): 343 runs para
# 135 SHA en la ventana de la auditoría, ~400 runs/semana de sobra.
#
# El catálogo del patrón se clona por el pin
# `bc915526af7920e459afd2532e93e96e0479c0e6`; sin credencial el gate no puede
# medir y falla cerrado (HR-3).
on:
  workflow_call:
    secrets:
      TEAM_SKILLS_READ_TOKEN:
        required: true

# Grupo por run, no por PR: un grupo por PR hace que GitHub sustituya el run
# pendiente cuando llega otro evento (aunque cancel-in-progress sea false), y
# el job se cancelaba con 0 s. Con un grupo por run ningún run sustituye a
# otro: cada evento se evalúa y publica. El check `pr-contract / pr-contract`
# lo publica el run que termina después; en la UI de GitHub el más reciente
# manda para el merge gobernado. Mismo patrón que `pr-size.yml`.
concurrency:
  group: cadete-pr-contract-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-contract:
    name: pr-contract
    runs-on: [self-hosted, Linux, cadete]
    timeout-minutes: 5
    steps:
      # fetch-depth 0: el gate necesita `base.sha` y `head.sha` reales para
      # `git diff` y `git log`; con un clon superficial no alcanza.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Primer paso EJECUTABLE del job: el contrato de tooling se prueba en el
      # runner que ejecuta este job (G0.5 del canon), no en el runner histórico.
      - name: Preflight del contrato de tooling del job
        run: |
          sh .agents/skills/ci-pattern/assets/tooling-preflight/tooling-preflight.sh \
            --binaries .github/tooling/pr-contract.txt \
            --runner "${{ runner.name }}"

      - name: Check out the pattern at the pin
        uses: ./.github/actions/pattern-at-pin
        with:
          pin: bc915526af7920e459afd2532e93e96e0479c0e6
          token: ${{ secrets.TEAM_SKILLS_READ_TOKEN }}

      # Precomputa los artefactos del rango que la CLI del catálogo exige:
      # `--changed-files`, `--numstat-file`, `--commits-file`,
      # `--tracked-files`. Las SHAs entran por `env:` (HR-19), nunca
      # interpoladas dentro del script.
      - name: Compute diff artifacts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE_SHA}..${HEAD_SHA}" > .ci-pr-changed
          git diff --numstat  "${BASE_SHA}..${HEAD_SHA}" > .ci-pr-numstat
          git log --format='%P%n%B%n---COMMIT-END---' "${BASE_SHA}..${HEAD_SHA}" > .ci-pr-commits
          git ls-files > .ci-pr-tracked

      - name: PR contract gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -I "$PATTERN_DIR/assets/pr-contract/check_pr_contract.py" \
            --event-file     "$GITHUB_EVENT_PATH" \
            --policy-file    .github/pr-contract.policy.json \
            --repo           . \
            --changed-files  .ci-pr-changed \
            --numstat-file   .ci-pr-numstat \
            --commits-file   .ci-pr-commits \
            --tracked-files  .ci-pr-tracked
