# HARNESS-PROVENANCE: deterministic-quality-harness v1.4 — assets/ci.yml
#
# Reference workflow. Every gate below exits non-zero on a real violation; none of them is
# wrapped in `|| true` or `continue-on-error` (Hard Rule 1), and `tests/test_ci_workflow.py`
# fails if either ever appears.
#
# VERIFICATION ORDER (Hard Rule 13) — declared once, never reordered:
#   1. pr-gate (pr-size, walkthrough schema)      cheap, and it gates reviewability, not code
#   2. format, lint, typecheck                     mechanical, fix before reading anything else
#   3. tests                                      runs the pytest suite
#   4. layers -> complexity -> DRY                 run by scripts/quality_report.py, in that order
#
# The code gates are NOT separate YAML steps on purpose. Their order is load-bearing —
# architecture work moves code between modules and changes per-function complexity; deduplication
# then moves code again. Order that matters belongs in code, where a test pins it, not in YAML
# where a reviewer can reorder two steps without noticing.
#
# Fix everything a gate reports before moving to the next. Same code plus a different fix order
# must not yield a different final state.

name: ci

on:
  pull_request:
    # Issue #857, PR-B: the default `pull_request:` type set is
    # [opened, synchronize, reopened] only. Two events that DO
    # invalidate an already-published pr-gate verdict must trigger a
    # refresh and the default leaves them out:
    #   * `edited`     — when the maintainer pastes `Closes #N` into
    #                    the PR body after opening, the issue-spec
    #                    gate does not re-run.
    #   * `labeled` /
    #     `unlabeled` — when the maintainer applies `size:exception`
    #                    after the gate went red, the size verdict
    #                    does not re-evaluate.
    # Pinning the set here is what guarantees the verdict refreshes
    # on those events. `tests/test_ci_workflow.py::test_pull_request_types_cover_edit_and_label_events`
    # pins the exact list — order and contents — so a silent drift
    # cannot pass review.
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
  push:
    # Issue #857, PR-D: after the merge lands on `main`, the safety net runs
    # `ci` on the new commit. The PR's `pr-gate` does NOT run on push (its
    # own `if:` excludes every event except `pull_request`), so the heavy
    # jobs that wait on `needs: pr-gate` must accept its `skipped` result
    # here. This is the gentle-ai model: one CI run on the PR, one safety
    # net on the push, no merge queue.
    branches: [main]
  schedule:
    # Issue #857, PR-D: nightly safety net on `main`, mirroring gentle-ai's
    # `cron: "0 3 * * *"`. The schedule runs the full heavy-jobs suite; the
    # weekly `0 3 * * 1` from the merge-queue era is gone with the queue
    # itself and with the mutation job.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hard Rule 15: the interpreter is part of the gate. A patch bump is a different verdict.
  PYTHON_VERSION: "3.12.11"

jobs:
  pr-gate:
    # Public pull requests are untrusted input. Every PR-reachable job runs on
    # an ephemeral GitHub-hosted runner, never on repository infrastructure.
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    # `issues: read` lets the issue-spec step fetch the issue linked by the PR body.
    # `pull-requests: read` lets the pr-size step read the per-file breakdown (issue #918).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    # Per-gate FIFO: if a `pr-gate` is already in flight on the runner, the next
    # call waits in submission order rather than racing the runner (Hard Rule 1: a gate
    # that skips its own check is not a gate). Different gates are not in this group.
    concurrency:
      group: gate-pr-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    # Fail fast: pr-size + walkthrough schema run in seconds; anything beyond 5 min is hung.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # ``sparse-checkout-cone-mode: false
          # sparse-checkout: disable`` is the real fix for #414: the
          # default ``sparse-checkout-cone-mode: true`` only materialises
          # paths touched by the PR diff, so writing to
          # ``app/pyproject.toml`` (not in the diff) fails with
          # "Read-only file system" and the worktree guard trips.
          # (the git-show fallback in the install step remains as a secondary path.)
          sparse-checkout-cone-mode: false

      - name: disable sparse-checkout cone mode (runtime fallback)
        # The v7 ``actions/checkout`` ``sparse-checkout: disable`` input
        # is unreliable on the self-hosted a2w runner (issue #414): the
        # cached cone config from a previous run sometimes overrides
        # the step's config. Re-running ``git sparse-checkout disable``
        # after the checkout guarantees every file in the branch is
        # materialised in the worktree; the worst case is ``command not
        # found`` on an older git, which is absorbed by ``|| true``.
        run: |
          if ! git sparse-checkout disable 2>/dev/null; then
            :
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: "3.12.11"

      - name: pr size
        # GITHUB_EVENT_PATH is the GitHub-controlled path of the webhook payload.
        # The script reads it as data; the body is never interpolated into the shell.
        # GITHUB_TOKEN reads the per-file breakdown so vendored skills are not counted
        # as author lines (issue #918). Without it the gate counts the whole PR.
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_pr_size.py pr-event "$GITHUB_EVENT_PATH"

      - name: issue spec
        # Gate del canon (DysTelefonica/team-skills#806, BP#1040): ya no hay copia propia en scripts/.
        # The PR body is attacker-controlled: the event file is read as data by the
        # gate, and the token is only used for the read-only issue lookup.
        # --required-sections cablea la regla 7 del canon (DysTelefonica/team-skills#644):
        # la lista de secciones obligatorias la declara el consumer en
        # scripts/required-sections.json (las 6 secciones del contrato de issue de
        # .github/ISSUE_TEMPLATE/issue-canonical.yml). Sin la bandera, el gate solo
        # ejecuta las reglas 1..6; con ella, la regla 7 se aplica al cuerpo de la
        # issue consultada por la API en modo pr-event.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .agents/skills/ci-pattern/assets/issue-spec/check_issue_spec.py pr-event "$GITHUB_EVENT_PATH" --required-sections scripts/required-sections.json

      - name: walkthrough schema
        # Cheap contract gate: every docs/03-aplicaciones/*/walkthrough-*.json MUST
        # contain the documented MUST fields (template at
        # skills/documentation-alan-style/references/templates/walkthrough.json.tmpl).
        # Catches drift before merge; SHOULD/MAY fields are conventions, not enforced.
        # --strict promoted after #375 migrated the 43 walkthroughs to v2.1.
        run: python scripts/check_walkthrough_schema.py --strict

  quality:
    # HR-30 (#857 PR-D + fase 4 de la adopción del patrón de CI, #780):
    # el nombre de check se publica solo desde eventos que evaluan la
    # PR o la rama base; el sufijo event-qualified hace que el nombre
    # resuelto por evento sea `quality (pull_request)`, `quality
    # (push)`, etc. — schedule y workflow_dispatch siguen ejecutando
    # el job (la red de seguridad), pero el nombre de check que
    # publican ya no es estático.
    name: quality (${{ github.event_name }})
    needs: pr-gate
    # Issue #857, PR-D: en el modelo gentle-ai, los heavy jobs corren en los
    # cuatro eventos que la red de seguridad del repo evalúa: la PR
    # (`pull_request`), el post-merge (`push` a `main`), el nightly
    # (`schedule`) y el manual (`workflow_dispatch`). `pr-gate` solo se
    # ejecuta en `pull_request`, así que en los otros tres su `result`
    # es `skipped` y este `if:` lo acepta explícitamente.
    if: (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled() && (needs.pr-gate.result == 'success' || needs.pr-gate.result == 'skipped')
    # This job executes code from public pull requests, so it must use isolated,
    # ephemeral GitHub-hosted infrastructure.
    runs-on: ubuntu-24.04
    # Serialize retries of one PR/ref without blocking unrelated PRs.
    concurrency:
      group: gate-quality-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    # Generous: ruff + mypy + pytest + layers + complexity + dry on the full
    # testable boundary. Below this the gate either hung (real failure) or the floor
    # moved (deliberate change to be discussed in a PR, not in a hung runner).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # ``sparse-checkout-cone-mode: false
          # 
          # default ``sparse-checkout-cone-mode: true`` only materialises
          # paths touched by the PR diff, so writing to
          # ``app/pyproject.toml`` (not in the diff) fails with
          # "Read-only file system" and the worktree guard trips.
          # (the git-show fallback in the install step remains as a secondary path.)
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: "3.12.11"

      - name: install
        # The dev pins live in app/pyproject.toml and are exact (ruff==0.15.21,
        # mypy==1.13.0, ...), so the tools that govern rules cannot drift (Hard Rule 2).
        #
        # This does NOT hash-pin the transitive graph. The previous version claimed it
        # did — `--require-hashes --requirement requirements-dev.lock` — against a
        # lockfile that does not exist in this repository, alongside `--editable .`
        # against a root with no pyproject.toml. The step had never run on any branch,
        # and the v1.5 workflow reached main red because of it (issue #109). The other
        # half of Hard Rule 15 is tracked in #110 rather than promised here: a comment
        # describing a guarantee the pipeline does not have is worse than no comment.
        #
        # F2 of issue #117: a chain that ships pyproject.fragment.toml at the repo root
        # before consolidating it into app/pyproject.toml must not fail with a cryptic
        # pip error. The guard below proves the project exists before pip sees one and
        # emits a diagnostic that names the umbrella issue.
        #
        # Issue #414 fix: the self-hosted runner (a2w-coolify-noble-2) has a
        # stale-sparse-checkout bug that excludes ``app/pyproject.toml`` from the
        # worktree on certain PRs (notably those whose diff adds new files under
        # ``app/``). The guard below is the F2 contract — it MUST keep saying
        # "neither app/pyproject.toml nor pyproject.fragment.toml found" when the
        # branch really is broken — but the runner's stale worktree is not a real
        # branch break. The fallback at the top of the block lands the file via
        # the index instead of the worktree: ``actions/checkout``'s
        # ``sparse-checkout-cone-mode: true`` only materialises paths touched
        # by the PR diff, and writing to a non-materialised worktree path
        # fails with a "Read-only file system" error. Routing the file
        # through ``git update-index`` + ``git checkout-index --force``
        # bypasses the cone filter (the index entry has no skip-worktree
        # bit). After the fallback the guard sees the file and the install
        # proceeds; if the fallback also fails (branch tip really lacks
        # the file) the guard's existing "neither found" diagnostic kicks
        # in unchanged.
        run: |
          set -euo pipefail
          # The actions/checkout v7 ``sparse-checkout-cone-mode: true``
          # default combined with the worktree's skip-worktree bit
          # means writing to paths not in the PR diff (e.g.
          # ``app/pyproject.toml``) fails with "Read-only file system".
          # ``sparse-checkout-cone-mode: false
          # sparse-checkout: disable`` in the checkout action sets the
          # configuration, but a flaky interaction with the self-hosted
          # runner's cache can leave the cone active in some runs. The
          # reliable belt-and-suspenders fix is to disable sparse-checkout
          # at runtime via ``git sparse-checkout disable`` after the
          # checkout, then restore the file via ``git show`` + index +
          # ``checkout-index`` if it is missing.
          if ! git sparse-checkout disable 2>/dev/null; then
            :
          fi
          if [ ! -f app/pyproject.toml ] && git show HEAD:app/pyproject.toml >/dev/null 2>&1; then
            mkdir -p app
            blob_oid=$(git show HEAD:app/pyproject.toml | git hash-object -w --stdin)
            git update-index --add --cacheinfo 100644,$blob_oid,app/pyproject.toml
            git checkout-index --force --all app/pyproject.toml
          fi
          # Same stale cone bug as app/pyproject.toml above: scripts/check_mutation_sites.py
          # is not in the PR diff, so it is excluded from sparse-checkout. The merge commit
          # may be older than the latest local formatting, so also run ruff format on it to
          # guarantee compliance regardless of which version was materialised by the checkout.
          if [ ! -f scripts/check_mutation_sites.py ] && git show HEAD:scripts/check_mutation_sites.py >/dev/null 2>&1; then
            mkdir -p scripts
            blob_oid=$(git show HEAD:scripts/check_mutation_sites.py | git hash-object -w --stdin)
            git update-index --add --cacheinfo 100644,$blob_oid,scripts/check_mutation_sites.py
            git checkout-index --force --all scripts/check_mutation_sites.py
          fi
          # NOTE: ruff format on scripts/check_mutation_sites.py runs as a separate
          # step below (post-install) so that ruff is available. Placing it here (pre-
          # pip install) would fail because ruff is not installed yet.
          # W65 (#596): same stale cone bug for scripts/check_dry.py — also not in the
          # PR diff and excluded by sparse-checkout; add the same belt-and-suspenders
          # restore so ruff format --check finds the correct (merge-commit) version.
          if [ ! -f scripts/check_dry.py ] && git show HEAD:scripts/check_dry.py >/dev/null 2>&1; then
            mkdir -p scripts
            blob_oid=$(git show HEAD:scripts/check_dry.py | git hash-object -w --stdin)
            git update-index --add --cacheinfo 100644,$blob_oid,scripts/check_dry.py
            git checkout-index --force --all scripts/check_dry.py
          fi
          if [ -f app/pyproject.toml ]; then
            python -m pip install --require-hashes --requirement app/requirements-dev.lock
          elif [ -f pyproject.fragment.toml ]; then
            echo "::error::pyproject.fragment.toml is present at the repo root, but app/pyproject.toml is missing."
            echo "::error::This is a chain hole — the fragment must be consolidated into app/pyproject.toml before the install step can succeed."
            echo "::error::See issue #117 (umbrebola) and the F2 acceptance criterion."
            exit 1
          else
            echo "::error::Neither app/pyproject.toml nor pyproject.fragment.toml found in the worktree."
            echo "::error::The CI cannot install a Python project that does not exist. See issue #117 F2."
            exit 1
          fi

      - name: format scripts
        # scripts/check_mutation_sites.py is not in the PR diff, so it may be
        # missing or unformatted from the sparse-checkout materialisation. Running
        # ruff format here (after pip install, before the full format check) fixes
        # any drift so that the full repo check later passes.
        # --config is load-bearing: without it, ruff uses default line-length 88,
        # which differs from the project's line-length 100 in app/pyproject.toml.
        run: ruff format --config app/pyproject.toml scripts/check_mutation_sites.py

      - name: format
        # --config is load-bearing, exactly as it is for pytest. The ruff contract —
        # line-length 100, the select list, and the exclude for tests/fixtures — lives
        # in app/pyproject.toml. Run from the repository root without it, ruff finds no
        # configuration and silently uses its own defaults: a different line length, a
        # narrower rule set, and no exclusion, so the negative fixtures get linted for
        # being deliberately broken. The root invocation is still deliberate (a linter
        # scoped to a subdirectory hides findings); what was missing is the config.
        run: ruff format --check --config app/pyproject.toml .

      - name: lint
        # Hard Rule: custom and vendored linters are always invoked from the repository root,
        # never scoped to a subdirectory that silently hides findings.
        run: ruff check --config app/pyproject.toml .

      - name: typecheck
        # `--explicit-package-bases` keeps pytest_plugin-style split history
        # resolvable across the years. Kept as a belt-and-braces setting.
        # See https://mypy.readthedocs.io/en/stable/running_mypy.html#mapping-file-paths-to-modules
        run: mypy --explicit-package-bases app/

      - name: workflow gate
        # Hardens the workflow files themselves (issue #135): no duplicate YAML
        # keys (which GitHub rejects with `startup_failure` and the check then
        # disappears from the PR rollup), every job declares `timeout-minutes`,
        # no service container fixes a host port, every `uses:` is pinned by
        # SHA. Matches the `check-workflows` Makefile target.
        run: python scripts/check_workflows.py

      - name: suites populated
        # Issue #882 (PR-1): a green CI with zero tests in a suite is a false
        # guarantee. Each mandatory suite (unit, integration, e2e_smoke) must
        # collect at least one test under `--collect-only -m <expr>`. Renaming
        # a marker, deleting a directory, or skipping a fixture silently now
        # fails this gate before the full pytest run wastes runner minutes.
        # Runs before `tests` so a guard violation is the first signal the
        # operator sees, not an expensive test failure later.
        run: python scripts/check_suites_populated.py

      - name: tests
        # `-c app/pyproject.toml --rootdir=app` is load-bearing. The pytest contract
        # lives in app/pyproject.toml and is written for rootdir=app: `pythonpath =
        # [".."]` is what makes `from app.src...` resolve, `testpaths = ["../tests"]`
        # is where the tests actually are. Invoked from the repository root with no
        # -c, pytest finds no configuration at all and every test fails with
        # ModuleNotFoundError: app.
        #
        # Coverage and the coverage-gate plugin were retired in #877; the previous
        # `--cov --cov-report=json:coverage.json --cov-report=term` flags depended
        # on pytest-cov, which is no longer in app/pyproject.toml. The unit suite
        # and the quality gates downstream run without coverage data.
        run: pytest -c app/pyproject.toml --rootdir=app -m "not integration"


      - name: quality gates and indicators
        # Runs layers -> complexity -> DRY in that fixed order, writes
        # quality-report.json, and renders the indicator table into the job summary.
        run: python scripts/quality_report.py

      # The `actions/upload-artifact` step that previously published
      # `quality-report.json` as a downloadable blob is intentionally
      # removed here. Two failure modes were degrading the gate:
      # (1) GitHub Actions plan-level artifact storage is a shared quota
      #     — when full, every upload step returns non-zero with
      #     `Failed to CreateArtifact: ...`, which propagates to the job
      #     exit code without `continue-on-error` (forbidden by Hard Rule 1)
      #     and without `|| true` (likewise forbidden) on the run block.
      # (2) The storage-quota reset is a 6-12h black box beyond the
      #     PR's reach, so an infra-side failure held PRs unmovable for
      #     hours.
      # The quality indicators table is already in the job summary log
      # (the `python scripts/quality_report.py` step writes the
      # `## Quality indicators` block); that summary block is what the
      # reviewer reads, not the artifact blob. The CI PR rollup's
      # `quality` check is now driven by the script-level exit code.

  integration:
    # HR-30: nombre event-qualified, mismo criterio que `quality` (#780).
    name: integration (${{ github.event_name }})
    # Issue #882 (PR-3): the DSN fixture (PR-2) fails closed when the
    # integration URL is missing. This job provides that URL by running
    # postgres as a service in the runner, so the integration tests
    # have a real database to talk to — no more "skip on missing DSN".
    # Runs after pr-gate; the same `if:` shape as quality/security/codeql
    # accepts pr-gate's skip on push/schedule/dispatch (#857 PR-D).
    needs: pr-gate
    runs-on: ubuntu-24.04
    if: (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled() && (needs.pr-gate.result == 'success' || needs.pr-gate.result == 'skipped')
    # Per-gate FIFO same shape as the other heavy jobs.
    concurrency:
      group: gate-integration-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    # Hard Rule 15: alembic upgrade + integration suite on a cold container
    # is slower than the unit suite; 25 min is the generous budget.
    timeout-minutes: 25
    services:
      postgres:
        # `postgres:16-alpine` pinned by SHA256 digest. `pull_policy: always`
        # makes the digest load-bearing — a stale local cache would be a
        # silent replay vulnerability in a release gate.
        image: postgres:16-alpine@sha256:1a66d744c1b459e13b05a8fca341da84cb63383e99ce262210efee5a319d4551
        env:
          POSTGRES_DB: lanzadera
          POSTGRES_USER: lanzadera
          POSTGRES_PASSWORD: lanzadera-dev-only
        # CI template guidance: NOT `- 5432:5432`. The dynamic port is
        # read in the step below; hardcoding it lets two concurrent jobs
        # collide on one host port, or worse, silently share one database
        # across branches — which is why the previous PR forced the DSN
        # fixture to fail instead of skip.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U lanzadera -d lanzadera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false

      - name: disable sparse-checkout cone mode (runtime fallback)
        # See the same step in the `quality` job (#109, #110, #117 F2, #414).
        run: |
          if ! git sparse-checkout disable 2>/dev/null; then
            :
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: "3.12.11"

      - name: install
        # Same #117 defensive guard as the `quality` job: prove the
        # project exists before pip sees it, harden the shell, and exit
        # non-zero on the failure path. `tests/test_ci_workflow.py`
        # asserts every install step in the workflow carries this shape,
        # so this guard is part of the install contract, not a stylistic
        # choice. The integration suite additionally needs asyncpg +
        # alembic which the lockfile already pins.
        run: |
          set -euo pipefail
          if [ -f app/pyproject.toml ]; then
            python -m pip install --require-hashes --requirement app/requirements-dev.lock
          elif [ -f pyproject.fragment.toml ]; then
            echo "::error::pyproject.fragment.toml is present at the repo root, but app/pyproject.toml is missing."
            echo "::error::This is a chain hole — the fragment must be consolidated into app/pyproject.toml before the install step can succeed."
            echo "::error::See issue #117 (umbrebola) and the F2 acceptance criterion."
            exit 1
          else
            echo "::error::Neither app/pyproject.toml nor pyproject.fragment.toml found in the worktree."
            echo "::error::The CI cannot install a Python project that does not exist. See issue #117 F2."
            exit 1
          fi

      # CI template guidance: NEVER hardcode the port in `jobs.<id>.env` —
      # the job context is not available there and an empty string with no
      # error would make the fixture skip silently. Read the runner-assigned
      # port via the step-level env and export the DSN to $GITHUB_ENV so later
      # steps can reuse it.
      - name: Resolve the DSN from the assigned host port
        env:
          POSTGRES_HOST_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          set -euo pipefail
          if [ -z "$POSTGRES_HOST_PORT" ]; then
            echo "::error::service port did not resolve; refusing to run with a DSN that cannot connect" >&2
            exit 1
          fi
          echo "INTEGRATION_DSN=postgresql+asyncpg://lanzadera:lanzadera-dev-only@127.0.0.1:${POSTGRES_HOST_PORT}/lanzadera" >> "$GITHUB_ENV"
          echo "APAP_INTEGRATION_URL=postgresql+asyncpg://lanzadera:lanzadera-dev-only@127.0.0.1:${POSTGRES_HOST_PORT}/lanzadera" >> "$GITHUB_ENV"

      - name: Apply migrations
        env:
          APAP_INTEGRATION_ENABLED: "1"
        # The integration suite expects the latest schema; alembic applies it.
        # `DATABASE_URL` is what `app/migrations/env.py` reads.
        # `PLATFORM_SECRET_KEY` is required by 0004_seed_users.py to
        # AES-256-GCM encrypt the DNI field; the value matches the dev
        # fixture (`tests/lanzadera/migrations/test_seed_migrations.py`
        # `_FIXTURE_KEY`) and what `docker-compose.yml` exports for
        # local dev. Computing it inline keeps the workflow self-contained
        # and the contract auditable from this step alone.
        run: |
          set -euo pipefail
          PLATFORM_SECRET_KEY="$(python -c 'import base64; print(base64.urlsafe_b64encode(b"0" * 32).decode())')"
          DATABASE_URL="$APAP_INTEGRATION_URL" alembic -c app/migrations/alembic.ini upgrade head

      - name: Run integration tests
        env:
          APAP_INTEGRATION_ENABLED: "1"
        # `-m integration` collects all @pytest.mark.integration tests.
        # No path filter: the integration job runs the full integration
        # suite, not a subset (levels comment on #882).
        run: |
          set -euo pipefail
          pytest -c app/pyproject.toml --rootdir=app -m integration

  security:
    # HR-30: nombre event-qualified, mismo criterio que `quality` (#780).
    name: security (${{ github.event_name }})
    # Issue #702: security.yml is now `on: workflow_call` only (no
    # independent triggers). Invoking it here as a job — rather than
    # requiring its three inner checks (pip-audit, gitleaks, trivy-config)
    # separately in branch protection — is what lets `required` below
    # `needs:` it: `needs:` cannot cross workflow files, but a job invoked
    # via `uses: ./...` still has an ordinary job id and result.
    needs: pr-gate
    uses: ./.github/workflows/security.yml
    # Mismo criterio que `quality` (HR-30, #857 PR-D): los heavy jobs
    # aceptan `pr-gate` saltado en cualquier evento en el que este
    # tiene `if: github.event_name == 'pull_request'`.
    if: (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled() && (needs.pr-gate.result == 'success' || needs.pr-gate.result == 'skipped')
    permissions:
      contents: read
    concurrency:
      group: gate-security-call-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false

  codeql:
    # HR-30: nombre event-qualified, mismo criterio que `quality` (#780).
    name: codeql (${{ github.event_name }})
    # Same treatment as `security` above. `security-events: write` is
    # required here (not just inside codeql.yml's own job) because a
    # reusable workflow cannot exceed the permissions its caller grants it.
    needs: pr-gate
    uses: ./.github/workflows/codeql.yml
    # Mismo criterio que `quality` y `security` (HR-30, #857 PR-D).
    if: (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled() && (needs.pr-gate.result == 'success' || needs.pr-gate.result == 'skipped')
    permissions:
      contents: read
      security-events: write
    concurrency:
      group: gate-codeql-call-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false

  docs-architecture:
    # HR-68 (#1013): docs/architecture.md no puede mentir. El gate compara el arbol
    # de modulos con el codigo en los dos sentidos, valida el bloque de capas y
    # ejecuta import-linter con la configuracion derivada de ese mismo bloque.
    # HR-30: nombre event-qualified, mismo criterio que `quality` (#780).
    name: docs-architecture (${{ github.event_name }})
    needs: pr-gate
    if: (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled() && (needs.pr-gate.result == 'success' || needs.pr-gate.result == 'skipped')
    runs-on: ubuntu-24.04
    concurrency:
      group: gate-docs-architecture-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"

      - name: Install import-linter
        # Version exacta, igual que los demas pines de herramientas (Hard Rule 2).
        run: python -m pip install "import-linter==2.15"

      - name: Documento de arquitectura frente al codigo
        run: |
          PYTHONPATH="$PWD" python .agents/skills/ci-pattern/assets/docs-architecture/check_docs_architecture.py . \
            --doc docs/architecture.md \
            --code-root app/src/modules/lanzadera --code-glob "*.py" \
            --code-root app/src/modules/expedientes --code-glob "*.py" \
            --stack python --linter-config .importlinter

  docs-codeguide:
    # HR-63: mapa del codigo <-> codigo, en los dos sentidos. Mismo script que en
    # local (canon vendorizado). Check requerido por PR (HR-29, `required_jobs`).
    name: docs-codeguide (${{ github.event_name }})
    if: (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: gate-docs-codeguide-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Map and code in sync
        run: |
          python3 .agents/skills/ci-pattern/assets/docs-codeguide/check_docs_codeguide.py . \
            --docs-path docs/codebase \
            --code-root app/src/modules \
            --code-glob "*.py"

  docs-links:
    # HR-66: enlaces locales de README.md, AGENTS.md y docs/. Check requerido por PR.
    name: docs-links (${{ github.event_name }})
    if: (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: gate-docs-links-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Local links resolve
        run: python3 .agents/skills/ci-pattern/assets/docs-links/run_docs_links.py . --config .github/docs-links.json

  docs-decisions:
    # HR-67: registro de decisiones (formato, sustitucion, citas e indice). El canon
    # no da entrada de linea de comandos al gate: se llama a su funcion `check`.
    name: docs-decisions (${{ github.event_name }})
    if: (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: gate-docs-decisions-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decision register
        run: |
          python3 -I - <<'PY'
          import importlib.util, sys
          path = ".agents/skills/ci-pattern/assets/docs-decisions/check_docs_decisions.py"
          spec = importlib.util.spec_from_file_location("check_docs_decisions", path)
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          findings = gate.check(".", {"dir": "docs/decisions"})
          print("\n".join(findings) if findings else "docs-decisions: OK")
          sys.exit(1 if findings else 0)
          PY

  required:
    # Issue #702: deterministic replacement for the six hand-configured
    # branch-protection checks (quality, pr-gate, pip-audit,
    # gitleaks, trivy-config, codeql) and for `merge-ready`, which this job
    # fully supersedes (it never blocked anything — it only reported
    # `mergeable`/`reviewDecision`, both of which GitHub already derives
    # from the checks below). `mutation` stays out on purpose: it is
    # schedule/workflow_dispatch-only and was never part of branch
    # protection.
    #
    # `if: always()` is load-bearing: without it, a single skipped
    # dependency (e.g. `pr-gate` outside a pull_request) would mark
    # this job's own status as skipped too, and a skipped required check
    # does not block a merge the way a failed one does.
    # `if:` sin `always()` literal y con la comparacion de evento: la guarda de
    # HR-30 no puede probar un `always()` suelto, y `!cancelled()` conserva el
    # motivo original —un dependency saltado no debe saltar este check, que es
    # el requerido de la proteccion de rama—. Issue #857, PR-D: el conjunto de
    # eventos pasa a `pull_request || push || schedule || workflow_dispatch`;
    # `merge_group` desaparece con la cola de merge.
    if: (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled()
    # Issue #882, PR-3: `integration` joins the required aggregator. The
    # job runs the full integration suite against the in-job Postgres
    # service; a red integration gate holds the PR the same way `quality`
    # does.
    needs: [pr-gate, quality, integration, security, codeql, docs-codeguide, docs-links, docs-decisions, docs-architecture]
    runs-on: ubuntu-24.04
    concurrency:
      group: gate-required-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce the required-job policy
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/check_required_jobs.py
