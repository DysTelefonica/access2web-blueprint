# HARNESS-PROVENANCE: deterministic-quality-harness v1.4 — assets/ci.yml
#
# Reference workflow. Every gate below exits non-zero on a real violation; none of them is
# wrapped in `|| true` or `continue-on-error` (Hard Rule 1), and `tests/test_ci_workflow.py`
# fails if either ever appears.
#
# VERIFICATION ORDER (Hard Rule 13) — declared once, never reordered:
#   1. review-budget gates (pr-size, branch-name)  cheap, and they gate reviewability, not code
#   2. format, lint, typecheck                     mechanical, fix before reading anything else
#   3. tests + coverage                            produces coverage.json, which CRAP consumes
#   4. layers -> complexity -> CRAP -> DRY         run by scripts/quality_report.py, in that order
#
# The four code gates are NOT separate YAML steps on purpose. Their order is load-bearing —
# architecture work moves code between modules and changes per-function complexity; CRAP prices
# that complexity against coverage; deduplication then moves code again. Upstream `swarm-forge`
# fixes CRAP before DRY for exactly this reason. Order that matters belongs in code, where a test
# pins it, not in YAML where a reviewer can reorder two steps without noticing.
#
# Fix everything a gate reports before moving to the next. Same code plus a different fix order
# must not yield a different final state.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly mutation run. Mutation is the only mechanical answer to "do these tests assert
    # anything", and it is far too slow for every PR — so it runs on a cadence and ratchets.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hard Rule 15: the interpreter is part of the gate. A patch bump is a different verdict.
  PYTHON_VERSION: "3.12.11"

jobs:
  review-budget:
    # Cheap gate (PR-size + branch-name, both <1s) — runs on GitHub-hosted so it does
    # not contend with quality/security for the single self-hosted runner. Routing
    # these reads off the VPS is what stops a stuck quality job from also stalling
    # reviewability feedback (umbrella #117).
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    # Per-gate FIFO: if a `review-budget` is already in flight on the runner, the next
    # call waits in submission order rather than racing the runner (Hard Rule 1: a gate
    # that skips its own check is not a gate). Different gates are not in this group.
    concurrency:
      group: gate-review-budget
      cancel-in-progress: false
    # Fail fast: branch-name + pr-size run in seconds; anything beyond 5 min is hung.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: branch name
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: python scripts/check_branch_name.py

      - name: pr size
        # PR_BODY is attacker-controlled text. It is passed through the environment, never
        # interpolated into the shell, so a crafted title or body cannot inject a command.
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/check_pr_size.py

  quality:
    # Heavy gate (ruff + mypy + pytest + 4 quality gates over the app/) — stays on
    # the self-hosted VPS because the rest is just not worth re-pinning to a hosted
    # image's moving target. Routing review-budget and security off the VPS is what
    # stops this job from being the only thing the runner can run.
    runs-on: [self-hosted, Linux, ARM64, oracle-vps, a2w]
    # Per-gate FIFO on the runner (umbrella #117). Different gates are not in this
    # group — review-budget and security can still progress while quality is running.
    concurrency:
      group: gate-quality
      cancel-in-progress: false
    # Generous: ruff + mypy + pytest + layers + complexity + crap + dry on the full
    # testable boundary. Below this the gate either hung (real failure) or the floor
    # moved (deliberate change to be discussed in a PR, not in a hung runner).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install
        # The dev pins live in app/pyproject.toml and are exact (ruff==0.15.21,
        # mypy==1.13.0, ...), so the tools that govern rules cannot drift (Hard Rule 2).
        #
        # This does NOT hash-pin the transitive graph. The previous version claimed it
        # did — `--require-hashes --requirement requirements-dev.lock` — against a
        # lockfile that does not exist in this repository, alongside `--editable .`
        # against a root with no pyproject.toml. The step had never run on any branch,
        # and the v1.5 workflow reached main red because of it (issue #109). The other
        # half of Hard Rule 15 is tracked in #110 rather than promised here: a comment
        # describing a guarantee the pipeline does not have is worse than no comment.
        #
        # F2 of issue #117: a chain that ships pyproject.fragment.toml at the repo root
        # before consolidating it into app/pyproject.toml must not fail with a cryptic
        # pip error. The guard below proves the project exists before pip sees one and
        # emits a diagnostic that names the umbrella issue.
        run: |
          set -euo pipefail
          if [ -f app/pyproject.toml ]; then
            python -m pip install --editable "app[dev]"
          elif [ -f pyproject.fragment.toml ]; then
            echo "::error::pyproject.fragment.toml is present at the repo root, but app/pyproject.toml is missing."
            echo "::error::This is a chain hole — the fragment must be consolidated into app/pyproject.toml before the install step can succeed."
            echo "::error::See issue #117 (umbrella) and the F2 acceptance criterion."
            exit 1
          else
            echo "::error::Neither app/pyproject.toml nor pyproject.fragment.toml found in the worktree."
            echo "::error::The CI cannot install a Python project that does not exist. See issue #117 F2."
            exit 1
          fi

      - name: format
        # --config is load-bearing, exactly as it is for pytest. The ruff contract —
        # line-length 100, the select list, and the exclude for tests/fixtures — lives
        # in app/pyproject.toml. Run from the repository root without it, ruff finds no
        # configuration and silently uses its own defaults: a different line length, a
        # narrower rule set, and no exclusion, so the negative fixtures get linted for
        # being deliberately broken. The root invocation is still deliberate (a linter
        # scoped to a subdirectory hides findings); what was missing is the config.
        run: ruff format --check --config app/pyproject.toml .

      - name: lint
        # Hard Rule: custom and vendored linters are always invoked from the repository root,
        # never scoped to a subdirectory that silently hides findings.
        run: ruff check --config app/pyproject.toml .

      - name: typecheck
        run: mypy app/

      - name: workflow gate
        # Hardens the workflow files themselves (issue #135): no duplicate YAML
        # keys (which GitHub rejects with `startup_failure` and the check then
        # disappears from the PR rollup), every job declares `timeout-minutes`,
        # no service container fixes a host port, every `uses:` is pinned by
        # SHA. Matches the `check-workflows` Makefile target.
        run: python scripts/check_workflows.py

      - name: tests
        # coverage.json is an input to the CRAP gate, not a nicety. Without it that gate fails
        # closed, which is the correct behaviour and a useless CI run — so produce it here.
        #
        # `-c app/pyproject.toml --rootdir=app` is load-bearing. The pytest contract
        # lives in app/pyproject.toml and is written for rootdir=app: `pythonpath =
        # [".."]` is what makes `from app.src...` resolve, `testpaths = ["../tests"]`
        # is where the tests actually are, and addopts loads the coverage-gate plugin
        # by its `app.` path. Invoked from the repository root with no -c, pytest finds
        # no configuration at all and every test fails with ModuleNotFoundError: app.
        #
        # cwd stays at the repository root so coverage.json lands where the downstream
        # gates look for it.
        run: pytest -c app/pyproject.toml --rootdir=app --cov --cov-report=json:coverage.json --cov-report=term


      - name: quality gates and indicators
        # Runs layers -> complexity -> CRAP -> DRY in that fixed order, writes
        # quality-report.json, and renders the indicator table into the job summary.
        run: python scripts/quality_report.py

      - name: publish indicators
        # `always()` so a failing gate still uploads the numbers that explain the failure.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-report
          path: quality-report.json
          if-no-files-found: error

  mutation:
    # Scheduled and manual only. THIS IS THE ONE JOB THE SKILL COULD NOT EXECUTE END TO END —
    # `check_mutation.py` is fully tested against synthetic sessions, but producing a real
    # session needs the mutation runner on a real codebase. Verify it once on adoption.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, ARM64, oracle-vps, a2w]
    # Per-gate FIFO even on the weekly schedule: two manual triggers in quick
    # succession serialize rather than racing cosmic-ray's sqlite (umbrella #117).
    concurrency:
      group: gate-mutation
      cancel-in-progress: false
    # cosmic-ray on the declared testable boundary is intentionally slow. The
    # timeout is loose — Hard Rule 18 says the runner's exit code is not the
    # verdict; check_mutation.py is.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install
        # See the quality job's install step (#109, #110, #117 F2).
        run: |
          set -euo pipefail
          if [ -f app/pyproject.toml ]; then
            python -m pip install --editable "app[dev]"
          elif [ -f pyproject.fragment.toml ]; then
            echo "::error::pyproject.fragment.toml is present at the repo root, but app/pyproject.toml is missing."
            echo "::error::This is a chain hole — the fragment must be consolidated into app/pyproject.toml before the install step can succeed."
            echo "::error::See issue #117 (umbrella) and the F2 acceptance criterion."
            exit 1
          else
            echo "::error::Neither app/pyproject.toml nor pyproject.fragment.toml found in the worktree."
            echo "::error::The CI cannot install a Python project that does not exist. See issue #117 F2."
            exit 1
          fi

      - name: run mutants
        # The runner's own exit code is not the verdict: it reports success for a run in which
        # nothing executed. check_mutation.py is what decides (Hard Rule 18).
        run: |
          cosmic-ray init docs/quality/cosmic-ray.toml mutation-session.sqlite
          cosmic-ray exec docs/quality/cosmic-ray.toml mutation-session.sqlite

      - name: mutation ratchet
        run: python scripts/check_mutation.py mutation-session.sqlite

      - name: publish mutation indicators
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-session
          path: mutation-session.sqlite
          if-no-files-found: error

  security:
    # Docker-based scans (gitleaks + trivy) and a python venv install — none of it
    # needs the self-hosted VPS. `ubuntu-24.04` ships docker and the project's
    # pinned Python. Routing this off the VPS is what broke the 17-minute runner
    # monopoly observed in #117.
    runs-on: ubuntu-24.04
    # Per-gate FIFO: pip-audit pulls the advisory DB and gitleaks/trivy pull scanner
    # images; if a slow docker daemon stalls one, the next wait in submission order
    # rather than piling up on the runner.
    concurrency:
      group: gate-security
      cancel-in-progress: false
    # pip-audit + gitleaks + trivy normally finish in <2 min. The observed 17-min
    # hang was the exact case this timeout is meant to catch.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: dependency scan
        # Throwaway venv: the runner's ambient site-packages drags in CVEs that are not ours,
        # which trains everyone to ignore the report.
        #
        # F2 of issue #117: the guard below proves app/pyproject.toml exists before pip
        # sees one, and fails with a diagnostic naming the chain-hole fragment instead
        # of letting pip emit a cryptic "not a Python project" error.
        run: |
          set -euo pipefail
          python -m venv .venv-audit
          # pip itself is a dependency the audit sees. The runner ships a version with
          # open advisories, so leaving it alone makes the scan fail on the scanner's
          # own toolchain rather than on this project (Hard Rule 2: an exact pin, and
          # one that is not itself the finding).
          .venv-audit/bin/python -m pip install --quiet --upgrade pip==26.2.1
          if [ -f app/pyproject.toml ]; then
            .venv-audit/bin/python -m pip install --quiet "app[dev]"
          elif [ -f pyproject.fragment.toml ]; then
            echo "::error::pyproject.fragment.toml is present at the repo root, but app/pyproject.toml is missing."
            echo "::error::This is a chain hole — the fragment must be consolidated into app/pyproject.toml before the install step can succeed."
            echo "::error::See issue #117 (umbrella) and the F2 acceptance criterion."
            exit 1
          else
            echo "::error::Neither app/pyproject.toml nor pyproject.fragment.toml found in the worktree."
            echo "::error::The CI cannot install a Python project that does not exist. See issue #117 F2."
            exit 1
          fi
          .venv-audit/bin/python -m pip install --quiet pip-audit==2.9.0

          # Liveness before reporting (Hard Rule 18). pip-audit was never installed
          # here either, and a venv without the dependency tree audits nothing while
          # looking perfectly healthy. The count is checked before the verdict is
          # trusted. Non-editable on purpose: with --strict, an editable dist that
          # --skip-editable skips is itself a hard error, so the audit venv installs
          # the project as a normal wheel and there is nothing to skip.
          installed=$(.venv-audit/bin/python -m pip list --format=freeze | wc -l)
          if [ "$installed" -lt 15 ]; then
            echo "::error::dependency scan aborted: only $installed packages in the venv."
            echo "That is not a clean audit, it is an audit with nothing to audit (Hard Rule 18)."
            exit 1
          fi
          echo "dependency scan: auditing $installed installed packages"

          .venv-audit/bin/pip-audit --strict

      - name: verify the docker daemon answers before relying on it
        # Issue #141. The other four docker jobs in this repository check the
        # daemon first; this one did not, and nothing noticed — which is the
        # point: a convention applied by hand erodes at the next job added.
        #
        # `timeout` is the load-bearing part, not `docker info`. An unwrapped
        # check hangs in exactly the scenario it exists to detect, which makes it
        # indistinguishable from no check at all.
        run: |
          set -euo pipefail
          if ! timeout 30 docker info >/dev/null 2>&1; then
            echo "::error::docker daemon is not responding on the runner."
            echo "A hung daemon turns this job into a silent 15-minute wait; fail fast instead."
            exit 1
          fi

      - name: secret scan
        # Scanner images are pinned by digest, not tag. Tags mutate; digests do not.
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir . --redact --no-banner --exit-code 1

      - name: dockerfile scan
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
          config /repo/app/Dockerfile --severity HIGH,CRITICAL --exit-code 1
