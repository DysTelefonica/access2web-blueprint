# Lanzadera MVP — CI workflow.
#
# HARNESS-PROVENANCE: deterministic-quality-harness v1.4 — applies to lanzadera-mvp Phase 0.
# Every gate below exits non-zero on a real violation; none is wrapped in `|| true` or
# `continue-on-error` (Hard Rule 1), and `tests/test_ci_workflow.py` fails if either ever
# appears.
#
# VERIFICATION ORDER (Hard Rule 13) — declared once, never reordered:
#   1. review-budget gates (pr-size, branch-name)  cheap, and they gate reviewability, not code
#   2. format, lint, typecheck                     mechanical, fix before reading anything else
#   3. tests + coverage                            produces coverage.json, which CRAP consumes
#   4. layers -> complexity -> CRAP -> DRY         run by scripts/quality_report.py, in that order
#
# The four code gates are NOT separate YAML steps on purpose. Their order is load-bearing —
# architecture work moves code between modules and changes per-function complexity; CRAP prices
# that complexity against coverage; deduplication then moves code again. Order that matters
# belongs in code, where a test pins it, not in YAML where a reviewer can reorder two steps
# without noticing.

name: ci

on:
  pull_request:
  push:
    branches: [main, feat/lanzadera-mvp-tracker]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Hard Rule 15: the interpreter is part of the gate. A patch bump is a different verdict.
  PYTHON_VERSION: "3.12.11"

jobs:
  review-budget:
    # Hard Rule 15: exact runner label. `ubuntu-latest` silently becomes a different machine.
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: branch name
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: python scripts/check_branch_name.py

      - name: pr size
        # PR_BODY is attacker-controlled text. It is passed through the environment, never
        # interpolated into the shell, so a crafted title or body cannot inject a command.
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/check_pr_size.py

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install
        # Phase 0 — no lockfile yet; adopt `pip-compile --generate-hashes` in Phase 1.
        run: |
          python -m pip install --upgrade pip
          cd app && python -m pip install --editable ".[dev]"

      - name: format
        run: |
          cd app && python -m ruff format --check .

      - name: lint
        # Hard Rule: custom and vendored linters are always invoked from the repository root,
        # never scoped to a subdirectory that silently hides findings.
        run: |
          cd app && python -m ruff check .

      - name: typecheck
        run: |
          python -m mypy app/

      - name: tests
        # coverage.json is an input to the CRAP gate, not a nicety. Without it that gate fails
        # closed, which is the correct behaviour and a useless CI run — so produce it here.
        # The plugin is loaded by pyproject.toml so the CRITICAL_HELPERS gate fires too.
        # `-m "not integration"` skips the migration RED tests (they need a real Postgres;
        # devs run them locally with `pytest -m integration` after `docker compose up -d postgres`).
        # `--cov` (no argument) covers the cwd (which is `app/`), so the wiring pin test that
        # asserts `pytest --cov --cov-report=json:coverage.json` matches.
        run: |
          cd app && python -m pytest --cov --cov-fail-under=85 --cov-report=json:coverage.json --cov-report=term -m "not integration"

      - name: quality gates and indicators
        # Runs layers -> complexity -> CRAP -> DRY -> legacy_hashes in that fixed order,
        # writes quality-report.json, and renders the indicator table into the job summary.
        run: |
          python scripts/quality_report.py --root "$GITHUB_WORKSPACE" --include-pr-gates

      - name: publish indicators
        # `always()` so a failing gate still uploads the numbers that explain the failure.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-report
          path: quality-report.json
          if-no-files-found: error

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: dependency scan
        # Throwaway venv: the runner's ambient site-packages drags in CVEs that are not ours,
        # which trains everyone to ignore the report.
        run: |
          python -m venv .venv-audit
          .venv-audit/bin/python -m pip install --upgrade pip
          cd app && .venv-audit/bin/python -m pip install --editable .
          .venv-audit/bin/pip-audit --skip-editable