# Lanzadera MVP — security scanning (per PR).
#
# HARNESS-PROVENANCE: deterministic-quality-harness v1.4 — applies to lanzadera-mvp Phase 0.
# Scanner images are pinned by SHA256 digest (Hard Rule 6). Tags mutate silently;
# digests pin byte-for-byte content. Resolved at adoption (2026-08-09) via the
# Docker Hub registry API; re-resolve when bumping gitleaks or trivy.

name: security

on:
  pull_request:
  push:
    branches: [main, feat/lanzadera-mvp-tracker]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    # Docker-based scan. Routes to GitHub-hosted so it does not contend for the
    # single self-hosted runner with quality/mutation. Break the monopoly that
    # blocked reviewability feedback during the #117 retro split (#127).
    runs-on: ubuntu-24.04
    # Per-gate FIFO on this runner. A slow docker daemon stalls one invocation;
    # the next waits in submission order rather than racing.
    concurrency:
      group: gate-gitleaks
      cancel-in-progress: false
    # gitleaks normally finishes in <1 min on the 70 MB tree. The observed 17-min
    # hang on the self-hosted runner was the case this timeout is meant to catch.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: gitleaks dir
        # `gitleaks dir` scans the working tree. `--redact` replaces secrets with `***` in
        # any output; `--no-banner` keeps CI logs clean; `--exit-code 1` is the gate —
        # removing it is the APAP_WEB #393 antipattern (Hard Rule 1).
        #
        # `-v` is what makes the gate actionable (issue #106, Hard Rule 16). Without it
        # the job ends at "leaks found: 2" and nothing else: two findings and no way to
        # know what they are. A gate that reports a count with no subject does not
        # produce a correction, it produces a retreat — the reasonable-looking next
        # steps all become "simplify the workflow" or "revert", none of which touch the
        # finding. With `-v` the same run names the file, line, rule and fingerprint,
        # and the fingerprint is exactly what `.gitleaksignore` takes, so recording an
        # exception never requires reproducing the scan locally.
        #
        # `--redact` stays: the values remain out of the logs either way.
        #
        # The liveness proof below is not belt-and-braces (issue #115). On the first run
        # against the self-hosted runner this job went green having inspected nothing:
        #
        #   INF scanned ~0 bytes (0) in 1.99ms
        #   INF no leaks found
        #
        # The workspace was not visible to the host Docker daemon, so the bind mount
        # resolved to an empty directory. trivy failed loudly on the same broken mount
        # because it looks for one named file; gitleaks passed silently because it walks
        # a tree, and an empty tree has no secrets in it. Hard Rule 18: a measurement
        # that could not run must never score as a perfect one.
        #
        # The preflight `docker info` below (also from #127) catches the upstream
        # symptom — daemon hung — and exits non-zero with a clear message instead
        # of letting the job time out at 15 minutes with no diagnostic.
        run: |
          set -euo pipefail

          if ! docker info > /dev/null 2>&1; then
            echo "::error::docker daemon is not responding on the runner."
            echo "A hung daemon turns this job into a 15-minute silent timeout; fail fast instead."
            exit 1
          fi

          docker run --rm             -v "$PWD:/repo"             -w /repo             zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f             dir . --redact --no-banner -v --exit-code 1 2>&1 | tee /tmp/gitleaks.log
          status=${PIPESTATUS[0]}

          scanned=$(grep -oE 'scanned ~[0-9]+ bytes' /tmp/gitleaks.log | grep -oE '[0-9]+' | head -1)
          if [ -z "${scanned:-}" ]; then
            echo "::error::gitleaks did not report how many bytes it scanned; its verdict cannot be trusted."
            exit 1
          fi
          if [ "$scanned" -lt "$GITLEAKS_MIN_BYTES" ]; then
            echo "::error::gitleaks scanned $scanned bytes, below the $GITLEAKS_MIN_BYTES minimum."
            echo "That is a scan that did not happen, not a clean tree. Check that the workspace"
            echo "is visible to the Docker daemon (host path == container path)."
            exit 1
          fi
          echo "gitleaks: $scanned bytes inspected"
          exit "$status"
        env:
          # The tree is around 70 MB. The floor is deliberately far below that: it
          # separates "scanned nothing" from "scanned", and does not police repository
          # size, which grows and would turn the margin into noise.
          GITLEAKS_MIN_BYTES: "1000000"

  trivy-config:
    # Docker-based scan. GitHub-hosted runners ship Docker; routing here breaks
    # the monopoly #127.
    runs-on: ubuntu-24.04
    concurrency:
      group: gate-trivy-config
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: trivy config (Dockerfile)
        # `--severity HIGH,CRITICAL` filters below those levels — Phase 0 ships a clean
        # image; tightening the filter is a follow-up decision when Medias begin to appear.
        #
        # Pre-flight docker daemon check (issue #127) so a hung daemon doesn't turn
        # this into a silent 15-minute timeout.
        run: |
          set -euo pipefail

          if ! docker info > /dev/null 2>&1; then
            echo "::error::docker daemon is not responding on the runner."
            echo "A hung daemon turns this job into a 15-minute silent timeout; fail fast instead."
            exit 1
          fi

          docker run --rm             -v "$PWD:/repo"             -w /repo             aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c             config /repo/app/Dockerfile --severity HIGH,CRITICAL --exit-code 1

  pip-audit:
    # venv install + advisory DB download — no Docker, no self-hosted infra needed.
    # Routes to GitHub-hosted to free the VPS for quality/mutation.
    runs-on: ubuntu-24.04
    concurrency:
      group: gate-pip-audit
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Hard Rule 15: same SHA as ci.yml (issue #127 — old v5 SHA emits Node 20
      # deprecation warning on GitHub-hosted runners). Bumping keeps the pin
      # contract while clearing the warning.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"

      - name: dependency scan
        # Throwaway venv: the runner's ambient site-packages drags in CVEs that are not ours.
        # `--skip-editable` excludes the platform itself from the report.
        run: |
          set -euo pipefail
          python -m venv .venv-audit
          .venv-audit/bin/python -m pip install --quiet --upgrade pip==26.2.1
          .venv-audit/bin/python -m pip install --quiet "app[dev]"
          .venv-audit/bin/python -m pip install --quiet pip-audit==2.9.0

          # Liveness before reporting (Hard Rule 18). Two defects made this job
          # structurally unable to find anything: pip-audit was never installed
          # (exit 127), and `--no-deps` meant the dependency tree it exists to
          # audit was not in the venv. Installing the tool without dropping
          # --no-deps would have been strictly worse than the crash — a job
          # permanently green over an empty environment.
          #
          # So the count is checked before the verdict is trusted. A venv holding
          # only pip and the project is not a clean scan, it is a scan that did
          # not happen.
          installed=$(.venv-audit/bin/python -m pip list --format=freeze | wc -l)
          if [ "$installed" -lt 15 ]; then
            echo "::error::dependency scan aborted: only $installed packages in the venv."
            echo "That is not a clean audit, it is an audit with nothing to audit (Hard Rule 18)."
            exit 1
          fi
          echo "dependency scan: auditing $installed installed packages"

          .venv-audit/bin/pip-audit --strict