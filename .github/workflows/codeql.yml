# Issue #702: made reusable (`workflow_call` only), same treatment as
# security.yml, so `ci.yml` can embed it as a job (`uses: ./.github/workflows/
# codeql.yml`) and the new `required` aggregator can `needs:` it. The weekly
# schedule this workflow used to run independently is now inherited from
# ci.yml's own `schedule:` trigger instead (a different time of day than the
# `0 5 * * 1` this file used to declare, but the same weekly cadence).
name: codeql

on:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    concurrency:
      group: gate-codeql-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python
          build-mode: none

      - name: Analyze Python
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
