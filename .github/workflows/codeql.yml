# Issue #702: made reusable (`workflow_call` only), same treatment as
# security.yml, so `ci.yml` can embed it as a job (`uses: ./.github/workflows/
# codeql.yml`) and the new `required` aggregator can `needs:` it. The weekly
# schedule this workflow used to run independently is now inherited from
# ci.yml's own `schedule:` trigger instead (a different time of day than the
# `0 5 * * 1` this file used to declare, but the same weekly cadence).
name: codeql

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The id is not `codeql`: that name is the required job of ci.yml (the caller), and the canon
  # workflow-policy gate matches required names by job id. The check name stays `codeql`.
  analyze:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    concurrency:
      group: gate-codeql-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Primer paso EJECUTABLE del job: el contrato de tooling se prueba en el
      # runner que ejecuta este job (G0.5 del canon), no en el runner histórico.
      - name: Preflight del contrato de tooling del job
        run: |
          sh .agents/skills/ci-pattern/assets/tooling-preflight/tooling-preflight.sh \
            --binaries .github/tooling/analyze.txt \
            --runner "${{ runner.name }}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none

      - name: Analyze Python
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
