# Deriva del documento operativo (fase 5 de la adopción del patrón de CI, #781).
#
# `docs/ci-pattern-flow.md` se GENERA desde los datos del repositorio. Este job
# lo vuelve a generar con el MISMO pin del catálogo que lo declaró y falla si el
# documento derivó: el gate del patrón regenera el documento en el mismo proceso
# y lo compara por secciones, nombrando la sección y la diferencia.
#
# Se dispara solo en `schedule` y `workflow_dispatch` (decisión de #858): este
# job no caza defectos de código, solo deriva documental entre commits del
# catálogo pinneado, así que añadirlo al camino de los PRs o al `push` de main
# gastaría minutos sin valor de revisión. Ninguno de los eventos restantes
# evalúa un PR, así que este job no publica ningún nombre de check requerido
# (HR-30) y no necesita el secreto en PRs de fork.
#
# El commit del catálogo NO se escribe aquí (#1157). El paso `catalog-pin` lo lee
# del sello `# Auto-generado por propagate-team-skills.ps1 (catalog @ <sha>).` de la
# primera línea de `.team-skills.yaml`, que el propagador reescribe en cada
# propagación, y el checkout del catálogo toma ese output como `ref:`. Así el pin no
# puede quedar atrás del manifiesto: no hay nada que realinear a mano. Es el mismo
# commit del que se vendorizó el CLI que el repo ejecuta, así que la deriva se mide
# con el catálogo que el repo vende (#2276).
#
name: operating-doc-drift

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Un solo literal por workflow, igual que ci.yml: el intérprete es parte del gate.
  PYTHON_VERSION: "3.12.11"

jobs:
  operating-doc-drift:
    # Repositorio público: infraestructura efímera hospedada por GitHub, nunca
    # runners propios.
    runs-on: ubuntu-24.04
    concurrency:
      group: gate-operating-doc-drift-${{ github.ref }}
      cancel-in-progress: false
    # El checkout del pin y el gate tardan segundos; más de 10 minutos es un cuelgue.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false

      - name: disable sparse-checkout cone mode (runtime fallback)
        run: |
          if ! git sparse-checkout disable 2>/dev/null; then
            :
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup-python
        with:
          python-version: "3.12.11"

      # Primer paso EJECUTABLE del job: el contrato de tooling se prueba en el
      # runner que ejecuta este job (G0.5 del canon), no en el runner histórico.
      - name: Preflight del contrato de tooling del job
        run: |
          sh .agents/skills/ci-pattern/assets/tooling-preflight/tooling-preflight.sh \
            --binaries .github/tooling/operating-doc-drift.txt \
            --runner "${{ runner.name }}"

      - name: comprobar el secreto del catálogo
        # Sin el secreto no se puede leer el pin: se falla en voz alta y se nombra
        # el dato que falta, en vez de salir en verde sin haber medido (HR-3).
        env:
          CATALOG_TOKEN: ${{ secrets.TEAM_SKILLS_READ_TOKEN }}
        run: |
          if [ -z "${CATALOG_TOKEN}" ]; then
            echo "falta el secreto TEAM_SKILLS_READ_TOKEN en este repositorio:" >&2
            echo "sin el pin del catálogo la deriva del documento no se puede medir" >&2
            exit 1
          fi

      - name: resolver el commit del catálogo desde su sello (#1157)
        id: catalog-pin
        env:
          CATALOG_REPO: DysTelefonica/team-skills
          CATALOG_TOKEN: ${{ secrets.TEAM_SKILLS_READ_TOKEN }}
          CATALOG_API: https://api.github.com
          CATALOG_MANIFEST: .team-skills.yaml
        run: |
          set -euo pipefail
          if [ ! -f "$CATALOG_MANIFEST" ]; then
            echo "no existe $CATALOG_MANIFEST: sin ese manifiesto no hay forma de saber qué commit del catálogo se propagó a este repo (HR-3)." >&2
            exit 1
          fi
          seal=$(head -n 1 "$CATALOG_MANIFEST")
          case "$seal" in
            *"catalog @ "*) ;;
            *)
              echo "la primera línea de $CATALOG_MANIFEST no trae el sello 'catalog @ <sha>': no hay commit del catálogo que medir (HR-3)." >&2
              exit 1
              ;;
          esac
          commit=${seal#*catalog @ }
          commit=${commit%%)*}
          case "$commit" in
            "" | *[!0-9a-f]*)
              echo "el sello de $CATALOG_MANIFEST no trae un sha en hexadecimal: '$commit' (HR-3)." >&2
              exit 1
              ;;
          esac
          if [ "${#commit}" -lt 7 ] || [ "${#commit}" -gt 40 ]; then
            echo "el sello de $CATALOG_MANIFEST trae un commit de ${#commit} caracteres, no entre 7 y 40: '$commit' (HR-3)." >&2
            exit 1
          fi
          if [ "${#commit}" -lt 40 ]; then
            # El sello abreviado (`git rev-parse --short`) se expande con la API del catálogo.
            full=$(curl -fsS -H "Authorization: Bearer ${CATALOG_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${CATALOG_API}/repos/${CATALOG_REPO}/commits/${commit}" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])') || {
              echo "no se pudo resolver el sello abreviado '$commit' contra ${CATALOG_REPO} (HR-3)." >&2
              exit 1
            }
            if [ "${#full}" -ne 40 ] || [ "${full#"$commit"}" = "$full" ]; then
              echo "la API devolvió '$full' para el sello '$commit': no es el commit completo de ese prefijo (HR-3)." >&2
              exit 1
            fi
            commit=$full
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "commit del catálogo leído del sello de $CATALOG_MANIFEST: $commit"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DysTelefonica/team-skills
          # Del output del paso anterior, nunca escrito a mano (#1157).
          ref: ${{ steps.catalog-pin.outputs.commit }}
          token: ${{ secrets.TEAM_SKILLS_READ_TOKEN }}
          path: .ci-pattern-pin
          persist-credentials: false

      - name: verificar el documento operativo con el pin
        run: |
          set -euo pipefail
          cli=".ci-pattern-pin/personal/ardelperal/ci-pattern/assets/bin/ci-pattern"
          python3 "${cli}" params validate ci-pattern.yaml
          python3 "${cli}" adoption check --phase 5 .
