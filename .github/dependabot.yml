# Plantilla canónica del `.github/dependabot.yml` de un consumer (#1182).
#
# Un ecosystem por manifiesto: el `directory` de cada uno es el directorio donde
# vive el manifiesto de ese ecosystem. El consumer lo declara en su contrato
# (`dependabot.ecosystems`) y el canon genera este fichero; si el del consumer
# no coincide, el gate de la fase 5 lo dice (#1182).
#
# VALOR: el bloque `updates`, un ecosystem por manifiesto declarado. Dependabot
# actualiza el MANIFIESTO, no el lock: el lock lo regenera el PR que cambia el
# manifiesto (#1181).
version: 2

updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - type:chore
    commit-message:
      prefix: chore(platform)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
    labels:
      - dependencies
      - type:chore
    commit-message:
      prefix: ci(platform)

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - type:chore
    commit-message:
      prefix: chore(e2e)
